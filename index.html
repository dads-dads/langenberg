<style>
:root{--tkbild:url('auftrag.jpg');--frame:#5a4632;--board:#dde8c0;--board2:#eef2d8;--brass:#b08d3e;--card:#faf7ee;--ink:#2b2419}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,sans-serif;background:var(--frame);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
h1,h2,.serif{font-family:Georgia,serif;font-weight:normal}
#top{display:flex;align-items:center;gap:8px;padding:5px 8px;color:#f0e6d2;font-size:14px}
#chips{display:flex;gap:5px;overflow-x:auto;flex:1}
.pchip{display:flex;align-items:stretch;border-radius:6px;overflow:hidden;border:2px solid #00000055;background:#e8e0cc;flex-shrink:0;box-shadow:0 1px 3px #0004}
.pchip.aktiv{border-color:#ffd970;box-shadow:0 0 0 2px #ffd97088}
.pchip .ini{display:flex;align-items:center;padding:0 6px;font-weight:800;font-size:13px;color:#fff}
.pchip .sc{display:flex;align-items:center;padding:0 7px;font-size:19px;font-weight:800;color:#fff;font-family:Georgia,serif}
.pchip .wg{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 5px;background:#2b2419;color:#f0e6d2;font-size:12px;font-weight:700;line-height:1}
.pchip .wg small{font-size:8px;opacity:.8}
.pchip .wg2{display:flex;align-items:center;gap:2px;padding:0 5px;background:#3d3225;color:#f0e6d2;font-size:11px;font-weight:700}
.pchip .wg2 small{font-size:9px;opacity:.85;margin-right:3px}
.pchip .wg2 b{font-weight:700}
#top .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
#top b{font-size:21px;font-weight:800;letter-spacing:.01em}
#top .stat{background:rgba(255,255,255,.12);padding:3px 9px;border-radius:999px}
#roomtag{margin-left:auto;opacity:.9;letter-spacing:.1em}
#stage{flex:1;position:relative;background:radial-gradient(ellipse at 50% 40%,var(--board2),var(--board) 70%);touch-action:none;overflow:hidden;border-top:3px solid var(--brass);border-bottom:3px solid var(--brass)}
svg{position:absolute;inset:0;width:100%;height:100%}
.seg{fill:#fff;fill-opacity:0;stroke:none;pointer-events:all;cursor:pointer}
.wagon{pointer-events:none;filter:url(#w3d)}
.glowdot{pointer-events:none}
.nodeC{fill:#cfc8ba;stroke:#5a4632;stroke-width:2}
.nodeL{font-size:11.5px;font-weight:600;fill:#2b2419;paint-order:stroke;stroke:#f2f0e4;stroke-width:3px;pointer-events:none}
.rand .nodeL{font-family:Georgia,serif;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.wm{font-family:Georgia,serif;fill:#c9a35e;opacity:.3;letter-spacing:.35em;pointer-events:none}
#zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:38px;height:38px;border-radius:8px;border:1px solid var(--frame);background:var(--card);font-size:20px}
#bottom{background:var(--card);border-top:3px solid var(--brass);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#open{position:absolute;right:4px;top:4px;bottom:4px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:3px;z-index:6;pointer-events:none}
#open>*{pointer-events:all}
#open .pcard{width:min(17vw,74px);height:calc(min(17vw,74px)*0.652)}
#deckWrap{position:relative;margin-top:6px}
#deckWrap .cnt{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:#2b2419dd;color:#f0e6d2;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;white-space:nowrap}
#ablage{margin-top:4px;text-align:center;font-size:10px;color:#2b2419;background:#faf7eee6;border:1px solid #b08d3e;border-radius:6px;padding:3px 7px;line-height:1.2}
.pcard{width:74px;height:48px;border-radius:5px;border:1px solid #00000025;background-image:url('kartensatz.jpg');background-size:500% 200%;background-repeat:no-repeat;flex-shrink:0;position:relative;cursor:pointer;box-shadow:0 1px 3px #0003}
.pc-lok{background-position:0% 0%}.pc-rot{background-position:25% 0%}.pc-gruen{background-position:50% 0%}.pc-gelb{background-position:75% 0%}.pc-orange{background-position:100% 0%}
.pc-schwarz{background-position:0% 100%}.pc-weiss{background-position:25% 100%}.pc-pink{background-position:50% 100%}.pc-blau{background-position:75% 100%}.pc-rueck{background-position:100% 100%}
.pcard.sm{width:60px;height:39px}
.pcard.hoch{width:52px;height:79px;background-image:none;overflow:hidden}
.pcard.hoch i{position:absolute;left:50%;top:50%;width:79px;height:52px;display:block;
  transform:translate(-50%,-50%) rotate(90deg);background-image:url('kartensatz.jpg');background-size:500% 200%;background-repeat:no-repeat}
.pcard .n{position:absolute;bottom:1px;right:3px;font-size:12px;font-weight:700;color:#fff;background:#000000aa;border-radius:8px;padding:0 5px}
#gelWrap{position:relative}
#gelWrap .cnt{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:#2b2419dd;color:#f0e6d2;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;white-space:nowrap}
.gcard{background-size:cover;background-position:center;background-repeat:no-repeat;border:1px solid #6b5a3e}
.gsep{width:34px;height:2px;background:#00000030;border-radius:2px;margin:2px 0}
#handbox{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
#hand{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;flex:1;min-height:82px;align-items:flex-start}
#actions{display:flex;gap:8px}
#actions button{flex:1;padding:11px 6px;border-radius:9px;border:1.5px solid var(--frame);background:#fff;font-size:14px;font-weight:600}
#actions button:disabled{opacity:.4}
#waitbar{font-size:13px;color:#8a7d63;text-align:center;padding:5px 0 3px}
#waitbar .dranTxt{font-size:19px;font-weight:800;letter-spacing:.02em}
#waitbar .zeitTxt{font-size:12px;color:#8a7d63}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:var(--card);border-radius:14px;border:3px solid var(--brass);padding:18px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto}
.box h2{font-size:20px;margin-bottom:12px}
.box .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.box button.opt{display:block;width:100%;text-align:left;padding:12px;border-radius:9px;border:1.5px solid var(--frame);background:#fff;font-size:14px;margin-bottom:8px}
.box button.opt.sel{background:#efe8d4;border-width:2.5px}
.box .go{width:100%;padding:13px;border-radius:9px;border:0;background:var(--frame);color:#f0e6d2;font-size:16px;font-weight:600;margin-top:6px}
.box .go:disabled{opacity:.4}
.box .cancel{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--frame);background:#fff;font-size:14px;margin-top:8px}
.ticket{border:1.5px solid var(--frame);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.ticket.sel{background:#efe8d4;border-width:2.5px}
.ticket .pts{font-family:Georgia,serif;font-size:19px}
.ticket.done{border-color:#3e7d32;background:#eef5ea}
.tcard.lang{outline:3px solid #1d4ed8;outline-offset:-3px}
.tcard{position:relative;width:100%;aspect-ratio:var(--tkratio,991/621);background:var(--tkbild);background-size:100% 100%;border-radius:10px;border:3px solid #00000025;margin-bottom:8px;cursor:pointer;overflow:hidden}
.tcard.sel{border-color:#111;box-shadow:0 0 0 3px #111}
.tcard.done{border-color:#3e7d32;box-shadow:0 0 0 3px #3e7d32}
.tcard svg{position:absolute;inset:0;width:100%;height:100%}
.tcheck{position:absolute;top:6px;right:8px;background:#3e7d32;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px;border-radius:8px;border:1.5px solid #5a4632;background:#fff;font-size:14px;font-weight:600}
.tabs button.on{background:#5a4632;color:#f0e6d2}
.sdrow{margin:7px 0}
.sdname{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:2px}
.sdtrack{background:#e7dcc3;border:1.5px solid #5a463255;border-radius:999px;height:20px;overflow:hidden}
.sdfill{height:100%;border-radius:999px;transition:width .9s cubic-bezier(.25,.7,.3,1);min-width:0}
.sdrev{background:#fffdf6;border:1.5px solid #5a463233;border-radius:10px;padding:10px;margin:10px 0;min-height:56px;font-size:14px}
.sdpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fly{position:fixed;z-index:80;transition:transform .45s cubic-bezier(.2,.75,.3,1),opacity .45s;pointer-events:none;margin:0}
#chat{width:min(46vw,240px);flex-shrink:0;background:#faf7ee;border:2px solid #b08d3e;border-radius:10px;font-size:12px;overflow:hidden;align-self:stretch}
#chat h4{background:#5a4632;color:#f0e6d2;padding:5px 8px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;cursor:pointer}
#chatBody{height:110px;display:flex;flex-direction:column;padding:0} #chatMsgs{flex:1;overflow-y:auto;padding:5px 7px} #chatActs{border-top:1px solid #d8c9a8;background:#f5efdf;padding:3px 7px;max-height:62px;overflow-y:auto;flex-shrink:0}
#chatBody .last{color:#6b5322;padding:2px 0;line-height:1.35}
#chatBody .msg{padding:2px 0;line-height:1.35}
#chatBody .msg b{color:#2b2419}
#chatBody hr{border:0;border-top:1px solid #b08d3e55;margin:5px 0}
#chatIn{display:flex;gap:4px;padding:0 6px 6px}
#chatIn input{flex:1;padding:6px;border-radius:6px;border:1px solid #5a4632;font-size:13px;width:auto}
#chatIn button{padding:6px 9px;border-radius:6px;border:0;background:#5a4632;color:#f0e6d2;font-size:13px}
#chat.zu #chatBody,#chat.zu #chatIn{display:none}

/* ---- Querformat auf dem Handy: unteren Bereich flach halten ---- */
@media (orientation:portrait){
  #hand{display:grid;grid-template-columns:repeat(3,max-content);gap:5px;justify-content:start;align-content:start;overflow-x:hidden;overflow-y:auto;max-height:none}
}
@media (orientation:landscape) and (max-height:560px){
  body{display:grid;grid-template-columns:minmax(0,1fr) 262px;grid-template-rows:auto minmax(0,1fr)}
  #top{grid-column:1/3;grid-row:1;padding:3px 6px;gap:5px}
  #top b{font-size:16px}
  .pchip .sc{font-size:15px;padding:0 5px}
  .pchip .ini,.pchip .wg,.pchip .wg2{font-size:10px;padding:0 4px}
  #stage{grid-column:1;grid-row:2;min-height:0;border-bottom:none}
  #bottom{grid-column:2;grid-row:2;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
    border-top:none;border-left:3px solid var(--brass);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  #waitbar{padding:2px 0 4px;font-size:11px}
  #waitbar .dranTxt{font-size:14px}
  #handbox{flex-direction:column;align-items:stretch;gap:6px;margin-bottom:6px;flex:1;min-height:0}
  #hand{flex-wrap:wrap;overflow-y:auto;max-height:132px;min-height:0;width:100%;padding-bottom:2px}
  .pcard{width:62px;height:41px}
  .pcard.hoch{width:38px;height:57px}
  .pcard.hoch i{width:57px;height:38px}
  #open .pcard{width:min(9vw,52px);height:calc(min(9vw,52px)*0.652)}
  #chat{width:100%;flex:1;min-height:140px;display:flex;flex-direction:column}
  #chatBody{flex:1;height:auto;min-height:0}
  #chatIn{padding:0 4px 4px}
  #chatIn input{padding:4px 6px;font-size:12px}
  #chat h4{padding:3px 7px;font-size:11px}
  #actions{flex-direction:column;gap:6px}
  #actions button{width:100%;padding:8px 4px;font-size:12.5px}
  #zoom button{width:32px;height:32px;font-size:17px}
  .box{padding:12px;max-height:94vh}
  .box h2{font-size:17px;margin-bottom:8px}
  .tcard{max-width:270px;margin:0 auto 6px}
}
/* Sehr flache Bildschirme: Seitenleiste kompakter */
@media (orientation:landscape) and (max-height:430px){
  body{grid-template-columns:minmax(0,1fr) 236px}
  #hand{max-height:96px}
  .pcard{width:54px;height:36px}
  .pcard.hoch{width:33px;height:50px}
  .pcard.hoch i{width:50px;height:33px}
  #open .pcard{width:min(8vw,46px);height:calc(min(8vw,46px)*0.652)}
  #chat{min-height:110px}
  #actions button{padding:6px 3px;font-size:11.5px}
}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-weight:600;font-size:12px;border:1px solid #0003}
input[type=text]{padding:11px;border-radius:8px;border:1.5px solid var(--frame);font-size:16px;width:100%}
.reveal{display:flex;gap:8px;justify-content:center;margin:12px 0}
.score-row{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #00000015;font-size:14px}
.lob-p{display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:15px}
.codebig{font-family:Georgia,serif;font-size:34px;letter-spacing:.35em;text-align:center;margin:8px 0 2px;color:var(--frame)}
.hidden{display:none !important}
</style>
</head>

    return Object.values(a.erlaubt||{}).some(x=>String(x).toLowerCase()===name.toLowerCase());

async function hashPin(pin,code){
  const txt=code+':'+pin;
  if(window.crypto&&crypto.subtle){
    const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
    return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,32);
  }
  let h=5381;for(let i=0;i<txt.length;i++)h=((h<<5)+h+txt.charCodeAt(i))>>>0;return 'f'+h.toString(16);
}

  if(r.game){const g=r.game;
    g.deck=g.deck||[];g.discard=g.discard||[];g.open=g.open||[];g.ticketDeck=g.ticketDeck||[];
    g.claims=g.claims||{};g.startOffers=g.startOffers||{};g.ticketDeckLang=g.ticketDeckLang||[];g.picked=g.picked||{};g.pend=g.pend||[];g.frist=g.frist||0;g.zuege=g.zuege||0;if(g.rps){g.rps.aktiv=g.rps.aktiv||[];g.rps.wahl=g.rps.wahl||{}}

function newDeck(){const d=[];for(const c of ['rot','orange','gelb','gruen','blau','pink','weiss','schwarz'])for(let i=0;i<12;i++)d.push(c);for(let i=0;i<14;i++)d.push('lok');return shuffle(d)}
function drawCard(g){if(!g.deck.length){if(!g.discard.length)return null;g.deck=shuffle(g.discard);g.discard=[]}return g.deck.pop()}
function lokReset(g){let guard=0;
  while(g.open.filter(c=>c==='lok').length>=3&&(g.deck.length+g.discard.length)>=3&&guard++<20){g.discard.push(...g.open);g.open=[];while(g.open.length<5){const c=drawCard(g);if(c===null)break;g.open.push(c)}}}
function refillOpen(g){while(g.open.length<5){const c=drawCard(g);if(c===null)break;g.open.push(c)}lokReset(g)}

function gelGruppen(){return (GEL()&&GEL().gruppen)||{}}
function gelTypVon(farbe){const gr=gelGruppen();for(const t in gr)if(gr[t].indexOf(farbe)>=0)return t;return null}
function gelBild(t){return ((GEL()&&GEL().karten)||{})[t]||''}
function gelNeu(){const d=[];for(const t in gelGruppen())for(let i=0;i<15;i++)d.push(t);return shuffle(d)}
function gelZiehen(G){if(!G.gel.length){if(!G.gelDiscard.length)return null;G.gel=shuffle(G.gelDiscard);G.gelDiscard=[]}return G.gel.pop()}
function gelNachlegen(G){while(G.gelOpen.length<2){const c=gelZiehen(G);if(c===null)break;G.gelOpen.push(c)}}
function gelAnzahl(pl,t){return ((pl&&pl.gel)||{})[t]||0}
function gelMaxAndere(t){let m=0;(ROOM.players||[]).forEach((q,i)=>{if(i!==SEAT)m=Math.max(m,gelAnzahl(q,t))});return m}

function hostStart(){
  const rs=R().startauftraege||{};
  const alle=MAP.auftraege.map(t=>{const o={von:t.von,nach:t.nach,punkte:t.punkte};if(t.lang)o.lang=true;return o});
  const langD=shuffle(alle.filter(t=>t.lang));
  const g={deck:newDeck(),discard:[],open:[],ticketDeck:shuffle(alle.filter(t=>!t.lang)),
    turn:0,drawn:0,claims:{},startOffers:{},picked:{},lastRounds:-1,over:false};
  if(rs.stapelwahl)g.ticketDeckLang=langD;
  refillOpen(g);
  if(GEL()){g.gel=gelNeu();g.gelOpen=[];g.gelDiscard=[]}
  ROOM.players.forEach((p,i)=>{p.wagons=ROOM.test?9999:WAGONS();p.hand={};p.tickets=[];p.score=0;p.bahnhoefe=[];
    for(let k=0;k<4;k++){const c=drawCard(g);p.hand[c]=(p.hand[c]||0)+1}
    if(GEL()){p.gel={};const gc=gelZiehen(g);if(gc)p.gel[gc]=1}
    let off;
    if(rs.stapelwahl){const n=rs.ziehen||4;off={kurz:g.ticketDeck.splice(0,n),lang:g.ticketDeckLang.splice(0,n)}}
    else if(rs.lange_ziehen)off=langD.splice(0,rs.lange_ziehen).concat(g.ticketDeck.splice(0,rs.normale_ziehen||5));
    else if(rs.lange_strecken)off=langD.splice(0,rs.lange_strecken).concat(g.ticketDeck.splice(0,rs.normale_strecken||3));
    else off=g.ticketDeck.splice(0,rs.ziehen||5);
    g.startOffers[i]=off});
  if(GEL())gelNachlegen(g);

  if(!ROOM.test&&ROOM.players.length>1){g.rps={runde:1,aktiv:ROOM.players.map((p,i)=>i),wahl:{}};ROOM.game=g;ROOM.status='rps'}

}

  if(s.doppel_mit){const p=MAP.strecken.find(x=>x.nr===s.doppel_mit);if(p){grp.push(p);seen.add(p.nr)}}

function pathPts(s){const pts=[P(s.von)];(s.via||[]).forEach(v=>pts.push({x:v[0]*10,y:v[1]*(BH/100)}));pts.push(P(s.nach));return pts}
function layout(s,off){
  const pts=pathPts(s),L=[];let tot=0;
  for(let i=1;i<pts.length;i++){const dd=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);L.push(dd);tot+=dd}
  const pad=Math.min(15,tot*0.1),inner=tot-2*pad,n=s.laenge;
  const gap=Math.min(5,inner*.06/n+1.5),segL=(inner-gap*(n-1))/n,out=[];
  for(let i=0;i<n;i++){
    const target=pad+segL/2+i*(segL+gap);
    let acc=0,seg=0;while(seg<L.length-1&&acc+L[seg]<target)acc+=L[seg++];
    const a=pts[seg],b2=pts[seg+1],ux=(b2.x-a.x)/L[seg],uy=(b2.y-a.y)/L[seg];
    out.push({x:a.x+ux*(target-acc)-uy*off,y:a.y+uy*(target-acc)+ux*off,ang:Math.atan2(uy,ux)*180/Math.PI,segL})
  }
  return out;
}

  const pairCount={},pairIdx={};
  conns.forEach(g=>{const k=[g[0].von,g[0].nach].sort().join('|');pairCount[k]=(pairCount[k]||0)+1});
  conns.forEach(g2=>{
    const s0=g2[0];
    const pk=[s0.von,s0.nach].sort().join('|'),which=(pairIdx[pk]=(pairIdx[pk]||0)+1);
    const base=(pairCount[pk]>1)?(which===1?-8:8):0;
    g2.forEach((s,gi)=>{
      const grp=el('g',{class:'route'});
      if(s.felder&&s.felder.length===s.laenge){

            transform:'rotate('+c.ang+' '+c.x+' '+c.y+')'});

// ---------- Zuglogik (nur wer dran ist, verändert den Zustand) ----------
const g=()=>ROOM.game;
const me=()=>ROOM.players[SEAT];
const cur=()=>ROOM.players[g().turn];
const myTurn=()=>g()&&!g().over&&g().turn===SEAT&&ROOM.status==='playing';

function zugText(l){
  if(!l||!l.length)return null;
  const p=l.map(x=>x==='?'?'eine verdeckte Karte':(x==='lok'?'einen Joker':'eine '+CNAME[x]+'-Karte'));
  return 'zieht '+(p.length>1?p.slice(0,-1).join(', ')+' und '+p[p.length-1]:p[0]);
}
function endTurn(){
  window._blind1=null;
  const G=g();G.drawn=0;
  G.zuege=(G.zuege||0)+1;
  const zt=zugText(G.pend);
  if(zt){cur().last=zt;G.notice=cur().name+' '+zt}
  delete G.pend;
  if(ROOM.test){G.turn=0;sync();return}
  if(G.lastRounds<0&&cur().wagons<=2){G.lastRounds=ROOM.players.length;me().last='läutet die letzte Runde ein';G.notice=cur().name+' hat nur noch '+cur().wagons+' Wagons – letzte Runde! '+cur().name+' ist als Letzter noch einmal dran.'}
  else if(G.lastRounds>0){G.lastRounds--;if(G.lastRounds===0){G.over=true;ROOM.status='over';finalScore();sync();return}}
  G.turn=(G.turn+1)%ROOM.players.length;G.frist=limitMs()?Date.now()+limitMs():0;sync();
}

function takeOpen(i){if(!myTurn()||g().drawn>=2)return;
  const c=g().open[i];const lokFrei=!!R().lok_frei_ziehen;
  if(c==='lok'&&!lokFrei&&g().drawn>0){toast('Ein offener Joker zählt als ganzer Zug.');return}
  const src=document.querySelectorAll('#open .pcard')[i+1];if(src)flyCard(src,'pc-'+c);
  const nc=drawCard(g());if(nc===null){g().open.splice(i,1)}else{g().open[i]=nc}
  me().hand[c]=(me().hand[c]||0)+1;lokReset(g());
  (g().pend=g().pend||[]).push(c);g().drawn+=(c==='lok'&&!lokFrei)?2:1;g().drawn>=2?endTurn():sync()}
function takeBlind(){if(!myTurn()||g().drawn>=2)return;const c=drawCard(g());if(c===null){toast('Keine Karten mehr im Stapel.');return}
  const dk=document.querySelector('#open .pc-rueck');if(dk)flyCard(dk,'pc-rueck');
  if(g().drawn===0){window._blind1=c;toast('Verdeckt gezogen: '+(CNAME[c]||c))}
  else{const v1=window._blind1?((CNAME[window._blind1]||window._blind1)+' + '):'';
    toast('Verdeckt gezogen: '+v1+(CNAME[c]||c));window._blind1=null}
  me().hand[c]=(me().hand[c]||0)+1;(g().pend=g().pend||[]).push('?');g().drawn+=1;g().drawn>=2?endTurn():sync()}

function takeGel(i){
  if(!myTurn()||g().drawn>=2)return;
  const G=g();let c;
  if(i===-1){c=gelZiehen(G);if(c===null){toast('Keine Landschaftskarten mehr.');return}}
  else{c=(G.gelOpen||[])[i];if(c===undefined)return;G.gelOpen.splice(i,1);gelNachlegen(G)}
  const p=me();p.gel=p.gel||{};p.gel[c]=(p.gel[c]||0)+1;
  (G.pend=G.pend||[]).push('gel');G.drawn+=1;
  toast('Landschaftskarte: '+GELNAME[c]);
  G.drawn>=2?endTurn():sync();
}

function tryClaim(s){
  if(!myTurn()){toast(ROOM.status==='playing'?'Du bist nicht dran – '+cur().name+' ist am Zug.':'');return}
  if(g().drawn>0){toast('Du hast schon Karten gezogen – erst den Zug beenden.');return}
  if(g().claims[s.nr]!==undefined){toast('Diese Strecke ist schon gebaut.');return}
  if(ROOM.test){doClaim(s,{col:s.farbe,use:0,lok:0});return}
  const p=me();
  if(p.wagons<s.laenge){toast('Nicht genug Wagons ('+p.wagons+' übrig).');return}
  if(s.doppel_mit!==undefined){
    const other=g().claims[s.doppel_mit];
    if(other!==undefined){
      const abD=R().doppelstrecken_frei_ab||3;
      if(ROOM.players.length<abD){toast('Bei weniger als '+abD+' Spielern ist nur ein Gleis einer Doppelstrecke nutzbar.');return}
      if(other===SEAT){toast('Beide Gleise einer Doppelstrecke dürfen nicht demselben Spieler gehören.');return}
    }
  }
  const fz=s.faehre||0;
  const loks=p.hand.lok||0;
  if(fz&&loks<fz){toast('Fähre: Du brauchst mindestens '+fz+' Joker.');return}
  const nurFT=!!R().lok_nur_faehre_tunnel&&!s.faehre&&!s.tunnel;
  const maxLok=nurFT?0:Math.min(loks,s.laenge);
  const opts=[];const gesehen=new Set();
  const colors=s.farbe==='grau'?['rot','orange','gelb','gruen','blau','pink','weiss','schwarz']:[s.farbe];
  for(const col of colors){
    const have=p.hand[col]||0;
    for(let l=fz;l<=maxLok;l++){
      const use=s.laenge-l;
      if(have<use)continue;
      const key=use?col+':'+use+':'+l:'lok:'+l;
      if(gesehen.has(key))continue;gesehen.add(key);
      opts.push({col,use,lok:l});
    }
  }
  if(!opts.length){toast(fz?'Nicht genug Karten für die Fähre.':'Nicht genug passende Karten ('+s.laenge+' '+CNAME[s.farbe]+')'+(nurFT?' – Joker gibt es hier nur für Fähren und Tunnel.':'.'));return}
  payModal(s,opts);
}
function payModal(s,opts){
  const vn=nodes[s.von].name,nn=nodes[s.nach].name;let sel=0;
  const m=modal('<h2>'+vn+' – '+nn+'</h2><p style="font-size:14px;margin-bottom:10px">Länge '+s.laenge+' · Farbe: '+CNAME[s.farbe]+(s.tunnel?' · <b>Tunnel</b>':'')+(s.faehre?' · <b>Fähre ('+s.faehre+' Joker Pflicht)</b>':'')+(s.s9?' · S9':'')+'</p><div id="payopts"></div><button class="go" id="payGo">'+(s.tunnel?'Tunnel bauen (3 Karten aufdecken)':'Strecke bauen')+(s.tunnel?'<div style=\"font-size:12px;color:#8a7d63;margin-top:6px;text-align:center\">Reichen deine Karten für den Aufschlag nicht oder willst du nicht zahlen, ist dein Zug vorbei.</div>':'')+'</button><button class="cancel" id="payNo">Abbrechen</button>');
  const wrap=m.querySelector('#payopts');
  opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt'+(i===0?' sel':'');
    b.innerHTML=(o.use?o.use+'× <span class="chip" style="background:'+CARDCOL[o.col]+';'+(o.col==='gelb'||o.col==='weiss'?'color:#333':'')+'">'+CNAME[o.col]+'</span> ':'')+(o.lok?(o.use?'+ ':'')+o.lok+'× <span class="chip" style="background:'+CARDCOL.lok+'">Joker</span>':'');
    b.onclick=()=>{sel=i;wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};
    wrap.appendChild(b)});

function tunnelAbbruch(s,grund){

function tunnelStep(s,o){
  const G=g(),rev=[];for(let i=0;i<3;i++){const c=drawCard(G);if(c!==null)rev.push(c)}
  const allLok=o.use===0;
  const extra=rev.filter(c=>allLok?c==='lok':(c===o.col||c==='lok')).length;
  G.discard.push(...rev);
  const p=me();
  let html='<h2>Tunnel: 3 Karten aufgedeckt</h2><div class="reveal">'+rev.map(c=>'<div class="pcard sm pc-'+c+'" title="'+CNAME[c]+'"></div>').join('')+'</div>';
  if(extra===0){html+='<p style="text-align:center;font-size:15px">Keine zusätzlichen Karten nötig!</p><button class="go" id="tOk">Bauen</button>';
    const m=modal(html);m.querySelector('#tOk').onclick=()=>{m.remove();gelaendeFrage(s,o)};return}
  const extraCol=(p.hand[o.col]||0)-o.use,extraLok=(p.hand.lok||0)-o.lok;
  const can=[];
  for(let l=0;l<=Math.min(extraLok,extra);l++){if((allLok?0:extraCol)>=extra-l||(allLok&&l===extra))can.push({use:allLok?0:extra-l,lok:l})}
  if(!can.length){html+='<p style="font-size:14px">Du musst <b>'+extra+'</b> zusätzliche Karte(n) zahlen, hast aber nicht genug. Du behältst deine Karten – <b>dein Zug ist damit vorbei</b>.</p><button class="go" id="tOk">Verstanden</button>';
    const m=modal(html);m.querySelector('#tOk').onclick=()=>{m.remove();tunnelAbbruch(s,'kann die '+extra+' zusätzliche(n) Karte(n) aber nicht zahlen')};return}
  html+='<p style="font-size:14px;margin-bottom:8px">Zusätzlich fällig: <b>'+extra+'</b> Karte(n) in '+(allLok?'Joker':CNAME[o.col]+'/Joker')+'.</p><div id="topts"></div><button class="go" id="tPay">Zahlen und bauen</button><button class="cancel" id="tNo">Nicht zahlen (Zug ist dann vorbei)</button>';
  const m=modal(html);const wrap=m.querySelector('#topts');let sel=0;
  can.forEach((c2,i)=>{const b=document.createElement('button');b.className='opt'+(i===0?' sel':'');
    b.textContent=(c2.use?c2.use+'× '+CNAME[o.col]:'')+(c2.use&&c2.lok?' + ':'')+(c2.lok?c2.lok+'× Joker':'');
    b.onclick=()=>{sel=i;wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};wrap.appendChild(b)});
  m.querySelector('#tNo').onclick=()=>{m.remove();tunnelAbbruch(s,'zahlt die '+extra+' zusätzliche(n) Karte(n) aber nicht')};
  m.querySelector('#tPay').onclick=()=>{m.remove();const c2=can[sel];gelaendeFrage(s,{col:o.col,use:o.use+c2.use,lok:o.lok+c2.lok})};
}
function gelaendeFrage(s,o){
  const t=GEL()?gelTypVon(s.farbe):null;
  if(!t){doClaim(s,o);return}
  const p=me(),noetig=gelKosten(s.laenge),eigen=gelAnzahl(p,t),andere=gelMaxAndere(t);
  const frei=Math.max(0,(p.hand.lok||0)-(o.lok||0));
  let w=null;
  for(let l=0;l<=frei;l++){const eff=eigen+l;
    if(eff>=noetig&&eff>=andere){w={typ:t,karten:Math.min(eigen,noetig),lok:l};break}}
  if(!w){doClaim(s,o);return}
  const pkt=PTSv(s.laenge);
  const einsatz=(w.karten?w.karten+'× '+GELNAME[t]:'')+(w.karten&&w.lok?' + ':'')+(w.lok?w.lok+'× Joker':'');
  const m=modal('<h2>Punkte verdoppeln?</h2>'
    +'<p style="font-size:14px;margin-bottom:10px">'+nodes[s.von].name+' – '+nodes[s.nach].name
    +' bringt '+pkt+' Punkte. Mit Landschaftskarten werden daraus <b>'+(pkt*2)+'</b>.</p>'
    +'<p style="font-size:14px;margin-bottom:10px">Einsatz: <b>'+einsatz+'</b>'
    +(w.lok?' – Joker ersetzen fehlende Landschaftskarten.':'')+'</p>'
    +'<p style="font-size:13px;color:#8a7d63;margin-bottom:10px">Du hast danach '+(eigen-w.karten)
    +'× '+GELNAME[t]+' vor dir liegen.</p>'
    +'<button class="go" id="gelJa">Verdoppeln</button>'
    +'<button class="cancel" id="gelNein">Ohne Verdoppelung bauen</button>');
  m.querySelector('#gelJa').onclick=()=>{m.remove();doClaim(s,o,w)};
  m.querySelector('#gelNein').onclick=()=>{m.remove();doClaim(s,o)};
}
function doClaim(s,o,gel){
  const G=g(),p=me();
  if(o.use){p.hand[o.col]-=o.use;if(!p.hand[o.col])delete p.hand[o.col];for(let i=0;i<o.use;i++)G.discard.push(o.col)}
  if(o.lok){p.hand.lok-=o.lok;if(!p.hand.lok)delete p.hand.lok;for(let i=0;i<o.lok;i++)G.discard.push('lok')}
  if(gel){p.gel=p.gel||{};
    if(gel.karten){p.gel[gel.typ]=(p.gel[gel.typ]||0)-gel.karten;if(!p.gel[gel.typ])delete p.gel[gel.typ];
      for(let i=0;i<gel.karten;i++)(G.gelDiscard=G.gelDiscard||[]).push(gel.typ)}
    if(gel.lok){p.hand.lok-=gel.lok;if(!p.hand.lok)delete p.hand.lok;for(let i=0;i<gel.lok;i++)G.discard.push('lok')}}
  const pkt=PTSv(s.laenge)*(gel?2:1);
  p.wagons-=s.laenge;p.score+=pkt;
  // Im Testmodus zusaetzlich Streckennummer, Laenge und Farbe ausweisen (Kontrolle der Kartendaten)
  const info=ROOM.test?' [#'+s.nr+', '+s.laenge+'× '+(s.farbe==='grau'?'Grau':CNAME[s.farbe])
    +(s.faehre?', Fähre '+s.faehre:'')+(s.tunnel?', Tunnel':'')+']':'';
  G.claims[s.nr]=SEAT;p.last='baut '+nodes[s.von].name+' – '+nodes[s.nach].name+info+' (+'+pkt+(gel?', verdoppelt mit '+GELNAME[gel.typ]:'')+')';G.notice=p.name+' '+p.last;
  endTurn();
}

let BHX={};
function bhRegel(){return R().bahnhoefe||{}}
function bhAnzahl(){return bhRegel().anzahl||0}
function bhKosten(n){const k=bhRegel().kosten||[1,2,3];return k[n]!==undefined?k[n]:(n+1)}
function bhBesetzt(){const s=new Set();(ROOM.players||[]).forEach(q=>(q.bahnhoefe||[]).forEach(c=>s.add(c)));return s}
function bhOptionen(pi){
  const p=ROOM.players[pi],st=(p&&p.bahnhoefe)||[];
  return st.map(cityId=>{const o=[null];
    MAP.strecken.forEach(s=>{const c=g().claims[s.nr];
      if(c===undefined||c===pi)return;
      if(s.von===cityId||s.nach===cityId)o.push(s.nr)});
    return o});
}
function bhWahlBerechnen(pi){
  const p=ROOM.players[pi];
  if(!bhAnzahl()||!p||!(p.bahnhoefe||[]).length){BHX[pi]=null;return}
  const lists=bhOptionen(pi);
  if(lists.reduce((a,l)=>a*l.length,1)>4000){BHX[pi]=null;return}
  let best=null,bestVal=-1e9;
  const rec=(i,acc)=>{
    if(i===lists.length){
      BHX[pi]=new Set(acc);
      let v=0;(p.tickets||[]).forEach(t=>{v+=connected(pi,t)?t.punkte:-t.punkte});
      if(v>bestVal){bestVal=v;best=new Set(acc)}
      return}
    lists[i].forEach(o=>rec(i+1,o===null?acc:acc.concat([o])));
  };
  rec(0,[]);
  BHX[pi]=best;
}

      +(o.lok?(o.use?'+ ':'')+o.lok+'× <span class="chip" style="background:'+CARDCOL.lok+'">Joker</span>':'');
    b.onclick=()=>{sel=i;wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};

const ROTE_ORTE=new Set(['Gymnasium','Bahnhof','Sender','Pollen','Vogelsiedlung','Rathaus','Busbahnhof']);
let AUSSEN_ORTE=new Set();
let TPOSL={};MAP.knoten.forEach(k=>{const n=k.name.replace(/ \((Nordost|Ost)\)/,'');(TPOSL[n]=TPOSL[n]||[]).push(k.tkx!=null?[k.x,k.y,k.tkx,k.tky]:[k.x,k.y]);if(k.rand)AUSSEN_ORTE.add(n)});
function ticketCard(tk,cls,badge){
  const M=MAP.meta||{},TK=M.tk||{},VB=M.tk_vb||{};
  const VW=VB.w||991,VH=VB.h||621,HOCH=!!M.tk_hoch;
  const MX0=TK.mx0||25,MY0=TK.my0||77,MW=TK.mw||933,MH=TK.mh||509,CX=MX0+MW/2,CY=MY0+MH/2;
  const pts=n=>TPOSL[n].map(q=>q.length>2?[q[2]/100*VW,q[3]/100*VH]:[MX0+q[0]/100*MW, MY0+q[1]/100*MH]);
  let A=pts(tk.von),B=pts(tk.nach);
  // Mehrfach-Einmündungen (z.B. Nachbarländer) auf ein Ziel reduzieren:
  // es bleibt die Einmündung, die dem anderen Auftragsende am nächsten liegt.
  if(M.tk_einzelziel&&(A.length>1||B.length>1)){
    const mit=a=>[a.reduce((s,p)=>s+p[0],0)/a.length,a.reduce((s,p)=>s+p[1],0)/a.length];
    const nah=(a,t)=>a.length<2?a:[a.reduce((b,p)=>Math.hypot(p[0]-t[0],p[1]-t[1])<Math.hypot(b[0]-t[0],b[1]-t[1])?p:b)];
    const ca=mit(A),cb=mit(B);A=nah(A,cb);B=nah(B,ca);
  }
  const r1=ROTE_ORTE.has(tk.von),r2=ROTE_ORTE.has(tk.nach);
  const au1=AUSSEN_ORTE.has(tk.von),au2=AUSSEN_ORTE.has(tk.nach);
  const lc=r1&&r2?'#cc0000':(r1||r2?'#e88a00':'#111');
  let svg='';

  const mark=(p,rot,aussen)=>{
    const f=rot?'#cc0000':'#111', s=rot?'#111':'#cc0000';
    if(!aussen)return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="15" fill="'+f+'" stroke="'+s+'" stroke-width="5"/>';
    const dx=p[0]-CX,dy=p[1]-CY,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;
    const tip=[p[0]+ux*34,p[1]+uy*34],b1=[p[0]-ux*4+px*17,p[1]-uy*4+py*17],b2=[p[0]-ux*4-px*17,p[1]-uy*4-py*17];
    return '<polygon points="'+tip+' '+b1+' '+b2+'" fill="'+f+'" stroke="'+s+'" stroke-width="4"/>';
  };
  A.forEach(p=>svg+=mark(p,r1,au1));
  B.forEach(p=>svg+=mark(p,r2,au2));
  const name=(n,rot)=>'<tspan fill="'+(rot?'#cc0000':(TT.farbe||'#111'))+'">'+n+'</tspan>';
  const F='font-family="Arial,sans-serif" font-weight="900"';
  const TT=M.tk_titel||{},TP=M.tk_punkte||{};
  const ty1=TT.y1||62,ty2=TT.y2||114,tfs=TT.font||40;
  const titel=HOCH
    ? '<text x="'+(VW/2)+'" y="'+ty1+'" text-anchor="middle" font-size="'+tfs+'" '+F+' text-decoration="underline">'+name(tk.von,r1)+'</text>'
      +'<text x="'+(VW/2)+'" y="'+ty2+'" text-anchor="middle" font-size="'+tfs+'" '+F+' text-decoration="underline">'+name(tk.nach,r2)+'</text>'
    : '<text x="'+(VW/2)+'" y="56" text-anchor="middle" font-size="46" '+F+' text-decoration="underline">'
      +name(tk.von,r1)+'<tspan fill="#111"> - </tspan>'+name(tk.nach,r2)+'</text>';
  const langX=HOCH?128:70, langY=HOCH?1082:576, langS=HOCH?30:34;
  const pktX=TP.x||(HOCH?572:920), pktY=TP.y||(HOCH?1085:576), pktF=TP.font||48;
  return '<div class="tcard '+(cls||'')+(tk.lang?' lang':'')+'">'
    +'<svg viewBox="0 0 '+VW+' '+VH+'" preserveAspectRatio="none">'
    +titel
    +svg
    +(tk.lang?'<text x="'+langX+'" y="'+langY+'" font-size="'+langS+'" '+F+' fill="#1d4ed8">LANGE STRECKE</text>':'')
    +'<text x="'+pktX+'" y="'+pktY+'" text-anchor="middle" font-size="'+pktF+'" '+F+' fill="'+(TP.farbe||'#cc0000')+'">'+tk.punkte+'</text>'
    +'</svg>'+(badge?'<div class="tcheck">✓</div>':'')+'</div>';

let RAND={};MAP.knoten.forEach(k=>{if(k.rand)RAND[k.id]=k.stadt||k.id});
function connected(pi,t){
  // Außenstädte sind Sackgassen: Strecken führen hinein, aber nicht hindurch
  const par={};const find=x=>par[x]===x?x:par[x]=find(par[x]);
  MAP.knoten.forEach(k=>{if(!RAND[k.id])par[k.id]=k.id});
  const uni=(a,b)=>{par[find(a)]=find(b)};
  const bx=BHX[pi];
  const nutzbar=s=>g().claims[s.nr]===pi||(bx&&bx.has(s.nr));
  MAP.strecken.forEach(s=>{if(!nutzbar(s))return;
    if(!RAND[s.von]&&!RAND[s.nach])uni(s.von,s.nach)});
  // Strecken zwischen zwei Randknoten (z.B. Madagaskar) sind durchfahrbar:
  // wer sie besitzt, verbindet damit auch die Netze an beiden Randknoten.
  const rpar={},rfind=x=>rpar[x]===x?x:rpar[x]=rfind(rpar[x]);
  MAP.knoten.forEach(k=>{if(RAND[k.id])rpar[k.id]=k.id});
  let durchfahrt=false;
  MAP.strecken.forEach(s=>{if(!nutzbar(s))return;
    if(RAND[s.von]&&RAND[s.nach]&&rfind(s.von)!==rfind(s.nach)){rpar[rfind(s.von)]=rfind(s.nach);durchfahrt=true}});
  if(durchfahrt){
    const anz={},anschluss={};
    MAP.knoten.forEach(k=>{if(RAND[k.id]){const r=rfind(k.id);anz[r]=(anz[r]||0)+1}});
    MAP.strecken.forEach(s=>{if(!nutzbar(s))return;
      const r=RAND[s.von]?s.von:(RAND[s.nach]?s.nach:null);if(!r)return;
      const o=RAND[s.von]?s.nach:s.von;if(RAND[o])return;
      const k=rfind(r);(anschluss[k]=anschluss[k]||[]).push(o)});
    Object.keys(anschluss).forEach(k=>{if(anz[k]>1)anschluss[k].forEach((o,i)=>{if(i)uni(anschluss[k][0],o)})});
  }
  const touches={};
  MAP.strecken.forEach(s=>{if(!nutzbar(s))return;
    if(RAND[s.von]&&!RAND[s.nach])(touches[RAND[s.von]]=touches[RAND[s.von]]||new Set()).add(find(s.nach));
    if(RAND[s.nach]&&!RAND[s.von])(touches[RAND[s.nach]]=touches[RAND[s.nach]]||new Set()).add(find(s.von))});
  const A=nameToIds[t.von]||[],B=nameToIds[t.nach]||[];
  const cityOf=ids=>{for(const i of ids)if(RAND[i])return RAND[i];return null};
  const ca=cityOf(A),cb=cityOf(B);
  if(!ca&&!cb)return A.some(a=>B.some(b=>find(a)===find(b)));
  if(ca&&!cb)return !!touches[ca]&&touches[ca].has(find(B[0]));
  if(!ca&&cb)return !!touches[cb]&&touches[cb].has(find(A[0]));
  if(!touches[ca]||!touches[cb])return false;
  for(const r of touches[ca])if(touches[cb].has(r))return true;
  return false;
}
function laengsteFor(pi){
  const adj={};MAP.strecken.forEach(s=>{if(g().claims[s.nr]!==pi)return;
    const a=RAND[s.von]?s.von+'#'+s.nr:s.von,b=RAND[s.nach]?s.nach+'#'+s.nr:s.nach;
    (adj[a]=adj[a]||[]).push({to:b,len:s.laenge,nr:s.nr});(adj[b]=adj[b]||[]).push({to:a,len:s.laenge,nr:s.nr})});
  let best=0;const used=new Set();
  function dfs(v,acc){if(acc>best)best=acc;for(const e of (adj[v]||[])){if(used.has(e.nr))continue;
    used.add(e.nr);dfs(e.to,acc+e.len);used.delete(e.nr)}}
  for(const v in adj)dfs(v,0);return best;
}
function finalScore(){
  ROOM.players.forEach((p,i)=>bhWahlBerechnen(i));
  const bhP=(bhRegel().punkte_pro_ungebautem)||0;
  const bhN=bhAnzahl();
  const bonus=R().laengste_strecke_bonus||0;
  const lang=bonus?ROOM.players.map((p,i)=>laengsteFor(i)):null;
  const maxL=lang?Math.max(...lang):0;
  const abon=R().meiste_auftraege_bonus||0;
  const cnts=abon?ROOM.players.map((p,i)=>p.tickets.filter(t=>connected(i,t)).length):null;
  const maxC=cnts?Math.max(...cnts):0;
  ROOM.players.forEach((p,i)=>{
    let tP=0,tM=0;p.tickets.forEach(t=>{connected(i,t)?tP+=t.punkte:tM+=t.punkte});
    const lb=(lang&&lang[i]===maxL&&maxL>0)?bonus:0;
    const ab=(cnts&&cnts[i]===maxC&&maxC>0)?abon:0;
    const bhRest=bhN?Math.max(0,bhN-((p.bahnhoefe||[]).length)):0;
    const bhb=bhN?bhRest*bhP:0;
    p.res={strecken:p.score,plus:tP,minus:tM};
    if(lang){p.res.laengste=lang[i];p.res.bonus=lb}
    if(cnts){p.res.auftr=cnts[i];p.res.abonus=ab}
    if(bhN){p.res.bhRest=bhRest;p.res.bhbonus=bhb}
    p.total=p.score+tP-tM+lb+ab+bhb;
  });
}

function limitMs(r){r=r||ROOM;return r&&r.limitMin?r.limitMin*60000:(r&&r.limitH?r.limitH*3600000:0)}
function restText(){
  if(!limitMs()||!g()||!g().frist||ROOM.status!=='playing')return null;
  const ms=g().frist-Date.now();
  if(ms<=0)return {ab:true};
  const h=Math.floor(ms/3600000),mi=Math.floor(ms/60000)%60;
  return {ab:false,txt:h>0?('noch '+h+' Std. '+mi+' Min.'):('noch '+mi+' Min.')};
}
function strafZug(){
  const G=g();if(!G||ROOM.status!=='playing'||!limitMs()||!G.frist||G.frist>Date.now())return;
  const p=cur(),gez=[];
  for(let k=0;k<2;k++){const c=drawCard(G);if(c===null)break;p.hand[c]=(p.hand[c]||0)+1;gez.push(c)}
  delete G.pend;G.drawn=0;G.zuege=(G.zuege||0)+1;
  const t=gez.length?('hat die Zugzeit überschritten – '+gez.length+' Karten automatisch vom Stapel gezogen'):'hat den Zug verstreichen lassen (Stapel leer)';
  p.last=t;G.notice=p.name+' '+t;
  if(G.lastRounds>0){G.lastRounds--;if(G.lastRounds===0){G.over=true;ROOM.status='over';finalScore();sync();return}}
  G.turn=(G.turn+1)%ROOM.players.length;G.frist=Date.now()+limitMs();sync();
}

  const ph=pin?await hashPin(pin,CODE):'';
  ROOM={status:'lobby',edition:EDITION,players:[{name,col:PCOL[0].id,wagons:WAGONS(),hand:{},tickets:[],score:0,pin:ph}]};
  roomRef=db.ref('rooms/'+CODE);
  roomRef.set(ROOM).then(()=>{listen()}).catch(e=>toast('Verbindung fehlgeschlagen: '+e.message));
}
function joinRoom(code,name,pin){
  code=code.toUpperCase().trim();
  const ref=db.ref('rooms/'+code);
  ref.get().then(async snap=>{
    const v=fix(snap.val());
    if(!v){toast('Raum '+code+' nicht gefunden.');return}
    const i=v.players.findIndex(p=>p.name.toLowerCase()===name.toLowerCase());
    const ph=pin?await hashPin(pin,code):'';
    if(i>=0){
      if(v.players[i].pin&&v.players[i].pin!==ph){toast('Falscher PIN für '+v.players[i].name+'.');return}
      CODE=code;SEAT=i;ROOM=v;roomRef=ref;MYPIN=pin;pickShown=false;finalShown=false;
      if(!v.players[i].pin&&ph){v.players[i].pin=ph;ref.update({players:v.players})}
      toast('Willkommen zurück, '+v.players[i].name+'!');listen();return;
    }
    if(v.status!=='lobby'){toast('Das Spiel läuft schon. Zum Wiedereinstieg denselben Namen und PIN eingeben.');return}
    if(v.players.length>=5){toast('Der Raum ist voll (5 Spieler).');return}
    if(!await nameErlaubt(name)){toast('Der Name "'+name+'" ist für dieses Spiel nicht freigegeben.');return}
    CODE=code;SEAT=v.players.length;ROOM=v;roomRef=ref;MYPIN=pin;
    const frei=PCOL.find(c=>!ROOM.players.some(p=>p.col===c.id));ROOM.players.push({name,col:frei.id,wagons:WAGONS(),hand:{},tickets:[],score:0,pin:ph});
    roomRef.set(ROOM).then(()=>listen());
  }).catch(e=>toast('Verbindung fehlgeschlagen: '+e.message));
}
async function adminOk(){
  const s=await db.ref('admin/pin').get().catch(()=>null);

let ADMIN_OK=false;
function ergebnisLoeschen(key,e,then){
  const m=modal('<h2>Eintrag löschen?</h2><p style="font-size:14px;margin-bottom:12px">Das Spiel vom '
    +new Date(e.ts||0).toLocaleDateString('de-DE')+' (Raum '+(e.code||'?')+') wird aus der Rangliste entfernt. '
    +'Die Gesamtwertung der beteiligten Spieler wird entsprechend korrigiert.</p>'
    +'<button class="go" id="ja">Endgültig löschen</button><button class="cancel" id="nein">Abbrechen</button>');
  m.querySelector('#nein').onclick=()=>m.remove();
  m.querySelector('#ja').onclick=()=>{
    m.remove();
    const auf=[db.ref('ergebnisse/'+key).remove()];
    (e.spieler||[]).forEach((n,i)=>{
      const key2=n.toLowerCase().replace(/[.#$\/\[\]]/g,'_');
      auf.push(db.ref('stats/'+key2).transaction(c=>{
        if(!c)return c;
        c.spiele=Math.max(0,(c.spiele||0)-1);
        c.punkte=(c.punkte||0)-((e.punkte&&e.punkte[i])||0);
        if(e.sieger&&e.sieger.toLowerCase()===n.toLowerCase())c.siege=Math.max(0,(c.siege||0)-1);
        return c.spiele?c:null;}));
    });
    Promise.all(auf).then(()=>{toast('Eintrag gelöscht.');then&&then()})
      .catch(err=>toast('Fehlgeschlagen: '+err.message));
  };
}
function arrOf(v){return Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[])}
function zeigeRangliste(){
  Promise.all([db.ref('stats').get(),db.ref('ergebnisse').get()]).then(([s1,s2])=>{
    const stats=Object.values(s1.val()||{}), ergObj=s2.val()||{}, erg=Object.values(ergObj);
    // Firebase kann Arrays als Objekte zurueckgeben – vorab normalisieren,
    // damit ein einzelner alter Datensatz nicht die ganze Rangliste blockiert.
    erg.forEach(e=>{e.spieler=arrOf(e.spieler).filter(x=>x!=null);e.punkte=arrOf(e.punkte)});
    if(!stats.length&&!erg.length){toast('Noch keine beendeten Spiele in der Wertung.');return}
    const namen=[...new Set([].concat(...erg.map(e=>e.spieler||[])))].sort();
    const edOpts=Object.values(EDITIONEN).map(e=>({id:(e.meta.statId||e.meta.name),name:e.meta.name}));
    const edName=id=>{const t=edOpts.find(o=>o.id===id);return t?t.name:(id||'Langenberg')};
    const selCss='padding:7px;border-radius:8px;border:1.5px solid var(--frame);background:#fff;font-size:13px;max-width:44vw';
    const m=modal('<h2>🏆 Ranglisten</h2>'
      +'<div class="row" style="gap:6px;justify-content:center;margin:0 0 8px;flex-wrap:wrap">'
      +'<select id="fEd" style="'+selCss+'"><option value="">Alle Editionen</option>'+edOpts.map(o=>'<option value="'+o.id+'">'+o.name+'</option>').join('')+'</select>'
      +'<select id="fSp" style="'+selCss+'"><option value="">Alle Spieler</option>'+namen.map(n=>'<option>'+n+'</option>').join('')+'</select>'
      +'<select id="fZt" style="'+selCss+'"><option value="0">Gesamter Zeitraum</option><option value="30">Letzte 30 Tage</option><option value="90">Letzte 3 Monate</option><option value="365">Letzte 12 Monate</option></select></div>'
      +'<div class="tabs"><button id="rb1" class="on">Gesamt</button><button id="rb2">Duelle</button><button id="rb3">Spiele</button></div><div id="rbox"></div><button class="go" id="cl">Schließen</button>');
    const box=m.querySelector('#rbox'),b1=m.querySelector('#rb1'),b2=m.querySelector('#rb2'),b3=m.querySelector('#rb3');
    const fEd=m.querySelector('#fEd'),fSp=m.querySelector('#fSp'),fZt=m.querySelector('#fZt');
    const filterAktiv=()=>!!(fEd.value||fSp.value||+fZt.value);
    function passt(e){
      if(e.custom||e.test)return false;
      if(fEd.value&&(e.edition||'Zug um Zug Langenberg')!==fEd.value)return false;
      if(fSp.value&&!(e.spieler||[]).some(n=>n.toLowerCase()===fSp.value.toLowerCase()))return false;
      if(+fZt.value&&(e.ts||0)<Date.now()-(+fZt.value)*86400000)return false;
      return true}
    const zeile=(i,n,rechts)=>'<div class="score-row"><span><b>'+i+'.</b> '+n+'</span><span style="font-size:13px">'+rechts+'</span></div>';
    function gesamt(){
      let a,quelle;
      if(!filterAktiv()){a=[...stats];quelle='Über alle beendeten Spiele'}
      else{const tab={};erg.filter(passt).forEach(e=>{(e.spieler||[]).forEach((n,i)=>{
          const k=n.toLowerCase();tab[k]=tab[k]||{name:n,siege:0,spiele:0,punkte:0};
          tab[k].spiele++;tab[k].punkte+=(e.punkte&&e.punkte[i])||0;
          if(e.sieger&&e.sieger.toLowerCase()===k)tab[k].siege++})});
        a=Object.values(tab);quelle='Gefiltert: '+erg.filter(passt).length+' Spiel(e)'}
      if(!a.length){box.innerHTML='<p style="text-align:center;color:#8a7d63;padding:14px 0">Keine Spiele im gewählten Filter.</p>';return}
      a.sort((x,y)=>(y.siege-x.siege)||(y.punkte-x.punkte));
      box.innerHTML='<div style="font-size:13px;color:#8a7d63;margin-bottom:8px">'+quelle+'</div>'
        +a.map((p,i)=>zeile(i+1,p.name,p.siege+' Siege · '+p.spiele+' Spiele · \u00f8 '+(p.spiele?Math.round(p.punkte/p.spiele):0)+' Pkt.')).join('');
    }
    const gewaehlt=new Set();
    function direkt(){
      let hh='<div style="font-size:13px;color:#8a7d63;margin-bottom:6px">Spieler antippen – gewertet werden Spiele in genau dieser Besetzung'+(filterAktiv()?' (Filter aktiv)':'')+'.</div><div class="row" style="justify-content:flex-start;margin:0 0 10px">';
      namen.forEach(n=>{hh+='<button class="opt vs'+(gewaehlt.has(n)?' sel':'')+'" data-n="'+n+'" style="width:auto;padding:7px 11px;margin:0">'+n+'</button>'});
      hh+='</div><div id="vsErg"></div>';
      box.innerHTML=hh;
      box.querySelectorAll('.vs').forEach(b=>b.onclick=()=>{
        const n=b.dataset.n;gewaehlt.has(n)?gewaehlt.delete(n):gewaehlt.add(n);direkt()});
      const ziel=box.querySelector('#vsErg');
      if(gewaehlt.size<2){ziel.innerHTML='<p style="text-align:center;color:#8a7d63;font-size:14px;padding:12px 0">Mindestens zwei Spieler wählen.</p>';return}
      const key=[...gewaehlt].map(x=>x.toLowerCase()).sort().join('|');
      const treffer=erg.filter(passt).filter(e=>(e.spieler||[]).map(x=>x.toLowerCase()).sort().join('|')===key);
      if(!treffer.length){ziel.innerHTML='<p style="text-align:center;color:#8a7d63;font-size:14px;padding:12px 0">Keine Spiele in dieser Besetzung.</p>';return}
      const tab={};[...gewaehlt].forEach(n=>tab[n]={n,siege:0,pkt:0,spiele:0});
      treffer.forEach(e=>{(e.spieler||[]).forEach((n,i)=>{const k=Object.keys(tab).find(x=>x.toLowerCase()===n.toLowerCase());
        if(!k)return;tab[k].spiele++;tab[k].pkt+=(e.punkte&&e.punkte[i])||0;
        if(e.sieger&&e.sieger.toLowerCase()===n.toLowerCase())tab[k].siege++})});
      const a=Object.values(tab).sort((x,y)=>(y.siege-x.siege)||(y.pkt-x.pkt));
      ziel.innerHTML='<div style="font-size:13px;color:#8a7d63;margin:6px 0">'+treffer.length+' gemeinsame(s) Spiel(e)</div>'
        +a.map((p,i)=>zeile(i+1,p.n,p.siege+' Siege · \u00f8 '+(p.spiele?Math.round(p.pkt/p.spiele):0)+' Pkt.')).join('');
    }
    function spieleListe(){
      const a=Object.keys(ergObj).filter(k=>passt(ergObj[k])).sort((x,y)=>(ergObj[y].ts||0)-(ergObj[x].ts||0));
      if(!a.length){box.innerHTML='<p style="text-align:center;color:#8a7d63;padding:14px 0">Keine Spiele im gewählten Filter.</p>';return}
      box.innerHTML=(ADMIN_OK?'':'<button class="cancel" id="admUn" style="margin:0 0 10px;font-size:13px">🔓 Als Admin anmelden (zum Löschen)</button>')
        +a.map(k=>{try{const e=ergObj[k];
          const dt=new Date(e.ts||0).toLocaleDateString('de-DE');
          const uhr=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
          const tag=t=>new Date(t).toLocaleDateString('de-DE',{day:'numeric',month:'numeric'});
          const m2=e.dauerMin||0;
          const dauer=!m2?'':(m2>=1440?Math.floor(m2/1440)+' T '+Math.floor(m2%1440/60)+' h'
            :(m2>=60?Math.floor(m2/60)+' h '+(m2%60)+' min':m2+' min'));
          let zeit;
          if(e.start){const en=e.ende||e.ts,mehrtags=tag(e.start)!==tag(en);
            zeit=(mehrtags?tag(e.start)+' ':'')+uhr(e.start)+'–'+(mehrtags?tag(en)+' ':'')+uhr(en)+' Uhr'+(dauer?' · '+dauer:'')}
          else zeit=uhr(e.ts)+' Uhr';
          const rang=(e.spieler||[]).map((n,i)=>({n,p:(e.punkte&&e.punkte[i])||0})).sort((x,y)=>y.p-x.p);
          const rd=(e.spieler&&e.spieler.length)?Math.ceil((e.zuege||0)/e.spieler.length):0;
          return '<div style="display:flex;gap:6px;margin-bottom:8px"><div class="opt" style="flex:1;margin:0;cursor:default">'
            +'<b>'+edName(e.edition)+' · '+dt+'</b>'
            +'<div style="font-size:13px;margin:4px 0">'+rang.map((r,i)=>(i?' – ':'')+r.n+' <b>'+r.p+'</b>').join('')+'</div>'
            +'<div style="font-size:12px;color:#8a7d63">'+zeit+' · '+rd+' Runden · Raum '+(e.code||'?')+'</div></div>'
            +(ADMIN_OK?'<button class="edel" data-k="'+k+'" style="width:46px;border-radius:9px;border:1.5px solid #b3372c;background:#fff;color:#b3372c;font-size:17px">🗑</button>':'')
            +'</div>'}catch(err){return '<div class="opt" style="margin:0 0 8px;color:#b3372c;font-size:13px">Datensatz '+k+' konnte nicht angezeigt werden.</div>'}}).join('');
      const au=box.querySelector('#admUn');
      if(au)au.onclick=async()=>{if(await adminOk()){ADMIN_OK=true;spieleListe()}};
      box.querySelectorAll('.edel').forEach(b=>b.onclick=()=>ergebnisLoeschen(b.dataset.k,ergObj[b.dataset.k],()=>{
        delete ergObj[b.dataset.k];spieleListe()}));
    }
    let akt=gesamt;
    const setTab=(btn,fn)=>{[b1,b2,b3].forEach(b=>b.classList.remove('on'));btn.classList.add('on');akt=fn;fn()};
    b1.onclick=()=>setTab(b1,gesamt);b2.onclick=()=>setTab(b2,direkt);b3.onclick=()=>setTab(b3,spieleListe);
    [fEd,fSp,fZt].forEach(s=>s.onchange=()=>akt());
    m.querySelector('#cl').onclick=()=>m.remove();
    gesamt();
  }).catch(e=>toast('Rangliste nicht ladbar: '+e.message));
}

        if(!Array.isArray(e.punkte))e.punkte=e.punkte?Object.values(e.punkte):[]});
      const keys=Object.keys(ergObj).sort((x,y)=>(ergObj[y].ts||0)-(ergObj[x].ts||0));
      if(!keys.length){box.innerHTML='<p style="text-align:center;color:#8a7d63;padding:14px 0">Noch keine beendeten Spiele.</p>';return}
      const edName=id=>{const t=Object.values(EDITIONEN).find(e=>(e.meta.statId||e.meta.name)===id);return t?t.meta.name:(id||'Langenberg')};
      box.innerHTML='<button class="cancel" id="expCsv" style="margin:0 0 10px;font-size:13px">⬇ Alle als CSV exportieren</button>'
        +keys.map(k=>{const e=ergObj[k];
          const d=new Date(e.ts||0);const dat=d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
          const flags=(e.test?' · Test':'')+(e.custom?' · Eigene Regeln':'');
          const det=(e.spieler||[]).map((n,i)=>'<div class="score-row"><span>'+(n===e.sieger?'🏆 ':'')+n+'</span><span>'+((e.punkte&&e.punkte[i])||0)+'</span></div>').join('')
            +'<div style="font-size:12px;color:#8a7d63;margin-top:4px">Raum '+(e.code||'?')+' · '+(e.zuege||0)+' Züge</div>';
          return '<div style="display:flex;gap:6px;margin-bottom:8px;align-items:stretch">'
            +'<div class="opt bx" data-k="'+k+'" style="flex:1;margin:0"><b>'+dat+'</b> · '+edName(e.edition)+flags
            +'<div style="font-size:12px;color:#8a7d63;margin-top:3px">🏆 '+(e.sieger||'?')+' · '+((e.spieler||[]).join(', ')||'—')+'</div>'
            +'<div class="bdet" style="display:none;margin-top:6px">'+det+'</div></div>'
            +'<button class="bdel" data-k="'+k+'" style="width:46px;border-radius:9px;border:1.5px solid #b3372c;background:#fff;color:#b3372c;font-size:17px">🗑</button></div>'}).join('');
      box.querySelectorAll('.bx').forEach(el=>el.onclick=()=>{const d=el.querySelector('.bdet');d.style.display=d.style.display==='none'?'':'none'});
      box.querySelectorAll('.bdel').forEach(b=>b.onclick=ev=>{ev.stopPropagation();
        ergebnisLoeschen(b.dataset.k,ergObj[b.dataset.k],()=>{delete ergObj[b.dataset.k];beendet()})});
      box.querySelector('#expCsv').onclick=()=>{
        const rows=[['Datum','Edition','Raum','Züge','Sieger','Spieler','Punkte','Testmodus','Eigene Regeln']];
        keys.forEach(k=>{const e=ergObj[k];
          rows.push([new Date(e.ts||0).toLocaleString('de-DE'),edName(e.edition),e.code||'',e.zuege||0,e.sieger||'',
            (e.spieler||[]).join(' / '),(e.punkte||[]).join(' / '),e.test?'ja':'',e.custom?'ja':''])});
        const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
        const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
        a.download='zug-um-zug-spiele.csv';a.click()};
    }
    const alle=[b1,b2,b3,b4];
    b3.onclick=()=>{alle.forEach(b=>b.classList.remove('on'));b3.classList.add('on');reset()};
    b1.onclick=()=>{alle.forEach(b=>b.classList.remove('on'));b1.classList.add('on');spiele()};
    b2.onclick=()=>{alle.forEach(b=>b.classList.remove('on'));b2.classList.add('on');namen()};
    b4.onclick=()=>{alle.forEach(b=>b.classList.remove('on'));b4.classList.add('on');beendet()};
    spiele();
    m.querySelector('#cl').onclick=()=>m.remove();
  }).catch(e=>toast('Verbindung fehlgeschlagen: '+e.message));
}

function wechsleRaum(code,name,pin){
  try{if(roomRef)roomRef.off()}catch(e){}
  if(window._strafT){clearTimeout(window._strafT);window._strafT=null}
  document.querySelectorAll('.modal').forEach(x=>x.remove());
  joinRoom(code,name,pin);
}
function spieleWechsler(){
  const myName=(ROOM&&ROOM.players&&ROOM.players[SEAT])?ROOM.players[SEAT].name:'';
  if(!myName){toast('Kein Spielername bekannt.');return}
  db.ref('rooms').get().then(snap=>{
    const all=snap.val()||{},treffer=[];
    for(const code in all){if(code===CODE)continue;const v=fix(all[code]);
      if(!v||!v.players)continue;
      const i=v.players.findIndex(p=>p.name&&p.name.toLowerCase()===myName.toLowerCase());
      if(i<0||v.status==='over')continue;
      const ed=(v.edition&&EDITIONEN[v.edition]&&(EDITIONEN[v.edition].meta.kurz||EDITIONEN[v.edition].meta.name))||'Langenberg';
      const pl=v.players.map(p=>p.name).join(', ');
      const runde=(v.game&&v.players.length)?Math.floor((v.game.zuege||0)/v.players.length)+1:0;
      const dran=!!(v.game&&v.game.turn===i&&v.status==='playing');
      let st=v.status==='lobby'?'Warteraum':(dran?'DU BIST DRAN':'läuft');
      if(v.status==='playing'&&(v.limitMin||v.limitH)&&v.game&&v.game.frist){const ms=v.game.frist-Date.now();
        st+=ms<=0?' · Zeit abgelaufen':' · noch '+(ms>=3600000?Math.floor(ms/3600000)+' Std.':Math.max(1,Math.floor(ms/60000))+' Min.')}
      treffer.push({code,ed,pl,runde,st,dran});
    }
    if(!treffer.length){toast('Keine weiteren laufenden Spiele für "'+myName+'" gefunden.');return}
    treffer.sort((a,b)=>(b.dran?1:0)-(a.dran?1:0));
    let html='<h2>Andere laufende Spiele</h2>';
    treffer.forEach(x=>{html+='<div class="opt" style="margin-bottom:9px;cursor:default">'
      +'<b>'+x.ed+'</b>'+(x.runde?' · Runde '+x.runde:'')+' · <b style="letter-spacing:.2em">'+x.code+'</b>'
      +' · <span style="color:'+(x.dran?'#b3372c':'#8a7d63')+';font-weight:'+(x.dran?'700':'400')+'">'+x.st+'</span>'
      +'<div style="font-size:12px;color:#8a7d63;margin:3px 0 6px">'+x.pl+'</div>'
      +'<div style="display:flex;gap:6px"><button class="go swGo" data-c="'+x.code+'" style="flex:1;margin:0;padding:8px">In diesen Raum wechseln</button>'
      +'<button class="cancel swTab" data-c="'+x.code+'" title="In neuem Tab öffnen" style="width:auto;margin:0;padding:8px 14px">↗</button></div></div>'});
    html+='<div style="display:flex;gap:8px;align-items:center;margin-top:4px"><span style="font-size:13px;color:#8a7d63">PIN:</span><input type="password" id="swPin" value="'+(MYPIN||'').replace(/"/g,'')+'" style="flex:1"></div>'
      +'<button class="cancel" id="swZu">Schließen</button>';
    const m=modal(html);
    const pin=()=>m.querySelector('#swPin').value.trim();
    m.querySelectorAll('.swGo').forEach(b=>b.onclick=()=>{const c=b.dataset.c,p=pin();m.remove();wechsleRaum(c,myName,p)});
    m.querySelectorAll('.swTab').forEach(b=>b.onclick=()=>{
      try{sessionStorage.setItem('autojoin',JSON.stringify({code:b.dataset.c,name:myName,pin:pin()}))}catch(e){}
      window.open(location.href.split('#')[0],'_blank');
      setTimeout(()=>{try{sessionStorage.removeItem('autojoin')}catch(e){}},2000)});
    m.querySelector('#swZu').onclick=()=>m.remove();
  }).catch(e=>toast('Verbindung fehlgeschlagen: '+e.message));
}
function meineSpiele(name){
  db.ref('rooms').get().then(snap=>{
    const all=snap.val()||{},treffer=[];
    for(const code in all){const v=fix(all[code]);
      if(!v||!v.players)continue;
      const i=v.players.findIndex(p=>p.name&&p.name.toLowerCase()===name.toLowerCase());
      if(i<0)continue;
      if(v.status==='over')continue;   // beendete Partien ausblenden
      let st=v.status==='lobby'?'Warteraum':(v.game&&v.game.turn===i?'DU BIST DRAN':'läuft');
      if(v.status==='playing'&&(v.limitMin||v.limitH)&&v.game&&v.game.frist){const ms=v.game.frist-Date.now();
        st+=ms<=0?' · Zeit abgelaufen':' · noch '+(ms>=3600000?Math.floor(ms/3600000)+' Std.':Math.max(1,Math.floor(ms/60000))+' Min.')}
      const ed=(v.edition&&EDITIONEN[v.edition]&&(EDITIONEN[v.edition].meta.name||v.edition))||'Langenberg';
      const runde=(v.game&&v.players.length)?Math.floor((v.game.zuege||0)/v.players.length)+1:0;
      treffer.push({code,st,pl:v.players.map(p=>p.name).join(', '),ed,runde,dran:st==='DU BIST DRAN'});
    }
    if(!treffer.length){toast('Keine laufenden Spiele für "'+name+'" gefunden.');return}
    treffer.sort((a,b)=>(b.dran?1:0)-(a.dran?1:0));
    let html='<h2>Deine laufenden Spiele</h2>';
    treffer.forEach(x=>{html+='<div style="display:flex;gap:6px;margin-bottom:8px">'
      +'<button class="opt" data-c="'+x.code+'" style="flex:1;margin:0"><b>'+x.ed+'</b>'+(x.runde?' · Runde '+x.runde:'')+' · <b style="letter-spacing:.2em">'+x.code+'</b> · <span style="color:'+(x.dran?'#b3372c':'#8a7d63')+';font-weight:'+(x.dran?'700':'400')+'">'+x.st+'</span><div style="font-size:12px;color:#8a7d63;margin-top:3px">'+x.pl+'</div></button>'
      +'<button class="del" data-d="'+x.code+'" style="width:46px;border-radius:9px;border:1.5px solid #b3372c;background:#fff;color:#b3372c;font-size:17px">🗑</button></div>'});
    html+='<button class="cancel" id="zu">Abbrechen</button>';
    const m=modal(html);
    m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{m.remove();
      document.querySelectorAll('.modal').forEach(x=>x.remove());joinRoom(b.dataset.c,name,MYPIN)});
    m.querySelectorAll('.del').forEach(b=>b.onclick=()=>raumLoeschen(b.dataset.d,()=>{m.remove();meineSpiele(name)}));
    m.querySelector('#zu').onclick=()=>m.remove();
  }).catch(e=>toast('Verbindung fehlgeschlagen: '+e.message));
}

// ---------- UI-Helfer ----------
function modal(html,keep){const d=document.createElement('div');d.className='modal';d.innerHTML='<div class="box">'+html+'</div>';
  document.getElementById('modals').appendChild(d);
  try{
    const imSpiel=!document.getElementById('bottom').classList.contains('hidden');
    if(imSpiel&&html.indexOf('id="swPin"')<0){
      const b=document.createElement('button');b.className='cancel';
      b.style.cssText='margin-top:6px;font-size:13px;opacity:.85';
      b.textContent='🔀 Meine laufenden Spiele';
      b.onclick=()=>spieleWechsler();
      d.querySelector('.box').appendChild(b);
    }
  }catch(e){}
  return d}
function toast(msg){if(!msg)return;const t=document.createElement('div');t.className='toastMsg';
  const off=60+document.querySelectorAll('.toastMsg').length*46;
  t.style.cssText='position:fixed;top:'+off+'px;left:50%;transform:translateX(-50%);background:#2b2419ee;color:#f0e6d2;padding:10px 18px;border-radius:999px;z-index:99;font-size:14px;max-width:88vw;text-align:center';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}

// Zoom & Pan
let scale=1,tx=0,ty=0;
function apply(){world.setAttribute('transform','translate('+tx+' '+ty+') scale('+scale+')')}
document.getElementById('zin').onclick=()=>{scale=Math.min(4,scale*1.35);apply()};
document.getElementById('zout').onclick=()=>{scale=Math.max(.6,scale/1.35);apply()};
const stage=document.getElementById('stage');let ptrs=new Map(),lastD=0;
stage.addEventListener('pointerdown',e=>ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}));
stage.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;
  if(ptrs.size===1){const p=ptrs.get(e.pointerId),r=stage.getBoundingClientRect(),f=1/Math.min(r.width/1000,r.height/BH);
    tx+=(e.clientX-p.x)*f;ty+=(e.clientY-p.y)*f;apply();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY})}
  else if(ptrs.size===2){ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const[p1,p2]=[...ptrs.values()],d2=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    if(lastD)scale=Math.min(4,Math.max(.6,scale*d2/lastD)),apply();lastD=d2}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>stage.addEventListener(ev,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)lastD=0}));
stage.addEventListener('wheel',e=>{e.preventDefault();scale=Math.min(4,Math.max(.6,scale*(e.deltaY<0?1.1:.9)));apply()},{passive:false});

// ---------- Startbildschirm ----------
(function landing(){
  try{const aj=sessionStorage.getItem('autojoin');if(aj){sessionStorage.removeItem('autojoin');const o=JSON.parse(aj);if(o&&o.code){joinRoom(o.code,o.name||'',o.pin||'');return}}}catch(e){}
  const m=modal('<h2 class="serif" style="text-align:center;letter-spacacing:.08em;letter-spacing:.08em">ZUG UM ZUG</h2>'+
    '<p style="text-align:center;font-size:13px;color:#8a7d63;margin:6px 0 16px">Online spielen · 2–5 Spieler · Version 6.3</p>'+
    '<input type="text" id="pname" placeholder="Dein Name" maxlength="14" style="margin-bottom:8px">'+
    '<input type="password" id="ppin" placeholder="Dein PIN (mind. 4 Zeichen)" maxlength="12" style="margin-bottom:10px">'+
    (Object.keys(EDITIONEN).length>1?'<div style="font-size:13px;color:#8a7d63;margin-bottom:5px">Edition für ein neues Spiel:</div><div class="row" id="edRow" style="justify-content:center;margin:0 0 10px">'
      +Object.keys(EDITIONEN).map(k=>'<button class="opt'+(k===EDITION?' sel':'')+'" data-e="'+k+'" style="width:auto;padding:8px 14px;margin:0">'+(EDITIONEN[k].meta.name||k)+'</button>').join('')+'</div>':'')+
    '<button class="go" id="mkRoom">Neuen Raum erstellen</button>'+
    '<div style="display:flex;gap:8px;margin-top:14px"><input type="text" id="jcode" placeholder="Raum-Code" maxlength="5" style="text-transform:uppercase;letter-spacing:.2em;flex:1"><button class="go" id="jGo" style="width:auto;margin-top:0;padding:0 18px">Beitreten</button></div>'+
    '<button class="cancel" id="myG">↩︎ Meine laufenden Spiele</button>'+
    '<button class="cancel" id="rgG">🏆 Ranglisten</button>'+
    '<button class="cancel" id="admG" style="font-size:13px;color:#8a7d63">⚙ Admin</button>'+
    '<p style="font-size:12px;color:#8a7d63;margin-top:10px;text-align:center">Zum Wiedereinstieg denselben Namen wie zuvor eingeben.</p>',true);
  const nameOk=()=>{const n=m.querySelector('#pname').value.trim();
    if(!n){toast('Bitte zuerst deinen Namen eingeben.');return null}
    if(m.querySelector('#ppin').value.trim().length<4){toast('Bitte einen PIN mit mindestens 4 Zeichen wählen.');return null}
    return n};
  const pinVal=()=>m.querySelector('#ppin').value.trim();
  m.querySelectorAll('#edRow .opt').forEach(b=>b.onclick=()=>{
    setEdition(b.dataset.e);
    m.querySelectorAll('#edRow .opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
  m.querySelector('#rgG').onclick=()=>zeigeRangliste();
  m.querySelector('#admG').onclick=()=>adminLogin();
  m.querySelector('#myG2')&&0;
  m.querySelector('#mkRoom').onclick=()=>{const n=nameOk();if(!n)return;const p=pinVal();m.remove();createRoom(n,p)};
  m.querySelector('#myG').onclick=()=>{const n=nameOk();if(!n)return;MYPIN=pinVal();meineSpiele(n)};
  m.querySelector('#jGo').onclick=()=>{const n=nameOk();if(!n)return;const c=m.querySelector('#jcode').value;
    if(c.trim().length!==5){toast('Der Raum-Code hat 5 Buchstaben.');return}const p=pinVal();m.remove();joinRoom(c,n,p)};
})();
