<style>
:root{--tkbild:url('auftrag.jpg');--frame:#5a4632;--board:#dde8c0;--board2:#eef2d8;--brass:#b08d3e;--card:#faf7ee;--ink:#2b2419}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,sans-serif;background:var(--frame);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
h1,h2,.serif{font-family:Georgia,serif;font-weight:normal}
#top{display:flex;align-items:center;gap:8px;padding:5px 8px;color:#f0e6d2;font-size:14px}
#chips{display:flex;gap:5px;overflow-x:auto;flex:1}
.pchip{display:flex;align-items:stretch;border-radius:6px;overflow:hidden;border:2px solid #00000055;background:#e8e0cc;flex-shrink:0;box-shadow:0 1px 3px #0004}
.pchip.aktiv{border-color:#ffd970;box-shadow:0 0 0 2px #ffd97088}
.pchip .ini{display:flex;align-items:center;padding:0 6px;font-weight:800;font-size:13px;color:#fff}
.pchip .sc{display:flex;align-items:center;padding:0 7px;font-size:19px;font-weight:800;color:#fff;font-family:Georgia,serif}
.pchip .wg{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 5px;background:#2b2419;color:#f0e6d2;font-size:12px;font-weight:700;line-height:1}
.pchip .wg small{font-size:8px;opacity:.8}
.pchip .wg2{display:flex;align-items:center;gap:2px;padding:0 5px;background:#3d3225;color:#f0e6d2;font-size:11px;font-weight:700}
.pchip .wg2 small{font-size:9px;opacity:.85;margin-right:3px}
.pchip .wg2 b{font-weight:700}
#top .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
#top b{font-size:21px;font-weight:800;letter-spacing:.01em}
#top .stat{background:rgba(255,255,255,.12);padding:3px 9px;border-radius:999px}
#roomtag{margin-left:auto;opacity:.9;letter-spacing:.1em}
#stage{flex:1;position:relative;background:radial-gradient(ellipse at 50% 40%,var(--board2),var(--board) 70%);touch-action:none;overflow:hidden;border-top:3px solid var(--brass);border-bottom:3px solid var(--brass)}
svg{position:absolute;inset:0;width:100%;height:100%}
.seg{fill:#fff;fill-opacity:0;stroke:none;pointer-events:all;cursor:pointer}
.wagon{pointer-events:none;filter:url(#w3d)}
.glowdot{pointer-events:none}
.nodeC{fill:#cfc8ba;stroke:#5a4632;stroke-width:2}
.nodeL{font-size:11.5px;font-weight:600;fill:#2b2419;paint-order:stroke;stroke:#f2f0e4;stroke-width:3px;pointer-events:none}
.rand .nodeL{font-family:Georgia,serif;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.wm{font-family:Georgia,serif;fill:#c9a35e;opacity:.3;letter-spacing:.35em;pointer-events:none}
#zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:38px;height:38px;border-radius:8px;border:1px solid var(--frame);background:var(--card);font-size:20px}
.rulesChip{width:30px;height:30px;border-radius:9px;border:1px solid var(--frame);background:var(--card);font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;align-self:center;line-height:1}
#gelDock{position:absolute;left:10px;top:104px;display:none;flex-direction:column;gap:6px;z-index:5}
#gelDock.an{display:flex}
#gelDock .pcard{width:58px;height:38px}
#gelDock .pcard{box-shadow:0 1px 4px #0006}
#bottom{background:var(--card);border-top:3px solid var(--brass);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#open{position:absolute;right:4px;top:4px;bottom:4px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:3px;z-index:6;pointer-events:none}
#open>*{pointer-events:all}
#open .pcard{width:min(17vw,74px);height:calc(min(17vw,74px)*0.652)}
#deckWrap{position:relative;margin-top:6px}
#deckWrap .cnt{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:#2b2419dd;color:#f0e6d2;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;white-space:nowrap}
#ablage{margin-top:4px;text-align:center;font-size:10px;color:#2b2419;background:#faf7eee6;border:1px solid #b08d3e;border-radius:6px;padding:3px 7px;line-height:1.2}
.pcard{width:74px;height:48px;border-radius:5px;border:1px solid #00000025;background-image:url('kartensatz.jpg');background-size:500% 200%;background-repeat:no-repeat;flex-shrink:0;position:relative;cursor:pointer;box-shadow:0 1px 3px #0003}
.pc-lok{background-position:0% 0%}.pc-rot{background-position:25% 0%}.pc-gruen{background-position:50% 0%}.pc-gelb{background-position:75% 0%}.pc-orange{background-position:100% 0%}
.pc-schwarz{background-position:0% 100%}.pc-weiss{background-position:25% 100%}.pc-pink{background-position:50% 100%}.pc-blau{background-position:75% 100%}.pc-rueck{background-position:100% 100%}
.pcard.wrc{background-image:none;background-size:cover;background-position:center;background-color:#f6f1e6}
#open .pcard.wrc{height:auto!important;aspect-ratio:640/392}
#gelDock .pcard.wrdeck{width:64px;height:auto;aspect-ratio:640/392;cursor:pointer}
#open .pcard.wrc.wrdeck{opacity:.97}
.pc-faehre{background-image:none;background:linear-gradient(160deg,#e6eff5,#7f9db3);display:flex;align-items:center;justify-content:center;border:1px solid #4c6b85}
.pc-faehre .fkl{font-size:11px;font-weight:800;color:#123a5a;letter-spacing:.05em}
.expzug{background-image:none;background:linear-gradient(160deg,#ffffff,#cdd6de);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid #6a7683}
.fkWrap{position:relative;margin-top:6px}
.pc-faehre.fkbild{background-size:cover;background-position:center 12%;background-repeat:no-repeat}
#gelDock .pcard.quer{width:78px;height:49px;position:relative;overflow:hidden;background-color:#f6f1e6}
#gelDock .pcard.quer .drehbild{position:absolute;left:50%;top:50%;width:47px;height:76px;transform:translate(-50%,-50%) rotate(-90deg);background-size:contain;background-position:center;background-repeat:no-repeat}
.pcard.sm{width:60px;height:39px}
.pcard.hoch{width:52px;height:79px;background-image:none;overflow:hidden}
.pcard.hoch i{position:absolute;left:50%;top:50%;width:79px;height:52px;display:block;
  transform:translate(-50%,-50%) rotate(90deg);background-image:url('kartensatz.jpg');background-size:500% 200%;background-repeat:no-repeat}
.pcard .n{position:absolute;bottom:1px;right:3px;font-size:12px;font-weight:700;color:#fff;background:#000000aa;border-radius:8px;padding:0 5px}
.gelWrap{position:relative}
.gelWrap .cnt{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:#2b2419dd;color:#f0e6d2;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;white-space:nowrap}
.gcard{background-size:cover;background-position:center;background-repeat:no-repeat;border:1px solid #6b5a3e}
.gsep{width:34px;height:2px;background:#00000030;border-radius:2px;margin:2px 0}
#handbox{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
#hand{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;flex:1;min-height:82px;align-items:flex-start}
#actions{display:flex;gap:8px}
#actions button{flex:1;padding:11px 6px;border-radius:9px;border:1.5px solid var(--frame);background:#fff;font-size:14px;font-weight:600}
#actions button:disabled{opacity:.4}
#waitbar{font-size:13px;color:#8a7d63;text-align:center;padding:5px 0 3px}
#waitbar .dranTxt{font-size:19px;font-weight:800;letter-spacing:.02em}
#waitbar .zeitTxt{font-size:12px;color:#8a7d63}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:var(--card);border-radius:14px;border:3px solid var(--brass);padding:18px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto}
.box h2{font-size:20px;margin-bottom:12px}
.box .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.box button.opt{display:block;width:100%;text-align:left;padding:12px;border-radius:9px;border:1.5px solid var(--frame);background:#fff;font-size:14px;margin-bottom:8px}
.box button.opt.sel{background:#efe8d4;border-width:2.5px}
.box .go{width:100%;padding:13px;border-radius:9px;border:0;background:var(--frame);color:#f0e6d2;font-size:16px;font-weight:600;margin-top:6px}
.box .go:disabled{opacity:.4}
.box .cancel{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--frame);background:#fff;font-size:14px;margin-top:8px}
.ticket{border:1.5px solid var(--frame);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.ticket.sel{background:#efe8d4;border-width:2.5px}
.ticket .pts{font-family:Georgia,serif;font-size:19px}
.ticket.done{border-color:#3e7d32;background:#eef5ea}
.tcard.lang{outline:3px solid #1d4ed8;outline-offset:-3px}
.tcard{position:relative;width:100%;aspect-ratio:var(--tkratio,991/621);background:#e9dfc4 var(--tkbild);background-size:100% 100%;border-radius:10px;border:3px solid #00000025;margin-bottom:8px;cursor:pointer;overflow:hidden}
.tcard.sel{border-color:#111;box-shadow:0 0 0 3px #111}
.tcard.done{border-color:#3e7d32;box-shadow:0 0 0 3px #3e7d32}
.tcard svg{position:absolute;inset:0;width:100%;height:100%}
.tcheck{position:absolute;top:6px;right:8px;background:#3e7d32;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px;border-radius:8px;border:1.5px solid #5a4632;background:#fff;font-size:14px;font-weight:600}
.tabs button.on{background:#5a4632;color:#f0e6d2}
.sdrow{margin:7px 0}
.sdname{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:2px}
.sdtrack{background:#e7dcc3;border:1.5px solid #5a463255;border-radius:999px;height:20px;overflow:hidden}
.sdfill{height:100%;border-radius:999px;transition:width .9s cubic-bezier(.25,.7,.3,1);min-width:0}
.sdrev{background:#fffdf6;border:1.5px solid #5a463233;border-radius:10px;padding:10px;margin:10px 0;min-height:56px;font-size:14px}
.sdpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fly{position:fixed;z-index:80;transition:transform .45s cubic-bezier(.2,.75,.3,1),opacity .45s;pointer-events:none;margin:0}
#chat{width:min(46vw,240px);flex-shrink:0;background:#faf7ee;border:2px solid #b08d3e;border-radius:10px;font-size:12px;overflow:hidden;align-self:stretch}
#chat h4{background:#5a4632;color:#f0e6d2;padding:5px 8px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;cursor:pointer}
#chatBody{height:110px;display:flex;flex-direction:column;padding:0} #chatMsgs{flex:1;overflow-y:auto;padding:5px 7px} #chatActs{border-top:1px solid #d8c9a8;background:#f5efdf;padding:3px 7px;max-height:62px;overflow-y:auto;flex-shrink:0}
#chatBody .last{color:#6b5322;padding:2px 0;line-height:1.35}
#chatBody .msg{padding:2px 0;line-height:1.35}
#chatBody .msg b{color:#2b2419}
#chatBody hr{border:0;border-top:1px solid #b08d3e55;margin:5px 0}
#chatIn{display:flex;gap:4px;padding:0 6px 6px}
#chatIn input{flex:1;padding:6px;border-radius:6px;border:1px solid #5a4632;font-size:13px;width:auto}
#chatIn button{padding:6px 9px;border-radius:6px;border:0;background:#5a4632;color:#f0e6d2;font-size:13px}
#chat.zu #chatBody,#chat.zu #chatIn{display:none}

/* ---- Querformat auf dem Handy: unteren Bereich flach halten ---- */
@media (orientation:portrait){
  /* Hochkant: 3 Spalten x 3 Reihen (9 Karten) sichtbar, weitere Karten per Scrollen (Weltreise hat bis zu 25 Kartenarten) */
  #hand{display:grid;grid-template-columns:repeat(3,max-content);gap:5px;justify-content:start;align-content:start;overflow-x:hidden;overflow-y:auto;max-height:247px;min-height:0;flex:0 0 auto}
}
@media (orientation:landscape) and (max-height:560px){
  body{display:grid;grid-template-columns:minmax(0,1fr) 262px;grid-template-rows:auto minmax(0,1fr)}
  #top{grid-column:1/3;grid-row:1;padding:3px 6px;gap:5px}
  #top b{font-size:16px}
  .pchip .sc{font-size:15px;padding:0 5px}
  .pchip .ini,.pchip .wg,.pchip .wg2{font-size:10px;padding:0 4px}
  #stage{grid-column:1;grid-row:2;min-height:0;border-bottom:none}
  #bottom{grid-column:2;grid-row:2;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
    border-top:none;border-left:3px solid var(--brass);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  #waitbar{padding:2px 0 4px;font-size:11px}
  #waitbar .dranTxt{font-size:14px}
  #handbox{flex-direction:column;align-items:stretch;gap:6px;margin-bottom:6px;flex:1;min-height:0}
  #hand{flex-wrap:wrap;overflow-y:auto;max-height:132px;min-height:0;width:100%;padding-bottom:2px}
  .pcard{width:62px;height:41px}
  .pcard.hoch{width:38px;height:57px}
  .pcard.hoch i{width:57px;height:38px}
  #open .pcard{width:min(9vw,52px);height:calc(min(9vw,52px)*0.652)}
  #chat{width:100%;flex:1;min-height:140px;display:flex;flex-direction:column}
  #chatBody{flex:1;height:auto;min-height:0}
  #chatIn{padding:0 4px 4px}
  #chatIn input{padding:4px 6px;font-size:12px}
  #chat h4{padding:3px 7px;font-size:11px}
  #actions{flex-direction:column;gap:6px}
  #actions button{width:100%;padding:8px 4px;font-size:12.5px}
  #zoom button{width:32px;height:32px;font-size:17px}
  .box{padding:12px;max-height:94vh}
  .box h2{font-size:17px;margin-bottom:8px}
  .tcard{max-width:270px;margin:0 auto 6px}
}
/* Sehr flache Bildschirme: Seitenleiste kompakter */
@media (orientation:landscape) and (max-height:430px){
  body{grid-template-columns:minmax(0,1fr) 236px}
  #hand{max-height:96px}
  .pcard{width:54px;height:36px}
  .pcard.hoch{width:33px;height:50px}
  .pcard.hoch i{width:50px;height:33px}
  #open .pcard{width:min(8vw,46px);height:calc(min(8vw,46px)*0.652)}
  #chat{min-height:110px}
  #actions button{padding:6px 3px;font-size:11.5px}
}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-weight:600;font-size:12px;border:1px solid #0003}
input[type=text]{padding:11px;border-radius:8px;border:1.5px solid var(--frame);font-size:16px;width:100%}
.reveal{display:flex;gap:8px;justify-content:center;margin:12px 0}
.score-row{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #00000015;font-size:14px}
.lob-p{display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:15px}
.codebig{font-family:Georgia,serif;font-size:34px;letter-spacing:.35em;text-align:center;margin:8px 0 2px;color:var(--frame)}
.hidden{display:none !important}
</style>
</head>

async function hashPin(pin,code){
  const txt=code+':'+pin;
  if(window.crypto&&crypto.subtle){
    const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
    return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,32);

// Moegliche Aufteilungen der Wellenfelder w auf Faehrenkarten (fk) und Joker (lokW = dafuer noetige Joker).
function fkWellenKombis(w,loks,fk,M){
  if(!w)return [{fk:0,lokW:0}];
  if(!M)return loks>=w?[{fk:0,lokW:w}]:[];
  const d=M.deckt_wellen||2,res=[];
  for(let f=0;f<=Math.min(fk||0,Math.ceil(w/d));f++){const lw=Math.max(0,w-f*d);if(loks>=lw)res.push({fk:f,lokW:lw})}
  return res;
}
// Alle Bezahloptionen einer Strecke: Faehrenkarten decken je bis zu 2 Wellenfelder ab,
// verbleibende Wellenfelder brauchen Joker, alle uebrigen Felder Wagenkarten einer Farbe oder Joker.
// Ersatzregel (Skandinavien, Murmansk-Lieksa): ein Feld kann statt einer Farbkarte
// mit s.ersatz beliebigen Karten (auch Loks) bezahlt werden - je Feld frei waehlbar.
function ersatzOptionen(s,hand){
  const n=s.ersatz,ges=Object.keys(hand).reduce((a,k)=>a+(hand[k]||0),0),opts=[];
  const colors=s.farbe==='grau'?['rot','orange','gelb','gruen','blau','pink','weiss','schwarz']:[s.farbe];
  for(let k=0;k<=s.laenge;k++){
    const use=s.laenge-k,brauch=k*n;
    if(k===s.laenge){if(ges>=brauch)opts.push({col:null,use:0,lok:0,ersatz:k,ersatzKarten:brauch});continue}
    for(const col of colors){
      if((hand[col]||0)<use)continue;
      if(ges-use<brauch)continue;
      opts.push({col,use,lok:0,ersatz:k,ersatzKarten:brauch});
    }
  }
  opts.sort((a,b)=>(a.use+a.ersatzKarten)-(b.use+b.ersatzKarten)||a.ersatz-b.ersatz);
  return opts;
}

function bauOptionen(s,hand,fk,M,nurFT){
  if(s.ersatz)return ersatzOptionen(s,hand);

    for(const col of colors){

        if(gesehen.has(key))continue;gesehen.add(key);

// Reine Funktion: Leistenstaende aller Spieler -> Bonusliste.

// Nie beteiligt (Leiste 0) -> ohne_beteiligung, unabhaengig vom Platz.
function expressBonus(exp,M){
  const tab=((M&&M.bonus)||{})[String(exp.length)]||[];
  return exp.map(e=>{
    if(!e)return (M&&M.ohne_beteiligung!==undefined)?M.ohne_beteiligung:-20;
    const rang=exp.filter(x=>x>e).length;
    return tab.length?tab[Math.min(rang,tab.length-1)]:0;
  });
}

// ---------- Regionenbonus (Italia) ----------
// Reine Funktion: Strecken-Nummern eines Spielers -> Regionen je Teilnetz und Bonuspunkte.
function regionenPunkte(M,nrs){
  const RG=M.meta&&M.meta.regionen;if(!RG)return {netze:[],summe:0};
  const kn={};M.knoten.forEach(k=>kn[k.id]=k);
  const set=new Set(nrs),adj={};
  M.strecken.forEach(s=>{if(!set.has(s.nr))return;(adj[s.von]=adj[s.von]||[]).push(s.nach);(adj[s.nach]=adj[s.nach]||[]).push(s.von)});
  const seen=new Set(),netze=[],tab=RG.punkte||{},mx=RG.max||15,dop=RG.doppelt||{};
  Object.keys(adj).forEach(start=>{if(seen.has(start))return;const comp=new Set(),st=[start];
    while(st.length){const n=st.pop();if(seen.has(n))continue;seen.add(n);comp.add(n);(adj[n]||[]).forEach(q=>{if(!seen.has(q))st.push(q)})}
    const regs=new Set();comp.forEach(id=>{const k=kn[id];if(k&&k.region)regs.add(k.region)});
    let extra=0;Object.keys(dop).forEach(r=>{if(regs.has(r)&&dop[r].every(id=>comp.has(id)))extra++});
    const anz=regs.size+extra,pkt=anz>=5?(tab[String(Math.min(anz,mx))]||0):0;
    netze.push({anz,pkt,doppelt:extra})});
  netze.sort((a,b)=>b.anz-a.anz);
  return {netze,summe:netze.reduce((a,n)=>a+n.pkt,0)};
}
function regionenWertung(pi){const cl=(g()&&g().claims)||{};return regionenPunkte(MAP,Object.keys(cl).filter(nr=>cl[nr]===pi).map(Number))}

    let c=wrDraw(G,s);if(c===null)c=wrDraw(G,s==='w'?'s':'w');if(c===null)break;G.open.push(c);st=null}

function wrJokerReset(G){let guard=0;const K=MAP.meta.karten;

    G.open.forEach(c=>wrAblegen(G,c));G.open=[];

function wrWagenZahl(hand,f){return (hand['wagen_'+f]||0)+(hand['wagen_'+f+'_hafen']||0)}
function wrWagenPay(hand,f,n,pay){let a=Math.min(n,hand['wagen_'+f]||0);if(a)pay['wagen_'+f]=(pay['wagen_'+f]||0)+a;const r=n-a;if(r)pay['wagen_'+f+'_hafen']=(pay['wagen_'+f+'_hafen']||0)+r}
// Alle Bezahloptionen einer Weltreise-Strecke: {pay:{key:anzahl}, karten, joker, ueber}
function bauOptionenWR(s,hand){
  const J=hand.joker||0,cols=s.farbe==='grau'?WR_FARBEN:[s.farbe],opts=[],seen=new Set();
  const add=(pay,ueber)=>{const key=JSON.stringify(pay);if(seen.has(key))return;seen.add(key);
    const karten=Object.values(pay).reduce((a,b)=>a+b,0);opts.push({pay,karten,joker:pay.joker||0,ueber:ueber||0})};
  if(s.typ==='schiff'){
    for(const f of cols){const s1=hand['schiff_'+f+'_1']||0,s2=hand['schiff_'+f+'_2']||0;const L=s.laenge;
      for(let a=0;a<=s2;a++)for(let b=0;b<=s1;b++){const c=L-2*a-b;if(c<0)continue;if(c>J)continue;if(!(a+b+c))continue;
        const pay={};if(a)pay['schiff_'+f+'_2']=a;if(b)pay['schiff_'+f+'_1']=b;if(c)pay.joker=c;add(pay,0)}
      if(s2){ // Ueberzahlung immer erlaubt: eine Doppelschiffskarte deckt auch nur ein Feld (Rest verfaellt), z.B. 4 Doppel fuer eine 7er-Strecke
        for(let a=1;a<=s2;a++)for(let b=0;b<=s1;b++){const c=L+1-2*a-b;if(c<0||c>J)continue;const pay={};pay['schiff_'+f+'_2']=a;if(b)pay['schiff_'+f+'_1']=b;if(c)pay.joker=c;add(pay,1)}}
    }
  } else if(s.gelaende){
    // Unwegsames Gelaende: je Gelaende-Feld 2 gleichfarbige Wagenkarten (Farbe frei), Restfelder normal (grau = beliebig)
    const n=s.gelaende,rest=s.laenge-n;
    const paare=[];WR_FARBEN.forEach(f=>{const w=wrWagenZahl(hand,f);for(let j=0;j<=Math.min(2,J);j++){if(w>=2-j)paare.push({f,w:2-j,j})}});
    if(J>=2)paare.push({f:null,w:0,j:2});
    const rec=(i,start,pay,jk)=>{
      if(i===n){ // Restfelder
        if(!rest){add(Object.assign({},pay),0);return}
        const rc=s.farbe==='grau'?WR_FARBEN:[s.farbe];
        for(const f of rc){for(let l=0;l<=Math.min(J-jk,rest);l++){const use=rest-l;
          const frei=wrWagenZahl(hand,f)-(((pay['wagen_'+f]||0)+(pay['wagen_'+f+'_hafen']||0)));
          if(frei<use)continue;const p2=Object.assign({},pay);if(use)wrWagenPay(hand,f,use,p2);if(l)p2.joker=(p2.joker||0)+l;add(p2,0)}}
        return}
      for(let q=start;q<paare.length;q++){const pr=paare[q];
        if(jk+pr.j>J)continue;
        if(pr.f){const used=(pay['wagen_'+pr.f]||0)+(pay['wagen_'+pr.f+'_hafen']||0);if(wrWagenZahl(hand,pr.f)-used<pr.w)continue}
        const p2=Object.assign({},pay);if(pr.f&&pr.w)wrWagenPay(hand,pr.f,pr.w,p2);if(pr.j)p2.joker=(p2.joker||0)+pr.j;
        rec(i+1,q,p2,jk+pr.j)}};
    rec(0,0,{},0);
  } else {
    for(const f of cols){const w=wrWagenZahl(hand,f);
      for(let l=0;l<=Math.min(J,s.laenge);l++){const use=s.laenge-l;if(w<use)continue;const pay={};if(use)wrWagenPay(hand,f,use,pay);if(l)pay.joker=l;add(pay,0)}}
  }
  opts.sort((a,b)=>a.ueber-b.ueber||a.joker-b.joker||a.karten-b.karten);
  return opts;
}

function wrRouteStatus(pi,t){

function layout(s,off){
  const pts=pathPts(s),L=[];let tot=0;
  for(let i=1;i<pts.length;i++){const dd=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);L.push(dd);tot+=dd}
  const pad=Math.min(15,tot*0.1),inner=tot-2*pad,n=s.laenge;
  const gap=Math.min(5,inner*.06/n+1.5),segL=(inner-gap*(n-1))/n,out=[];
  for(let i=0;i<n;i++){

    let acc=0,seg=0;while(seg<L.length-1&&acc+L[seg]<target)acc+=L[seg++];
    const a=pts[seg],b2=pts[seg+1],ux=(b2.x-a.x)/L[seg],uy=(b2.y-a.y)/L[seg];

function zugText(l){
  if(!l||!l.length)return null;
  const p=l.map(x=>x==='?'?'eine verdeckte Karte':(x==='lok'||x==='joker'?'einen Joker':(x==='fk'?'eine Fährenkarte':(WR()&&!CNAME[x]?'eine '+wrName(x)+'-Karte':'eine '+CNAME[x]+'-Karte'))));
  return 'zieht '+(p.length>1?p.slice(0,-1).join(', ')+' und '+p[p.length-1]:p[0]);
}
function endTurn(){
  window._blind1=null;
  const G=g();G.drawn=0;
  G.zuege=(G.zuege||0)+1;
  const zt=zugText(G.pend);
  if(zt){cur().last=zt;G.notice=cur().name+' '+zt}
  if(IB()&&(G.festNotiz||[]).length){const t=' · aufgedeckt: '+G.festNotiz.map(x=>x==='draft'?'Zielkarten-Draft-Karte':'Festivalkarte '+festName(x)).join(', ');
    cur().last=(cur().last||'')+t;G.notice=(G.notice||cur().name)+t;delete G.festNotiz}
  delete G.pend;
  if(ROOM.test){G.turn=0;sync();return}
  if(WR()&&G.lastRounds<0&&wrFiguren(cur())<=((R().figuren_ende!==undefined)?R().figuren_ende:6)){G.lastRounds=ROOM.players.length*((R().letzte_runden)||2);me().last='läutet die Schlussrunden ein';G.notice=cur().name+' hat nur noch '+wrFiguren(cur())+' Figuren – jeder ist noch '+((R().letzte_runden)||2)+'-mal an der Reihe!'}
  else if(!WR()&&G.lastRounds<0&&cur().wagons<=2&&(!EXPM()||(G.expRest||0)<=2)){G.lastRounds=ROOM.players.length;me().last='läutet die letzte Runde ein';G.notice=cur().name+' hat nur noch '+cur().wagons+' Wagons'+(EXPM()?' und der Expresszug-Vorrat ist auf '+(G.expRest||0)+' gesunken':'')+' – letzte Runde! '+cur().name+' ist als Letzter noch einmal dran.'}
  else if(G.lastRounds>0){G.lastRounds--;if(G.lastRounds===0){G.over=true;ROOM.status='over';finalScore();sync();return}}
  G.turn=(G.turn+1)%ROOM.players.length;G.frist=limitMs()?Date.now()+limitMs():0;
  if(IB()&&G.draftPend){delete G.draftPend;draftStart(G,2,-1);G.notice='Die Zielkarten-Draft-Karte wurde gezogen – zweiter Draft (Weitergabe nach rechts).'}
  sync();
}
function flyCard(src,cls,bg){
  const r=src.getBoundingClientRect(),h=document.getElementById('hand').getBoundingClientRect();
  const d=document.createElement('div');d.className='pcard fly '+cls;if(bg){d.style.backgroundImage='url('+bg+')';d.style.backgroundSize='cover'}
  d.style.left=r.left+'px';d.style.top=r.top+'px';document.body.appendChild(d);
  requestAnimationFrame(()=>{d.style.transform='translate('+(h.left+10-r.left)+'px,'+(h.top+2-r.top)+'px) scale(.85)';d.style.opacity='.25'});
  setTimeout(()=>d.remove(),480);
}

  if(WR()){wrTakeOpen(i);return}
  const c=g().open[i];const lokFrei=!!R().lok_frei_ziehen;
  if(c==='lok'&&!lokFrei&&g().drawn>0){toast('Ein offener Joker zählt als ganzer Zug.');return}
  const src=document.querySelectorAll('#open .pcard')[i+1];if(src)flyCard(src,'pc-'+c);
  const nc=drawCard(g());if(nc===null){g().open.splice(i,1)}else{g().open[i]=nc}
  me().hand[c]=(me().hand[c]||0)+1;lokReset(g());
  (g().pend=g().pend||[]).push(c);g().drawn+=(c==='lok'&&!lokFrei)?2:1;g().drawn>=2?endTurn():sync()}

  if(c==='joker'&&G.drawn>0){toast('Ein offener Joker zählt als ganzer Zug.');return}

  m.querySelector('#nlW').onclick=()=>{m.remove();fertig('w')};m.querySelector('#nlS').onclick=()=>{m.remove();fertig('s')};

function takeGel(i){
  if(tkGuard())return;
  if(!myTurn()||g().drawn>=2)return;
  const G=g();let c;
  if(i===-1){c=gelZiehen(G);if(c===null){toast('Keine Landschaftskarten mehr.');return}}
  else{c=(G.gelOpen||[])[i];if(c===undefined)return;G.gelOpen.splice(i,1);gelNachlegen(G)}
  const p=me();p.gel=p.gel||{};p.gel[c]=(p.gel[c]||0)+1;
  (G.pend=G.pend||[]).push('gel');G.drawn+=1;
  toast('Landschaftskarte: '+GELNAME[c]);
  G.drawn>=2?endTurn():sync();
}

function tryClaim(s){
  if(tkGuard())return;
  if(!myTurn()){toast(ROOM.status==='playing'?'Du bist nicht dran – '+cur().name+' ist am Zug.':'');return}
  if(g().drawn>0){toast('Du hast schon Karten gezogen – erst den Zug beenden.');return}
  if(g().claims[s.nr]!==undefined){toast('Diese Strecke ist schon gebaut.');return}
  if(ROOM.test){doClaim(s,WR()?{pay:{}}:{col:s.farbe,use:0,lok:0});return}
  const p=me();
  const expAktiv=!!EXPM()&&s.express&&(g().expRest||0)>0;
  if(WR()){if(s.typ==='schiff'?(p.schiffe||0)<s.laenge:(p.wagons||0)<s.laenge){toast('Nicht genug '+(s.typ==='schiff'?'Schiffe ('+(p.schiffe||0):'Waggons ('+(p.wagons||0))+' übrig) – vielleicht Figuren tauschen?');return}}
  else if(!expAktiv&&p.wagons<s.laenge){toast('Nicht genug Wagons ('+p.wagons+' übrig).');return}
  const parallel=dmList(s);
  if(parallel.length){
    const belegt=parallel.map(nr=>g().claims[nr]).filter(v=>v!==undefined);
    // Dreifachstrecken (3+ Gleise) sind immer voll nutzbar; die Sperre gilt nur fuer echte Doppelstrecken.
    if(belegt.length&&parallel.length<2){
      const abD=dopAb();
      if(ROOM.players.length<abD){toast('Bei weniger als '+abD+' Spielern ist nur ein Gleis einer Doppelstrecke nutzbar.');return}
    }
    if(belegt.includes(SEAT)){toast('Ein Spieler darf nur ein Gleis einer Doppel- oder Dreifachstrecke besitzen.');return}
  }
  if(WR()){const o2=bauOptionenWR(s,p.hand);if(!o2.length){toast(s.typ==='schiff'?'Nicht genug Schiffskarten ('+s.laenge+' Schiffe in '+CNAME[s.farbe]+'; Doppelschiff = 2).':(s.gelaende?'Unwegsames Gelände: je Feld 2 gleichfarbige Wagenkarten nötig.':'Nicht genug Wagenkarten ('+s.laenge+' '+CNAME[s.farbe]+').'));return}payModal(s,o2);return}
  const fz=s.faehre||0;
  const loks=p.hand.lok||0;
  if(fz&&!fkWellenKombis(fz,loks,p.fk||0,FK()).length){toast(FK()?'Fähre: Für die '+fz+' Wellenfelder brauchst du Joker (1 je Feld) oder Fährenkarten (1 je 2 Felder).':'Fähre: Du brauchst mindestens '+fz+' Joker.');return}
  const nurFT=!!R().lok_nur_faehre_tunnel&&!s.faehre&&!s.tunnel;
  const opts=bauOptionen(s,p.hand,p.fk||0,FK(),nurFT);
  if(!opts.length){toast(s.ersatz?'Nicht genug Karten: '+s.laenge+' Karten einer Farbe – oder je Feld '+s.ersatz+' beliebige Karten (Joker erlaubt).':(fz?'Nicht genug Karten für die Fähre.':'Nicht genug passende Karten ('+s.laenge+' '+CNAME[s.farbe]+')'+(nurFT?' – Joker gibt es hier nur für Fähren und Tunnel.':'.')));return}
  payModal(s,opts);
}

  const m=modal('<h2>'+vn+' – '+nn+'</h2><p style="font-size:14px;margin-bottom:10px">Länge '+s.laenge+' · Farbe: '+CNAME[s.farbe]+(WR()?(s.typ==='schiff'?' · <b>Schiffsstrecke</b>':' · <b>Zugstrecke</b>')+(s.gelaende?' · <b>Unwegsames Gelände: je Feld 2 gleichfarbige Wagenkarten</b>':''):'')+(s.ersatz?' · <b>Sonderstrecke: je Feld 1 Farbkarte oder '+s.ersatz+' beliebige Karten (Joker erlaubt)</b>':'')+(s.tunnel?' · <b>Tunnel</b>':'')+(s.faehre?' · <b>Fähre ('+s.faehre+(FK()?' Wellenfelder: Joker oder Fährenkarten':' Joker Pflicht')+')</b>':'')+(EXPM()&&s.express?((g().expRest||0)>0?' · <b>Express-Strecke: keine Waggons, keine Punkte, +'+s.laenge+' auf der Entwicklungsleiste</b>':' · <b>Expresszüge aufgebraucht – normale graue Strecke</b>'):'')+(s.s9?' · S9':'')+'</p><div id="payopts"></div><button class="go" id="payGo">'+(s.tunnel?'Tunnel bauen (3 Karten aufdecken)':'Strecke bauen')+(s.tunnel?'<div style=\"font-size:12px;color:#8a7d63;margin-top:6px;text-align:center\">Reichen deine Karten für den Aufschlag nicht oder willst du nicht zahlen, ist dein Zug vorbei.</div>':'')+'</button><button class="cancel" id="payNo">Abbrechen</button>');
  const wrap=m.querySelector('#payopts');
  opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt'+(i===0?' sel':'');
    b.innerHTML=o.ersatz!==undefined?((o.use?o.use+'× <span class="chip" style="background:'+CARDCOL[o.col]+';'+(o.col==='gelb'||o.col==='weiss'?'color:#333':'')+'">'+CNAME[o.col]+'</span>':'')
      +(o.ersatz?(o.use?' + ':'')+'<b>'+o.ersatzKarten+'</b> beliebige Karten <small style="color:#8a7d63">('+o.ersatz+' Feld'+(o.ersatz===1?'':'er')+' × '+s.ersatz+')</small>':'')):
      o.pay?wrOptHtml(o):(o.use?o.use+'× <span class="chip" style="background:'+CARDCOL[o.col]+';'+(o.col==='gelb'||o.col==='weiss'?'color:#333':'')+'">'+CNAME[o.col]+'</span> ':'')+(o.lok?(o.use?'+ ':'')+o.lok+'× <span class="chip" style="background:'+CARDCOL.lok+'">Joker</span>':'')+(o.fk?' + '+o.fk+'× <span class="chip" style="background:#7f9db3;color:#123a5a">Fähre</span>':'');
    b.onclick=()=>{sel=i;wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};
    wrap.appendChild(b)});
  m.querySelector('#payNo').onclick=()=>m.remove();
  m.querySelector('#payGo').onclick=()=>{m.remove();const o=opts[sel];
    const weiter=o2=>{s.tunnel?tunnelStep(s,o2):gelaendeFrage(s,o2)};
    if(o.ersatz)ersatzModal(s,o,weiter);else weiter(o)};
}

  const G=g(),p=me();

  G.notice=p.name+' '+p.last+' – der Zug ist damit vorbei.';

function tunnelStep(s,o){
  const G=g(),rev=[];for(let i=0;i<3;i++){const c=drawCard(G);if(c!==null)rev.push(c)}
  const allLok=o.use===0;
  const extra=rev.filter(c=>allLok?c==='lok':(c===o.col||c==='lok')).length;
  G.discard.push(...rev);
  const p=me();
  let html='<h2>Tunnel: 3 Karten aufgedeckt</h2><div class="reveal">'+rev.map(c=>'<div class="pcard sm pc-'+c+'" title="'+CNAME[c]+'"></div>').join('')+'</div>';
  if(extra===0){html+='<p style="text-align:center;font-size:15px">Keine zusätzlichen Karten nötig!</p><button class="go" id="tOk">Bauen</button>';
    const m=modal(html);m.querySelector('#tOk').onclick=()=>{m.remove();gelaendeFrage(s,o)};return}
  const extraCol=(p.hand[o.col]||0)-o.use,extraLok=(p.hand.lok||0)-o.lok;
  const can=[];
  for(let l=0;l<=Math.min(extraLok,extra);l++){if((allLok?0:extraCol)>=extra-l||(allLok&&l===extra))can.push({use:allLok?0:extra-l,lok:l})}
  if(!can.length){html+='<p style="font-size:14px">Du musst <b>'+extra+'</b> zusätzliche Karte(n) zahlen, hast aber nicht genug. Du behältst deine Karten – <b>dein Zug ist damit vorbei</b>.</p><button class="go" id="tOk">Verstanden</button>';
    const m=modal(html);m.querySelector('#tOk').onclick=()=>{m.remove();tunnelAbbruch(s,'kann die '+extra+' zusätzliche(n) Karte(n) aber nicht zahlen')};return}
  html+='<p style="font-size:14px;margin-bottom:8px">Zusätzlich fällig: <b>'+extra+'</b> Karte(n) in '+(allLok?'Joker':CNAME[o.col]+'/Joker')+'.</p><div id="topts"></div><button class="go" id="tPay">Zahlen und bauen</button><button class="cancel" id="tNo">Nicht zahlen (Zug ist dann vorbei)</button>';
  const m=modal(html);const wrap=m.querySelector('#topts');let sel=0;
  can.forEach((c2,i)=>{const b=document.createElement('button');b.className='opt'+(i===0?' sel':'');
    b.textContent=(c2.use?c2.use+'× '+CNAME[o.col]:'')+(c2.use&&c2.lok?' + ':'')+(c2.lok?c2.lok+'× Joker':'');
    b.onclick=()=>{sel=i;wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};wrap.appendChild(b)});
  m.querySelector('#tNo').onclick=()=>{m.remove();tunnelAbbruch(s,'zahlt die '+extra+' zusätzliche(n) Karte(n) aber nicht')};
  m.querySelector('#tPay').onclick=()=>{m.remove();const c2=can[sel];gelaendeFrage(s,{col:o.col,use:o.use+c2.use,lok:o.lok+c2.lok})};
}
function gelaendeFrage(s,o){
  const t=GEL()?gelTypVon(s.farbe):null;
  if(!t){doClaim(s,o);return}
  const p=me(),noetig=gelKosten(s.laenge),eigen=gelAnzahl(p,t),andere=gelMaxAndere(t);
  const frei=Math.max(0,(p.hand.lok||0)-(o.lok||0));
  let w=null;
  for(let l=0;l<=frei;l++){const eff=eigen+l;
    if(eff>=noetig&&eff>=andere){w={typ:t,karten:Math.min(eigen,noetig),lok:l};break}}
  if(!w){doClaim(s,o);return}
  const pkt=PTSv(s.laenge);
  const einsatz=(w.karten?w.karten+'× '+GELNAME[t]:'')+(w.karten&&w.lok?' + ':'')+(w.lok?w.lok+'× Joker':'');
  const m=modal('<h2>Punkte verdoppeln?</h2>'
    +'<p style="font-size:14px;margin-bottom:10px">'+nodes[s.von].name+' – '+nodes[s.nach].name
    +' bringt '+pkt+' Punkte. Mit Landschaftskarten werden daraus <b>'+(pkt*2)+'</b>.</p>'
    +'<p style="font-size:14px;margin-bottom:10px">Einsatz: <b>'+einsatz+'</b>'
    +(w.lok?' – Joker ersetzen fehlende Landschaftskarten.':'')+'</p>'
    +'<p style="font-size:13px;color:#8a7d63;margin-bottom:10px">Du hast danach '+(eigen-w.karten)
    +'× '+GELNAME[t]+' vor dir liegen.</p>'
    +'<button class="go" id="gelJa">Verdoppeln</button>'
    +'<button class="cancel" id="gelNein">Ohne Verdoppelung bauen</button>');
  m.querySelector('#gelJa').onclick=()=>{m.remove();doClaim(s,o,w)};
  m.querySelector('#gelNein').onclick=()=>{m.remove();doClaim(s,o)};
}
function doClaim(s,o,gel){
  const G=g(),p=me();
  if(o.pay)wrHandAbziehen(p,G,o.pay);
  if(o.use){p.hand[o.col]-=o.use;if(!p.hand[o.col])delete p.hand[o.col];for(let i=0;i<o.use;i++)G.discard.push(o.col)}
  if(o.mix)for(const k in o.mix){const n=o.mix[k];if(!n)continue;p.hand[k]-=n;if(p.hand[k]<=0)delete p.hand[k];for(let i=0;i<n;i++)G.discard.push(k)}
  if(o.lok){p.hand.lok-=o.lok;if(!p.hand.lok)delete p.hand.lok;for(let i=0;i<o.lok;i++)G.discard.push('lok')}
  if(o.fk){p.fk=(p.fk||0)-o.fk;if(p.fk<=0)delete p.fk;G.fk=(G.fk||0)+o.fk}   // eingesetzte Faehrenkarten zurueck in den Stapel
  if(gel){p.gel=p.gel||{};
    if(gel.karten){p.gel[gel.typ]=(p.gel[gel.typ]||0)-gel.karten;if(!p.gel[gel.typ])delete p.gel[gel.typ];
      for(let i=0;i<gel.karten;i++)(G.gelDiscard=G.gelDiscard||[]).push(gel.typ)}
    if(gel.lok){p.hand.lok-=gel.lok;if(!p.hand.lok)delete p.hand.lok;for(let i=0;i<gel.lok;i++)G.discard.push('lok')}}
  // Im Testmodus zusaetzlich Streckennummer, Laenge und Farbe ausweisen (Kontrolle der Kartendaten)
  const info=ROOM.test?' [#'+s.nr+', '+s.laenge+'× '+(s.farbe==='grau'?'Grau':CNAME[s.farbe])
    +(s.faehre?', Fähre '+s.faehre:'')+(s.tunnel?', Tunnel':'')+(s.express?', Express':'')+']':'';
  if(!ROOM.test&&EXPM()&&s.express&&(G.expRest||0)>0){
    // Expresszug aus dem Vorrat: keine Waggons, keine Streckenpunkte, Leistenfortschritt,
    // Strecke gehoert danach allen ('X' in claims).
    G.expRest--;p.exp=Math.min(EXPM().leiste_max||30,(p.exp||0)+s.laenge);
    G.claims[s.nr]='X';
    p.last='baut die Express-Strecke '+nodes[s.von].name+' – '+nodes[s.nach].name+info
      +' (+'+s.laenge+' auf der Entwicklungsleiste, Vorrat: '+G.expRest+')';
    G.notice=p.name+' '+p.last;
    endTurn();
    return;
  }
  const pkt=PTSv(s.laenge)*(gel?2:1);
  if(WR()&&s.typ==='schiff')p.schiffe-=s.laenge;else p.wagons-=s.laenge;p.score+=pkt;
  G.claims[s.nr]=SEAT;p.last='baut '+nodes[s.von].name+' – '+nodes[s.nach].name+info+(o.pay?' mit '+wrPayText(o.pay):'')+(o.fk?' mit '+o.fk+' Fährenkarte'+(o.fk>1?'n':''):'')+' (+'+pkt+(gel?', verdoppelt mit '+GELNAME[gel.typ]:'')+')';G.notice=p.name+' '+p.last;
  if(IB()){const av=[...new Set([festStapel(s.von),festStapel(s.nach)].filter(x=>x&&(G.festOffen||{})[x]>0))];
    const nimm=x=>{const k=festNimm(G,p,x);p.last+=' · nimmt '+k+' Festivalkarte'+(k>1?'n':'')+' '+festName(x);G.notice=p.name+' '+p.last};
    if(av.length===2){const m=modal('<h2>🎪 Festivalkarten</h2><p style="font-size:14px;margin-bottom:10px">Beide Städte haben offene Festivalkarten – du darfst nur <b>eine</b> Stadt nehmen.</p>'
        +av.map((x,i)=>'<button class="go" id="fw'+i+'">'+festName(x)+' ('+G.festOffen[x]+' Karte'+(G.festOffen[x]>1?'n':'')+')</button>').join(''));
      av.forEach((x,i)=>{m.querySelector('#fw'+i).onclick=()=>{m.remove();nimm(x);endTurn()}});return}
    if(av.length===1)nimm(av[0])}
  endTurn();
}

let BHX={};
function bhRegel(){return R().bahnhoefe||{}}
function bhAnzahl(){return bhRegel().anzahl||0}
function bhKosten(n){const k=bhRegel().kosten||[1,2,3];return k[n]!==undefined?k[n]:(n+1)}
function bhBesetzt(){const s=new Set();(ROOM.players||[]).forEach(q=>(q.bahnhoefe||[]).forEach(c=>s.add(c)));return s}
function bhOptionen(pi){
  const p=ROOM.players[pi],st=(p&&p.bahnhoefe)||[];
  return st.map(cityId=>{const o=[null];
    MAP.strecken.forEach(s=>{const c=g().claims[s.nr];
      if(c===undefined||c===pi)return;
      if(s.von===cityId||s.nach===cityId)o.push(s.nr)});
    return o});
}
function bhWahlBerechnen(pi){
  const p=ROOM.players[pi];
  if(!bhAnzahl()||!p||!(p.bahnhoefe||[]).length){BHX[pi]=null;return}
  const lists=bhOptionen(pi);
  if(lists.reduce((a,l)=>a*l.length,1)>4000){BHX[pi]=null;return}
  let best=null,bestVal=-1e9;
  const rec=(i,acc)=>{
    if(i===lists.length){
      BHX[pi]=new Set(acc);
      let v=0;(p.tickets||[]).forEach(t=>{v+=tkWert(pi,t)});
      if(v>bestVal){bestVal=v;best=new Set(acc)}
      return}
    lists[i].forEach(o=>rec(i+1,o===null?acc:acc.concat([o])));
  };
  rec(0,[]);
  BHX[pi]=best;
}
function baueBahnhof(){
  if(tkGuard())return;
  if(!myTurn()){toast(ROOM.status==='playing'?'Du bist nicht dran – '+cur().name+' ist am Zug.':'');return}
  if(g().drawn>0){toast('Du hast schon Karten gezogen – erst den Zug beenden.');return}
  const p=me(),anz=bhAnzahl();
  if(!anz){toast('Diese Edition kennt keine Bahnhöfe.');return}
  const gebaut=(p.bahnhoefe||[]).length;
  if(gebaut>=anz){toast('Du hast schon alle '+anz+' Bahnhöfe gebaut.');return}
  const kosten=bhKosten(gebaut);
  const bes=bhBesetzt();
  const frei=MAP.knoten.filter(k=>!bes.has(k.id)).sort((a,b)=>a.name.localeCompare(b.name,'de'));
  if(!frei.length){toast('In jeder Stadt steht schon ein Bahnhof.');return}
  const loks=p.hand.lok||0,opts=[],gesehen=new Set();
  for(const col of ['rot','orange','gelb','gruen','blau','pink','weiss','schwarz']){
    const have=p.hand[col]||0;
    for(let l=0;l<=Math.min(loks,kosten);l++){
      const use=kosten-l;if(have<use)continue;
      const key=use?col+':'+use+':'+l:'lok:'+l;
      if(gesehen.has(key))continue;gesehen.add(key);
      opts.push({col,use,lok:l});
    }
  }
  if(!opts.length){toast('Du brauchst '+kosten+' gleichfarbige Karte(n) (Joker zählen mit).');return}
  let sel=0;
  const m=modal('<h2>Bahnhof bauen</h2>'
    +'<p style="font-size:14px;margin-bottom:10px">Dein '+(gebaut+1)+'. Bahnhof kostet <b>'+kosten+'</b> Karte(n) einer Farbe. '
    +'Er erlaubt dir am Spielende, <b>genau eine</b> fremde Strecke zu nutzen, die in dieser Stadt endet. '
    +'Jeder nicht gebaute Bahnhof bringt am Ende '+((bhRegel().punkte_pro_ungebautem)||4)+' Punkte.</p>'
    +'<div style="font-size:13px;color:#8a7d63;margin-bottom:4px">Stadt:</div>'
    +'<select id="bhCity" style="width:100%;padding:9px;border-radius:8px;border:1.5px solid #5a4632;font-size:15px;margin-bottom:10px">'
    +frei.map(k=>'<option value="'+k.id+'">'+k.name+'</option>').join('')+'</select>'
    +'<div id="bhOpts"></div><button class="go" id="bhGo">Bahnhof bauen</button><button class="cancel" id="bhNo">Abbrechen</button>');
  const wrap=m.querySelector('#bhOpts');
  opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt'+(i===0?' sel':'');
    b.innerHTML=(o.use?o.use+'× <span class="chip" style="background:'+CARDCOL[o.col]+';'+(o.col==='gelb'||o.col==='weiss'?'color:#333':'')+'">'+CNAME[o.col]+'</span> ':'')
      +(o.lok?(o.use?'+ ':'')+o.lok+'× <span class="chip" style="background:'+CARDCOL.lok+'">Joker</span>':'');
    b.onclick=()=>{sel=i;wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};
    wrap.appendChild(b)});
  m.querySelector('#bhNo').onclick=()=>m.remove();
  m.querySelector('#bhGo').onclick=()=>{const city=m.querySelector('#bhCity').value;m.remove();doBahnhof(city,opts[sel])};
}
function doBahnhof(cityId,o){
  const G=g(),p=me();
  if(o.use){p.hand[o.col]-=o.use;if(!p.hand[o.col])delete p.hand[o.col];for(let i=0;i<o.use;i++)G.discard.push(o.col)}
  if(o.lok){p.hand.lok-=o.lok;if(!p.hand.lok)delete p.hand.lok;for(let i=0;i<o.lok;i++)G.discard.push('lok')}
  p.bahnhoefe=(p.bahnhoefe||[]).concat([cityId]);
  p.last='baut einen Bahnhof in '+nodes[cityId].name;G.notice=p.name+' '+p.last;
  endTurn();
}
function renderBahnhoefe(){
  const L=document.getElementById('bhL');if(!L)return;L.innerHTML='';
  if(!g()||!bhAnzahl())return;
  ROOM.players.forEach(p=>{(p.bahnhoefe||[]).forEach(id=>{const k=nodes[id];if(!k)return;
    const hex=(PCOL.find(c=>c.id===p.col)||PCOL[0]).hex,cx=k.x*10,cy=k.y*(BH/100);
    L.appendChild(el('rect',{x:cx-5,y:cy-1,width:10,height:8,rx:1.2,fill:hex,stroke:'#2b2419','stroke-width':1.3}));
    L.appendChild(el('path',{d:'M'+(cx-7.5)+' '+(cy-1)+'L'+cx+' '+(cy-7.5)+'L'+(cx+7.5)+' '+(cy-1)+'Z',fill:hex,stroke:'#2b2419','stroke-width':1.3}));
  })});
}

// ---------- Aufträge ----------
function drawTickets(){
  if(!myTurn())return;
  if(g().tkPend){if(tkPendMine())tkPendReopen();return}
  if(g().drawn>0){toast('Du hast schon Karten gezogen.');return}
  const gesamt=g().ticketDeck.length+((R().auftraege_nachziehen||{}).stapelwahl?((g().ticketDeckLang||[]).length):0);
  if(!gesamt){toast('Keine Aufträge mehr im Stapel.');return}
  const anz=Math.min((R().auftraege_nachziehen||{}).ziehen||4,gesamt);
  const f=modal('<h2>Aufträge ziehen?</h2><p style="font-size:14px;margin-bottom:12px">Du ziehst '+anz
    +' Auftragskarten und musst mindestens eine behalten. Das ist dein kompletter Zug – du kannst dann keine Wagenkarten nehmen und keine Strecke bauen.</p>'
    +'<button class="go" id="ja">Ja, Aufträge ziehen</button><button class="cancel" id="nein">Abbrechen</button>');
  f.querySelector('#nein').onclick=()=>f.remove();
  f.querySelector('#ja').onclick=()=>{f.remove();zieheAuftraege()};
}
function stapelWahl(n,maxK,maxL,done){
  let h='<h2>Aufträge ziehen</h2><p style="font-size:14px;margin-bottom:10px">Du ziehst <b>'+n+'</b> Karten. Sag vorher an, wie viele davon <b>lange Strecken</b> sein sollen:</p><div id="swOpts"></div>';
  const m=modal(h);const w=m.querySelector('#swOpts');let any=false;
  for(let l=0;l<=n;l++){const k=n-l;if(l>maxL||k>maxK)continue;any=true;
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='<b>'+l+'</b> lange + <b>'+k+'</b> kurze';
    b.onclick=()=>{m.remove();done(l)};w.appendChild(b)}
  if(!any){m.remove();toast('Nicht genug Auftragskarten im Stapel.');return}
  return m;
}
// Das gezogene Angebot wird sofort als g().tkPend gespeichert und synchronisiert.
// Dadurch ueberlebt es einen Refresh: der Spieler landet wieder in der Auswahl
// und kann den Zug nicht in etwas anderes (Karten ziehen, bauen) umwandeln.
function tkPendMine(){const G=g();return G&&G.tkPend&&G.tkPend.seat===SEAT&&ROOM.status==='playing'}
function tkGuard(){
  if(!tkPendMine())return false;
  toast('Du hast Aufträge gezogen – bitte erst die Auswahl abschließen.');
  tkPendReopen();
  return true;
}
function tkPendReopen(){
  if(!tkPendMine()||document.getElementById('tkModal'))return;
  const P=g().tkPend;
  ticketModal(P.tk||[],P.min||1,keep=>tkPendFertig(keep));
}
function tkPendFertig(keep){
  const G=g(),P=G.tkPend;if(!P)return;
  const offer=P.tk||[];
  offer.forEach((t,i)=>{
    if(keep.has(i)){me().tickets.push(t);return}
    if(P.raus)return;                                  // Hausregel: abgelehnte Aufträge aus dem Spiel
    if(P.stapel&&t.lang)(G.ticketDeckLang=G.ticketDeckLang||[]).push(t);
    else G.ticketDeck.push(t);
  });
  delete G.tkPend;
  me().last='zieht '+keep.size+' neue(n) Auftrag/Aufträge';endTurn();
}
function zieheAuftraege(){
  const rs=R().auftraege_nachziehen||{};
  const G=g();
  if(IB()&&!G.draft2Done){toast('Zielkarten ziehen ist erst nach dem zweiten Zielkarten-Draft erlaubt.');return}
  if(G.tkPend){tkPendReopen();return}
  if(rs.stapelwahl){
    G.ticketDeckLang=G.ticketDeckLang||[];
    const n=Math.min(rs.ziehen||4,G.ticketDeck.length+G.ticketDeckLang.length);
    if(!n){toast('Keine Aufträge mehr im Stapel.');return}
    stapelWahl(n,G.ticketDeck.length,G.ticketDeckLang.length,nl=>{
      const offer=G.ticketDeckLang.splice(0,nl).concat(G.ticketDeck.splice(0,n-nl));
      G.tkPend={seat:SEAT,tk:offer,min:rs.mindestens_behalten||1,stapel:true};
      sync();
      tkPendReopen();
    });
    return;
  }
  const offer=G.ticketDeck.splice(0,Math.min(rs.ziehen||4,G.ticketDeck.length));
  G.tkPend={seat:SEAT,tk:offer,min:rs.mindestens_behalten||1};
  if(R().auftraege_raus)G.tkPend.raus=true;
  sync();
  tkPendReopen();
}
const ROTE_ORTE=new Set(['Gymnasium','Bahnhof','Sender','Pollen','Vogelsiedlung','Rathaus','Busbahnhof']);
let AUSSEN_ORTE=new Set();
let TPOSL={};MAP.knoten.forEach(k=>{const n=k.name.replace(/ \((Nordost|Ost)\)/,'');(TPOSL[n]=TPOSL[n]||[]).push(k.tkx!=null?[k.x,k.y,k.tkx,k.tky]:[k.x,k.y]);if(k.rand)AUSSEN_ORTE.add(n)});
let _tkUid=0;
const LANDFLAGGE={'Deutschland':{d:'h',c:['#000000','#dd0000','#ffce00']},'Frankreich':{d:'v',c:['#0055a4','#ffffff','#ef4135']},'Italien':{d:'v',c:['#009246','#ffffff','#ce2b37']},'Österreich':{d:'h',c:['#ed2939','#ffffff','#ed2939']},'Francia':{d:'v',c:['#0055a4','#ffffff','#ef4135']},'Monaco':{d:'h',c:['#ce1126','#ce1126','#ffffff']},'Svizzera':{d:'h',c:['#da291c','#ffffff','#da291c']},'Austria':{d:'h',c:['#ed2939','#ffffff','#ed2939']},'Croazia':{d:'h',c:['#ff0000','#ffffff','#171796']}};
function flagKreis(name,cx,cy,r){
  const f=LANDFLAGGE[name];if(!f)return '';
  const id='tkfl'+(++_tkUid);let rects='';
  for(let i=0;i<3;i++){rects+=f.d==='h'
    ?'<rect x="'+(cx-r)+'" y="'+(cy-r+i*2*r/3)+'" width="'+(2*r)+'" height="'+(2*r/3+0.6)+'" fill="'+f.c[i]+'"/>'
    :'<rect x="'+(cx-r+i*2*r/3)+'" y="'+(cy-r)+'" width="'+(2*r/3+0.6)+'" height="'+(2*r)+'" fill="'+f.c[i]+'"/>'}
  return '<clipPath id="'+id+'"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'"/></clipPath><g clip-path="url(#'+id+')">'+rects+'</g><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#6b4a17" stroke-width="2.5"/>';
}
function ticketCardLand(tk,cls,badge){
  const M=MAP.meta||{},VB=M.tk_vb||{},VW=VB.w||959,VH=VB.h||621;
  const TT=M.tk_titel||{},tfs=TT.font||40,tfarbe=TT.farbe||'#3a5a1e';
  const pos=n=>(TPOSL[n]||[]).map(q=>q.length>2?[q[2]/100*VW,q[3]/100*VH]:[q[0]/100*VW,q[1]/100*VH]);
  const mitte=a=>[a.reduce((p,q)=>p+q[0],0)/a.length,a.reduce((p,q)=>p+q[1],0)/a.length];
  const A0=pos(tk.von);
  const start=A0.length?(A0.length>1?mitte(A0):A0[0]):[VW/2,VH/2];
  const vonLand=!!LANDFLAGGE[tk.von];
  const CX=VW/2,CY=VH*0.55,R2=36;
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  let svg='';
  const ziele=tkZiele(tk).map(z=>{
    const pz=pos(z.nach);let p=pz.length?mitte(pz):[CX,CY];
    const dx=p[0]-CX,dy=p[1]-CY,L=Math.hypot(dx,dy)||1;
    p=[clamp(p[0]+dx/L*26,R2+8,VW-R2-8),clamp(p[1]+dy/L*26,R2+64,VH-R2-8)];
    return {nach:z.nach,punkte:z.punkte,p};
  });
  ziele.forEach(z=>{
    const dx=z.p[0]-start[0],dy=z.p[1]-start[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux;
    const a0=[start[0]+ux*(vonLand?30:14),start[1]+uy*(vonLand?30:14)];
    const tip=[z.p[0]-ux*(R2+4),z.p[1]-uy*(R2+4)];
    const bas=[tip[0]-ux*30,tip[1]-uy*30];
    const sh=7,hw=17;
    const pts=[[a0[0]+px*sh,a0[1]+py*sh],[bas[0]+px*sh,bas[1]+py*sh],[bas[0]+px*hw,bas[1]+py*hw],tip,
      [bas[0]-px*hw,bas[1]-py*hw],[bas[0]-px*sh,bas[1]-py*sh],[a0[0]-px*sh,a0[1]-py*sh]]
      .map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    svg+='<polygon points="'+pts+'" fill="#f6efdc" stroke="#8a6a30" stroke-width="3"/>';
  });
  if(vonLand)svg+=flagKreis(tk.von,start[0],start[1],30);
  else svg+='<circle cx="'+start[0]+'" cy="'+start[1]+'" r="13" fill="#2f5d1f" stroke="#f6efdc" stroke-width="4"/><circle cx="'+start[0]+'" cy="'+start[1]+'" r="4.5" fill="#f6efdc"/>';
  ziele.forEach(z=>{
    const cx=z.p[0],cy=z.p[1];
    svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R2+'" fill="#f2e8cf" stroke="#7a5a20" stroke-width="4"/>'
       +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(R2-7)+'" fill="none" stroke="#c9b98a" stroke-width="1.5"/>'
       +'<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="40" fill="#7a1a1a">'+z.punkte+'</text>';
    const fdx=cx-CX,fdy=cy-CY,fl=Math.hypot(fdx,fdy)||1;
    const fx=clamp(cx+fdx/fl*(R2+3),13,VW-13),fy=clamp(cy+fdy/fl*(R2+3),13,VH-13);
    svg+=flagKreis(z.nach,fx,fy,13);
  });
  const F='font-family="Arial,sans-serif" font-weight="900"';
  const titel='<text x="'+(VW/2)+'" y="'+(TT.y1||52)+'" text-anchor="middle" font-size="'+tfs+'" '+F+' fill="'+tfarbe+'" text-decoration="underline">'+tk.von+'</text>';
  return '<div class="tcard '+(cls||'')+'"><svg viewBox="0 0 '+VW+' '+VH+'" preserveAspectRatio="none">'+titel+svg+'</svg>'+(badge?'<div class="tcheck">✓</div>':'')+'</div>';
}
function ticketCard(tk,cls,badge){
  if(tkRoute(tk))return ticketCardRoute(tk,cls,badge);
  if(tkLand(tk))return ticketCardLand(tk,cls,badge);
  const M=MAP.meta||{},TK=M.tk||{},VB=M.tk_vb||{};
  const VW=VB.w||991,VH=VB.h||621,HOCH=!!M.tk_hoch;
  const MX0=TK.mx0||25,MY0=TK.my0||77,MW=TK.mw||933,MH=TK.mh||509,CX=MX0+MW/2,CY=MY0+MH/2;
  const pts=n=>TPOSL[n].map(q=>q.length>2?[q[2]/100*VW,q[3]/100*VH]:[MX0+q[0]/100*MW, MY0+q[1]/100*MH]);
  let A=pts(tk.von),B=pts(tk.nach);
  // Mehrfach-Einmündungen (z.B. Nachbarländer) auf ein Ziel reduzieren:
  // es bleibt die Einmündung, die dem anderen Auftragsende am nächsten liegt.
  if(M.tk_einzelziel&&(A.length>1||B.length>1)){
    const mit=a=>[a.reduce((s,p)=>s+p[0],0)/a.length,a.reduce((s,p)=>s+p[1],0)/a.length];
    const nah=(a,t)=>a.length<2?a:[a.reduce((b,p)=>Math.hypot(p[0]-t[0],p[1]-t[1])<Math.hypot(b[0]-t[0],b[1]-t[1])?p:b)];
    const ca=mit(A),cb=mit(B);A=nah(A,cb);B=nah(B,ca);
  }
  const r1=ROTE_ORTE.has(tk.von),r2=ROTE_ORTE.has(tk.nach);
  const au1=AUSSEN_ORTE.has(tk.von),au2=AUSSEN_ORTE.has(tk.nach);
  const CH=(M.tk_stil==='schweiz');
  const lc=CH?'#d9930f':(r1&&r2?'#cc0000':(r1||r2?'#e88a00':'#111'));
  let svg='';
  A.forEach(a=>B.forEach(b=>{svg+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+lc+'" stroke-width="9"/>'}));
  const mark=(p,rot,aussen)=>{
    const f=rot?'#cc0000':'#111', s=rot?'#111':'#cc0000';
    if(CH&&!aussen){let sp='';for(let k=0;k<8;k++){const a=Math.PI/4*k+Math.PI/8,c1=Math.cos(a),s1=Math.sin(a);
        sp+='<line x1="'+(p[0]+c1*16).toFixed(1)+'" y1="'+(p[1]+s1*16).toFixed(1)+'" x2="'+(p[0]+c1*23).toFixed(1)+'" y2="'+(p[1]+s1*23).toFixed(1)+'" stroke="#a02818" stroke-width="4"/>'}
      return sp+'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="16" fill="#f6ead0" stroke="#a02818" stroke-width="5"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="#5a2a10"/>';}
    if(!aussen)return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="15" fill="'+f+'" stroke="'+s+'" stroke-width="5"/>';
    const dx=p[0]-CX,dy=p[1]-CY,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;
    const tip=[p[0]+ux*34,p[1]+uy*34],b1=[p[0]-ux*4+px*17,p[1]-uy*4+py*17],b2=[p[0]-ux*4-px*17,p[1]-uy*4-py*17];
    return '<polygon points="'+tip+' '+b1+' '+b2+'" fill="'+f+'" stroke="'+s+'" stroke-width="4"/>';
  };
  A.forEach(p=>svg+=mark(p,r1,au1));
  B.forEach(p=>svg+=mark(p,r2,au2));
  const name=(n,rot)=>'<tspan fill="'+(rot?'#cc0000':(TT.farbe||'#111'))+'">'+n+'</tspan>';
  const F='font-family="Arial,sans-serif" font-weight="900"';
  const TT=M.tk_titel||{},TP=M.tk_punkte||{};
  const ty1=TT.y1||62,ty2=TT.y2||114,tfs=TT.font||40;
  const titel=HOCH
    ? '<text x="'+(VW/2)+'" y="'+ty1+'" text-anchor="middle" font-size="'+tfs+'" '+F+' text-decoration="underline">'+name(tk.von,r1)+'</text>'
      +'<text x="'+(VW/2)+'" y="'+ty2+'" text-anchor="middle" font-size="'+tfs+'" '+F+' text-decoration="underline">'+name(tk.nach,r2)+'</text>'
    : '<text x="'+(VW/2)+'" y="56" text-anchor="middle" font-size="46" '+F+' text-decoration="underline">'
      +name(tk.von,r1)+'<tspan fill="#111"> - </tspan>'+name(tk.nach,r2)+'</text>';
  const langX=HOCH?128:70, langY=HOCH?1082:576, langS=HOCH?30:34;
  const pktX=TP.x||(HOCH?572:920), pktY=TP.y||(HOCH?1085:576), pktF=TP.font||48;
  return '<div class="tcard '+(cls||'')+(tk.lang?' lang':'')+'">'
    +'<svg viewBox="0 0 '+VW+' '+VH+'" preserveAspectRatio="none">'
    +titel
    +svg
    +(tk.lang?'<text x="'+langX+'" y="'+langY+'" font-size="'+langS+'" '+F+' fill="#1d4ed8">LANGE STRECKE</text>':'')
    +'<text x="'+pktX+'" y="'+pktY+'" text-anchor="middle" font-size="'+pktF+'" '+F+' fill="'+(TP.farbe||'#cc0000')+'">'+tk.punkte+'</text>'
    +'</svg>'+(badge?'<div class="tcheck">✓</div>':'')+'</div>';
}

function ticketModal(offer,minKeep,done,check,hint){
  const sel=new Set();

  const anzOk=schonOk.filter(Boolean).length;
  const m=modal('<h2>Aufträge wählen</h2><p style="font-size:13px;margin-bottom:8px">'+(hint||('Mindestens '+minKeep+' behalten.'))
    +(anzOk?' <b style="color:#3e7d32">'+anzOk+' davon '+(anzOk===1?'ist':'sind')+' bereits erfüllt!</b>':'')+'</p>'
    +'<button class="cancel" id="tPeek" style="margin:0 0 10px">👁 Spielbrett ansehen</button>'
    +'<div id="toff"></div><button class="go" id="tGo" disabled>Behalten</button>');

    else{go.disabled=sel.size<minKeep;go.textContent='Behalten ('+sel.size+')'}};

let RAND={};MAP.knoten.forEach(k=>{if(k.rand)RAND[k.id]=k.stadt||k.id});
// ---------- Länderaufträge (Schweiz): Erfüllung über beliebiges Ziel, Wertung höchstes erreichtes, sonst Abzug des niedrigsten ----------
function tkLand(t){return !!t&&t.typ==='land'}
function tkZiele(t){return t.ziele||[]}
function tkMinP(t){return tkRoute(t)?t.minus:(tkLand(t)?Math.min(...tkZiele(t).map(z=>z.punkte)):t.punkte)}
function tkErfuellt(pi,t){if(tkRoute(t))return wrRouteStatus(pi,t)!==null;if(!tkLand(t))return connected(pi,t);return tkZiele(t).some(z=>connected(pi,{von:t.von,nach:z.nach}))}
function tkWert(pi,t){if(tkRoute(t)){const st=wrRouteStatus(pi,t);return st==='ordnung'?t.punkte:(st==='netz'?t.punkte_ungeordnet:-t.minus)}
  if(!tkLand(t))return connected(pi,t)?t.punkte:-t.punkte;
  let best=null;tkZiele(t).forEach(z=>{if((best===null||z.punkte>best)&&connected(pi,{von:t.von,nach:z.nach}))best=z.punkte});
  return best===null?-tkMinP(t):best}
function tkBestZiel(pi,t){let best=null;tkZiele(t).forEach(z=>{if((!best||z.punkte>best.punkte)&&connected(pi,{von:t.von,nach:z.nach}))best=z});return best}
function tkGleich(a,b){if(tkRoute(a)!==tkRoute(b))return false;if(tkRoute(a))return JSON.stringify(a.stationen)===JSON.stringify(b.stationen);if(tkLand(a)!==tkLand(b))return false;if(!tkLand(a))return a.von===b.von&&a.nach===b.nach&&a.punkte===b.punkte;return a.von===b.von&&JSON.stringify(tkZiele(a))===JSON.stringify(tkZiele(b))}
function connected(pi,t){
  // Außenstädte sind Sackgassen: Strecken führen hinein, aber nicht hindurch
  const par={};const find=x=>par[x]===x?x:par[x]=find(par[x]);
  MAP.knoten.forEach(k=>{if(!RAND[k.id])par[k.id]=k.id});
  const uni=(a,b)=>{par[find(a)]=find(b)};
  // Tor-Staedte (z.B. Tokyo/Kokura in Japan) sind dieselbe Stadt auf zwei Kartenteilen
  (MAP.meta.verbunden||[]).forEach(v=>{if(par[v[0]]!==undefined&&par[v[1]]!==undefined)uni(v[0],v[1])});
  const bx=BHX[pi];
  const nutzbar=s=>g().claims[s.nr]===pi||g().claims[s.nr]==='X'||(bx&&bx.has(s.nr));
  MAP.strecken.forEach(s=>{if(!nutzbar(s))return;
    if(!RAND[s.von]&&!RAND[s.nach])uni(s.von,s.nach)});
  // Strecken zwischen zwei Randknoten (z.B. Madagaskar) sind durchfahrbar:
  // wer sie besitzt, verbindet damit auch die Netze an beiden Randknoten.
  const rpar={},rfind=x=>rpar[x]===x?x:rpar[x]=rfind(rpar[x]);
  MAP.knoten.forEach(k=>{if(RAND[k.id])rpar[k.id]=k.id});
  let durchfahrt=false;
  MAP.strecken.forEach(s=>{if(!nutzbar(s))return;
    if(RAND[s.von]&&RAND[s.nach]&&rfind(s.von)!==rfind(s.nach)){rpar[rfind(s.von)]=rfind(s.nach);durchfahrt=true}});
  if(durchfahrt){
    const anz={},anschluss={};
    MAP.knoten.forEach(k=>{if(RAND[k.id]){const r=rfind(k.id);anz[r]=(anz[r]||0)+1}});
    MAP.strecken.forEach(s=>{if(!nutzbar(s))return;
      const r=RAND[s.von]?s.von:(RAND[s.nach]?s.nach:null);if(!r)return;
      const o=RAND[s.von]?s.nach:s.von;if(RAND[o])return;
      const k=rfind(r);(anschluss[k]=anschluss[k]||[]).push(o)});
    Object.keys(anschluss).forEach(k=>{if(anz[k]>1)anschluss[k].forEach((o,i)=>{if(i)uni(anschluss[k][0],o)})});
  }
  const touches={};
  MAP.strecken.forEach(s=>{if(!nutzbar(s))return;
    if(RAND[s.von]&&!RAND[s.nach])(touches[RAND[s.von]]=touches[RAND[s.von]]||new Set()).add(find(s.nach));
    if(RAND[s.nach]&&!RAND[s.von])(touches[RAND[s.nach]]=touches[RAND[s.nach]]||new Set()).add(find(s.von))});
  const A=nameToIds[t.von]||[],B=nameToIds[t.nach]||[];
  const cityOf=ids=>{for(const i of ids)if(RAND[i])return RAND[i];return null};
  const ca=cityOf(A),cb=cityOf(B);
  if(!ca&&!cb)return A.some(a=>B.some(b=>find(a)===find(b)));
  if(ca&&!cb)return !!touches[ca]&&touches[ca].has(find(B[0]));
  if(!ca&&cb)return !!touches[cb]&&touches[cb].has(find(A[0]));
  if(!touches[ca]||!touches[cb])return false;
  for(const r of touches[ca])if(touches[cb].has(r))return true;
  return false;
}
function laengsteFor(pi){
  const adj={};MAP.strecken.forEach(s=>{if(g().claims[s.nr]!==pi)return;
    const a=RAND[s.von]?s.von+'#'+s.nr:s.von,b=RAND[s.nach]?s.nach+'#'+s.nr:s.nach;
    (adj[a]=adj[a]||[]).push({to:b,len:s.laenge,nr:s.nr});(adj[b]=adj[b]||[]).push({to:a,len:s.laenge,nr:s.nr})});
  let best=0;const used=new Set();
  function dfs(v,acc){if(acc>best)best=acc;for(const e of (adj[v]||[])){if(used.has(e.nr))continue;
    used.add(e.nr);dfs(e.to,acc+e.len);used.delete(e.nr)}}
  for(const v in adj)dfs(v,0);return best;
}
// Mandala (Indien, "Grosse Indientour"): prueft, ob die beiden Auftragsstaedte durch
// mindestens zwei streckendisjunkte eigene Wege verbunden sind (Wege duerfen sich kreuzen,
// aber keine gemeinsamen Waggons benutzen). Umsetzung als Einheitskapazitaets-Maxflow:
// jede eigene Strecke = ungerichtete Kante mit Kapazitaet 1, gesucht ist Fluss >= 2.
function tkDoppeltVerbunden(pi,t){
  const cap={};
  const arc=(u,v,c)=>{(cap[u]=cap[u]||{})[v]=(cap[u][v]||0)+c;(cap[v]=cap[v]||{})[u]=cap[v][u]||0};
  let any=false;
  MAP.strecken.forEach(s=>{if(g().claims[s.nr]!==pi)return;any=true;arc(s.von,s.nach,1);arc(s.nach,s.von,1)});
  if(!any)return false;
  const A=nameToIds[t.von]||[],B=nameToIds[t.nach]||[];
  if(!A.length||!B.length)return false;
  const S='__mq',T='__mz';
  A.forEach(a=>arc(S,a,2));B.forEach(b=>arc(b,T,2));
  let flow=0;
  for(let it=0;it<2;it++){
    const prev={};prev[S]=S;const q=[S];
    while(q.length){const u=q.shift();
      for(const v in (cap[u]||{}))if(cap[u][v]>0&&prev[v]===undefined){prev[v]=u;q.push(v)}}
    if(prev[T]===undefined)break;
    let v=T;while(v!==S){const u=prev[v];cap[u][v]--;cap[v][u]=(cap[v][u]||0)+1;v=u}
    flow++;
  }
  return flow>=2;
}
function mandalaBonus(anz){
  const man=MAP.meta&&MAP.meta.mandala,tab=(man&&man.tabelle)||{};
  if(!anz)return 0;
  const stufen=Object.keys(tab).map(Number).sort((a,b)=>a-b);
  if(!stufen.length)return 0;
  const k=Math.min(anz,stufen[stufen.length-1]);
  return tab[String(k)]||0;
}
function finalScore(){
  ROOM.players.forEach((p,i)=>bhWahlBerechnen(i));
  const bhP=(bhRegel().punkte_pro_ungebautem)||0;
  const bhN=bhAnzahl();
  const bonus=R().laengste_strecke_bonus||0;
  const lang=bonus?ROOM.players.map((p,i)=>laengsteFor(i)):null;
  const maxL=lang?Math.max(...lang):0;
  const abon=R().meiste_auftraege_bonus||0;
  const cnts=abon?ROOM.players.map((p,i)=>p.tickets.filter(t=>tkErfuellt(i,t)).length):null;
  const maxC=cnts?Math.max(...cnts):0;
  const man=MAP.meta&&MAP.meta.mandala;
  const mand=man?ROOM.players.map((p,i)=>p.tickets.filter(t=>tkDoppeltVerbunden(i,t)).length):null;
  const regs=(MAP.meta&&MAP.meta.regionen)?ROOM.players.map((p,i)=>regionenWertung(i)):null;
  const eb=EXPM()?expressBonus(ROOM.players.map(p=>p.exp||0),EXPM()):null;
  const hw=WR()?ROOM.players.map((p,i)=>wrHafenWertung(i)):null;
  ROOM.players.forEach((p,i)=>{
    let tP=0,tM=0;p.tickets.forEach(t=>{const w=tkWert(i,t);if(w>=0)tP+=w;else tM+=-w});
    const lb=(lang&&lang[i]===maxL&&maxL>0)?bonus:0;
    const ab=(cnts&&cnts[i]===maxC&&maxC>0)?abon:0;
    const mb=mand?mandalaBonus(mand[i]):0;
    const bhRest=bhN?Math.max(0,bhN-((p.bahnhoefe||[]).length)):0;
    const bhb=bhN?bhRest*bhP:0;
    const rb=regs?regs[i].summe:0;
    const exb=eb?eb[i]:0;
    p.res={strecken:p.score,plus:tP,minus:tM};
    if(regs){p.res.regionen=regs[i].netze.map(n=>n.anz);p.res.rbonus=rb}
    if(eb){p.res.exp=p.exp||0;p.res.ebonus=exb}
    if(lang){p.res.laengste=lang[i];p.res.bonus=lb}
    if(cnts){p.res.auftr=cnts[i];p.res.abonus=ab}
    if(mand){p.res.mandala=mand[i];p.res.mbonus=mb}
    if(bhN){p.res.bhRest=bhRest;p.res.bhbonus=bhb}
    const fb=IB()?festBonus(p):0;if(IB()){p.res.fest=Object.assign({},p.fest||{});p.res.fbonus=fb}
    let hb=0;if(hw){const hRest=Math.max(0,wrHafenMax()-hw[i].length),hm=hRest*(wrHafM().minus_pro_ungebautem||4);hb=hw[i].reduce((a,x)=>a+x.pkt,0)-hm;p.res.haefen=hw[i];p.res.hRest=hRest;p.res.hminus=hm;p.res.hbonus=hb}
    p.total=p.score+tP-tM+lb+ab+mb+bhb+rb+exb+hb+fb;
  });
}
function statsSchreiben(){

}

function sdBauen(mode){

  const n=ROOM.players.length;
  const start=ROOM.players.map((p,i)=>i).sort((a,b)=>{
    const ra=ROOM.players[a].res||{},rb=ROOM.players[b].res||{};
    return ((rb.auftr||0)-(ra.auftr||0))||((ROOM.players[a].total||0)-(ROOM.players[b].total||0))||(a-b)})[0];
  const ring=ROOM.players.map((_,k)=>(start+k)%n);

  ROOM.players.forEach((p,i)=>{const r=p.res||{};
    if(r.bonus)ev.push({t:'bonus',pi:i,pts:r.bonus,txt:'Längste zusammenhängende Strecke ('+r.laengste+' Waggons)'})});
  ROOM.players.forEach((p,i)=>{const r=p.res||{};
    if(r.bhbonus)ev.push({t:'bonus',pi:i,pts:r.bhbonus,txt:r.bhRest+' nicht gebaute Bahnhöfe'})});
  ROOM.players.forEach((p,i)=>{const r=p.res||{};
    if(r.abonus)ev.push({t:'bonus',pi:i,pts:r.abonus,txt:'Meiste erfüllte Aufträge ('+r.auftr+')'})});
  ROOM.players.forEach((p,i)=>{const r=p.res||{};
    if(r.mbonus)ev.push({t:'bonus',pi:i,pts:r.mbonus,txt:'Mandala – Große Indientour ('+r.mandala+' doppelt verbundene Aufträge)'})});
  ROOM.players.forEach((p,i)=>{const r=p.res||{};
    if(r.rbonus)ev.push({t:'bonus',pi:i,pts:r.rbonus,txt:'Regionenbonus ('+r.regionen.join(' + ')+' Regionen)'})});
  ROOM.players.forEach((p,i)=>{const r=p.res||{};
    if(r.exp!==undefined)ev.push({t:'bonus',pi:i,pts:r.ebonus||0,txt:'Express-Bonus (Entwicklungsleiste '+r.exp+')'})});
  ROOM.players.forEach((p,i)=>{const r=p.res||{};
    if(r.fest!==undefined)ev.push({t:'bonus',pi:i,pts:r.fbonus||0,txt:'Festivalkarten ('+Object.keys(r.fest).map(k=>festName(k)+' '+r.fest[k]).join(', ')+')'})});

function zufallsReihenfolge(){
  const n=ROOM.players.length,G=g();
  const perm=shuffle(ROOM.players.map((p,i)=>i));   // perm[neu]=alt
  ROOM.players=perm.map(i=>ROOM.players[i]);
  const so={},pk={};
  perm.forEach((alt,neu)=>{if(G.startOffers&&G.startOffers[alt]!==undefined)so[neu]=G.startOffers[alt];
    if(G.picked&&G.picked[alt]!==undefined)pk[neu]=G.picked[alt]});
  G.startOffers=so;G.picked=pk;
  G.rps=null;G.turn=0;ROOM.status='picking';
  G.notice='🎲 Reihenfolge ausgelost: '+ROOM.players.map(p=>p.name).join(' → ')+'. '+ROOM.players[0].name+' beginnt!';
  meinenSitzFinden();

function meinenSitzFinden(){
  if(!ROOM||!ROOM.players||!p0Name)return;
  const p=ROOM.players[SEAT];
  if(p&&p.name&&p.name.toLowerCase()===p0Name.toLowerCase())return;

// Sicherheitsnetz: stimmt der Sitz nicht mit dem eigenen Namen ueberein, keine Aktion
// auf fremden Spielerdaten ausfuehren.
function sitzOk(){
  if(!p0Name)return true;
  meinenSitzFinden();
  const p=ROOM&&ROOM.players&&ROOM.players[SEAT];
  return !!(p&&p.name&&p.name.toLowerCase()===p0Name.toLowerCase());

let p0Name='';
// Startauswahl-Racefix: waehrend 'picking' waehlen alle Spieler GLEICHZEITIG ihre
// Auftraege. Ein komplettes sync() ueberschreibt dabei die players- und game-Knoten
// mit dem lokalen Stand des Schreibers – wer als Letzter bestaetigt, loescht damit die
// Auswahl der Schnelleren (deren picked-Flag und Tickets), die dann beim Wiedereinstieg
// erneut waehlen muessen. Deshalb schreibt die Startauswahl nur noch die EIGENEN Knoten
// (players/<seat>, game/picked/<seat>, game/startOffers/<seat>) und ergaenzt die
// gemeinsamen Ticketstapel per Firebase-Transaktion.
function startPickCommit(zk,zl){
  if(!sitzOk()){toast('Sitzplatz konnte nicht zugeordnet werden – bitte Seite neu laden.');return}
  const G=g();
  G.picked[SEAT]=true;delete G.startOffers[SEAT];
  zk.forEach(t=>G.ticketDeck.push(t));
  if(zl.length){G.ticketDeckLang=G.ticketDeckLang||[];zl.forEach(t=>G.ticketDeckLang.push(t))}
  const ops=[
    roomRef.child('players/'+SEAT).set(JSON.parse(JSON.stringify(me()))),
    roomRef.child('game/picked/'+SEAT).set(true),
    roomRef.child('game/startOffers/'+SEAT).set(null)
  ];
  if(zk.length)ops.push(roomRef.child('game/ticketDeck').transaction(d=>(d||[]).concat(zk)));
  if(zl.length)ops.push(roomRef.child('game/ticketDeckLang').transaction(d=>(d||[]).concat(zl)));
  Promise.all(ops).then(pickFertigPruefen).catch(()=>{});
  pickFertigPruefen();
}
// Sobald alle gewaehlt haben, darf jeder den Status umschalten (idempotent).
function pickFertigPruefen(){
  if(!ROOM||ROOM.status!=='picking'||!g())return;
  if(ROOM.players.every((p,i)=>g().picked[i])){
    if(IB()&&g().draft){const u={status:'playing','game/draft':null};if(g().draft.nr===2){u['game/draft2Done']=true;u['game/frist']=limitMs()?Date.now()+limitMs():0}roomRef.update(u)}
    else roomRef.child('status').set('playing')}
}

function makeCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];return c}
async function createRoom(name,pin){
  if(!await nameErlaubt(name)){toast('Der Name "'+name+'" ist für dieses Spiel nicht freigegeben.');return}
  CODE=makeCode();SEAT=0;MYPIN=pin;p0Name=name;
  const ph=pin?await hashPin(pin,CODE):'';
  ROOM={status:'lobby',edition:EDITION,players:[{name,col:PCOL[0].id,wagons:WAGONS(),hand:{},tickets:[],score:0,pin:ph}]};
  roomRef=db.ref('rooms/'+CODE);
  roomRef.set(ROOM).then(()=>{listen()}).catch(e=>toast('Verbindung fehlgeschlagen: '+e.message));
}
function joinRoom(code,name,pin){
  code=code.toUpperCase().trim();
  const ref=db.ref('rooms/'+code);
  ref.get().then(async snap=>{
    const v=fix(snap.val());
    if(!v){toast('Raum '+code+' nicht gefunden.');return}
    const i=v.players.findIndex(p=>p.name.toLowerCase()===name.toLowerCase());
    const ph=pin?await hashPin(pin,code):'';
    if(i>=0){
      if(v.players[i].pin&&v.players[i].pin!==ph){toast('Falscher PIN für '+v.players[i].name+'.');return}
      CODE=code;SEAT=i;ROOM=v;roomRef=ref;MYPIN=pin;p0Name=name;pickShown=false;draftKeepFertig=0;draftKey='';
      sdReset();erfuellt=new Set();erfuelltInit=false;   // erledigte Aufträge beim Wiedereinstieg nicht erneut anzeigen
      if(!v.players[i].pin&&ph){v.players[i].pin=ph;ref.update({players:v.players})}
      toast('Willkommen zurück, '+v.players[i].name+'!');listen();return;
    }
    if(v.status!=='lobby'){toast('Das Spiel läuft schon. Zum Wiedereinstieg denselben Namen und PIN eingeben.');return}
    if(v.players.length>=5){toast('Der Raum ist voll (5 Spieler).');return}
    if(!await nameErlaubt(name)){toast('Der Name "'+name+'" ist für dieses Spiel nicht freigegeben.');return}
    CODE=code;SEAT=v.players.length;ROOM=v;roomRef=ref;MYPIN=pin;p0Name=name;
    const frei=PCOL.find(c=>!ROOM.players.some(p=>p.col===c.id));ROOM.players.push({name,col:frei.id,wagons:WAGONS(),hand:{},tickets:[],score:0,pin:ph});
    roomRef.set(ROOM).then(()=>listen());
  }).catch(e=>toast('Verbindung fehlgeschlagen: '+e.message));
}

function arrOf(v){return Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[])}
function zeigeRangliste(){

    const ergObj=s2.val()||{}, erg=Object.values(ergObj);

    erg.forEach(e=>{e.spieler=arrOf(e.spieler).filter(x=>x!=null);e.punkte=arrOf(e.punkte)});
    if(!erg.length){toast('Noch keine beendeten Spiele in der Wertung.');return}
    const namen=[...new Set([].concat(...erg.map(e=>e.spieler||[])))].sort();

      +'<select id="fSp" style="'+selCss+'"><option value="">Alle Spieler</option>'+namen.map(n=>'<option>'+n+'</option>').join('')+'</select>'
      +'<select id="fZt" style="'+selCss+'"><option value="0">Gesamter Zeitraum</option><option value="30">Letzte 30 Tage</option><option value="90">Letzte 3 Monate</option><option value="365">Letzte 12 Monate</option></select></div>'
      +'<div class="tabs"><button id="rb1" class="on">Gesamt</button><button id="rb2">Duelle</button><button id="rb3">Spiele</button></div><div id="rbox"></div><button class="go" id="cl">Schließen</button>');

      if(e.custom||e.test)return false;

      if(+fZt.value&&(e.ts||0)<Date.now()-(+fZt.value)*86400000)return false;
      return true}
    const zeile=(i,n,rechts)=>'<div class="score-row"><span><b>'+i+'.</b> '+n+'</span><span style="font-size:13px">'+rechts+'</span></div>';
    function gesamt(){
      const rel=erg.filter(passt),tab={};
      rel.forEach(e=>{(e.spieler||[]).forEach((n,i)=>{
        const k=n.toLowerCase();tab[k]=tab[k]||{name:n,siege:0,spiele:0,punkte:0};
        tab[k].spiele++;tab[k].punkte+=(e.punkte&&e.punkte[i])||0;

        +a.map((p,i)=>zeile(i+1,p.name,p.siege+' Siege · '+p.spiele+' Spiele · \u00f8 '+(p.spiele?Math.round(p.punkte/p.spiele):0)+' Pkt.')).join('');
