<!DOCTYPE html>
<html lang="de">
<head>

<title>Zug um Zug Langenberg – Online</title>

<style>
:root{--tkbild:url('auftrag.jpg');--frame:#5a4632;--board:#dde8c0;--board2:#eef2d8;--brass:#b08d3e;--card:#faf7ee;--ink:#2b2419}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,sans-serif;background:var(--frame);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
h1,h2,.serif{font-family:Georgia,serif;font-weight:normal}
#top{display:flex;align-items:center;gap:8px;padding:5px 8px;color:#f0e6d2;font-size:14px}
#chips{display:flex;gap:5px;overflow-x:auto;flex:1}
.pchip{display:flex;align-items:stretch;border-radius:6px;overflow:hidden;border:2px solid #00000055;background:#e8e0cc;flex-shrink:0;box-shadow:0 1px 3px #0004}
.pchip.aktiv{border-color:#ffd970;box-shadow:0 0 0 2px #ffd97088}
.pchip .ini{display:flex;align-items:center;padding:0 6px;font-weight:800;font-size:13px;color:#fff}
.pchip .sc{display:flex;align-items:center;padding:0 7px;font-size:19px;font-weight:800;color:#fff;font-family:Georgia,serif}
.pchip .wg{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 5px;background:#2b2419;color:#f0e6d2;font-size:12px;font-weight:700;line-height:1}
.pchip .wg small{font-size:8px;opacity:.8}
.pchip .wg2{display:flex;align-items:center;gap:2px;padding:0 5px;background:#3d3225;color:#f0e6d2;font-size:11px;font-weight:700}
.pchip .wg2 small{font-size:9px;opacity:.85;margin-right:3px}
.pchip .wg2 b{font-weight:700}
#top .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
#top b{font-size:21px;font-weight:800;letter-spacing:.01em}
#top .stat{background:rgba(255,255,255,.12);padding:3px 9px;border-radius:999px}
#roomtag{margin-left:auto;opacity:.9;letter-spacing:.1em}
#stage{flex:1;position:relative;background:radial-gradient(ellipse at 50% 40%,var(--board2),var(--board) 70%);touch-action:none;overflow:hidden;border-top:3px solid var(--brass);border-bottom:3px solid var(--brass)}
svg{position:absolute;inset:0;width:100%;height:100%}
.seg{fill:#fff;fill-opacity:0;stroke:none;pointer-events:all;cursor:pointer}
.wagon{pointer-events:none;filter:url(#w3d)}
.glowdot{pointer-events:none}
.nodeC{fill:#cfc8ba;stroke:#5a4632;stroke-width:2}
.nodeL{font-size:11.5px;font-weight:600;fill:#2b2419;paint-order:stroke;stroke:#f2f0e4;stroke-width:3px;pointer-events:none}
.rand .nodeL{font-family:Georgia,serif;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.wm{font-family:Georgia,serif;fill:#c9a35e;opacity:.3;letter-spacing:.35em;pointer-events:none}
#zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:38px;height:38px;border-radius:8px;border:1px solid var(--frame);background:var(--card);font-size:20px}
#bottom{background:var(--card);border-top:3px solid var(--brass);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#open{position:absolute;right:4px;top:4px;bottom:4px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:3px;z-index:6;pointer-events:none}
#open>*{pointer-events:all}
#open .pcard{width:min(17vw,74px);height:calc(min(17vw,74px)*0.652)}
#deckWrap{position:relative;margin-top:6px}
#deckWrap .cnt{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:#2b2419dd;color:#f0e6d2;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;white-space:nowrap}
#ablage{margin-top:4px;text-align:center;font-size:10px;color:#2b2419;background:#faf7eee6;border:1px solid #b08d3e;border-radius:6px;padding:3px 7px;line-height:1.2}
.pcard{width:74px;height:48px;border-radius:5px;border:1px solid #00000025;background-image:url('kartensatz.jpg');background-size:500% 200%;background-repeat:no-repeat;flex-shrink:0;position:relative;cursor:pointer;box-shadow:0 1px 3px #0003}
.pc-lok{background-position:0% 0%}.pc-rot{background-position:25% 0%}.pc-gruen{background-position:50% 0%}.pc-gelb{background-position:75% 0%}.pc-orange{background-position:100% 0%}
.pc-schwarz{background-position:0% 100%}.pc-weiss{background-position:25% 100%}.pc-pink{background-position:50% 100%}.pc-blau{background-position:75% 100%}.pc-rueck{background-position:100% 100%}
.pcard.sm{width:60px;height:39px}
.pcard.hoch{width:52px;height:79px;background-image:none;overflow:hidden}
.pcard.hoch i{position:absolute;left:50%;top:50%;width:79px;height:52px;display:block;
  transform:translate(-50%,-50%) rotate(90deg);background-image:url('kartensatz.jpg');background-size:500% 200%;background-repeat:no-repeat}
.pcard .n{position:absolute;bottom:1px;right:3px;font-size:12px;font-weight:700;color:#fff;background:#000000aa;border-radius:8px;padding:0 5px}
#handbox{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
#hand{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;flex:1;min-height:82px;align-items:flex-start}
#actions{display:flex;gap:8px}
#actions button{flex:1;padding:11px 6px;border-radius:9px;border:1.5px solid var(--frame);background:#fff;font-size:14px;font-weight:600}
#actions button:disabled{opacity:.4}
#waitbar{font-size:13px;color:#8a7d63;text-align:center;padding:5px 0 3px}
#waitbar .dranTxt{font-size:19px;font-weight:800;letter-spacing:.02em}
#waitbar .zeitTxt{font-size:12px;color:#8a7d63}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:var(--card);border-radius:14px;border:3px solid var(--brass);padding:18px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto}
.box h2{font-size:20px;margin-bottom:12px}
.box .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.box button.opt{display:block;width:100%;text-align:left;padding:12px;border-radius:9px;border:1.5px solid var(--frame);background:#fff;font-size:14px;margin-bottom:8px}
.box button.opt.sel{background:#efe8d4;border-width:2.5px}
.box .go{width:100%;padding:13px;border-radius:9px;border:0;background:var(--frame);color:#f0e6d2;font-size:16px;font-weight:600;margin-top:6px}
.box .go:disabled{opacity:.4}
.box .cancel{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--frame);background:#fff;font-size:14px;margin-top:8px}
.ticket{border:1.5px solid var(--frame);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.ticket.sel{background:#efe8d4;border-width:2.5px}
.ticket .pts{font-family:Georgia,serif;font-size:19px}
.ticket.done{border-color:#3e7d32;background:#eef5ea}
.tcard{position:relative;width:100%;aspect-ratio:991/621;background:var(--tkbild);background-size:100% 100%;border-radius:10px;border:3px solid #00000025;margin-bottom:8px;cursor:pointer;overflow:hidden}
.tcard.sel{border-color:#b08d3e;box-shadow:0 0 0 2px #b08d3e}
.tcard.done{border-color:#3e7d32;box-shadow:0 0 0 2px #3e7d32}
.tcard svg{position:absolute;inset:0;width:100%;height:100%}
.tcheck{position:absolute;top:6px;right:8px;background:#3e7d32;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px;border-radius:8px;border:1.5px solid #5a4632;background:#fff;font-size:14px;font-weight:600}
.tabs button.on{background:#5a4632;color:#f0e6d2}
.fly{position:fixed;z-index:80;transition:transform .45s cubic-bezier(.2,.75,.3,1),opacity .45s;pointer-events:none;margin:0}
#chat{width:min(46vw,240px);flex-shrink:0;background:#faf7ee;border:2px solid #b08d3e;border-radius:10px;font-size:12px;overflow:hidden;align-self:stretch}
#chat h4{background:#5a4632;color:#f0e6d2;padding:5px 8px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;cursor:pointer}
#chatBody{padding:5px 7px;height:78px;overflow-y:auto}
#chatBody .last{color:#6b5322;padding:2px 0;line-height:1.35}
#chatBody .msg{padding:2px 0;line-height:1.35}
#chatBody .msg b{color:#2b2419}
#chatBody hr{border:0;border-top:1px solid #b08d3e55;margin:5px 0}
#chatIn{display:flex;gap:4px;padding:0 6px 6px}
#chatIn input{flex:1;padding:6px;border-radius:6px;border:1px solid #5a4632;font-size:13px;width:auto}
#chatIn button{padding:6px 9px;border-radius:6px;border:0;background:#5a4632;color:#f0e6d2;font-size:13px}
#chat.zu #chatBody,#chat.zu #chatIn{display:none}

/* ---- Querformat auf dem Handy: unteren Bereich flach halten ---- */
@media (orientation:landscape) and (max-height:560px){
  #top{padding:3px 6px;gap:5px}
  #top b{font-size:16px}
  .pchip .sc{font-size:15px;padding:0 5px}
  .pchip .ini,.pchip .wg,.pchip .wg2{font-size:10px;padding:0 4px}
  #bottom{padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
  #waitbar{padding:2px 0 0;font-size:11px}
  #handbox{margin-bottom:4px;gap:6px}
  #hand{min-height:0;gap:3px}
  .pcard{width:64px;height:42px}
  .pcard.hoch{width:40px;height:60px}
  .pcard.hoch i{width:60px;height:40px}
  #open .pcard{width:min(11vw,58px);height:calc(min(11vw,58px)*0.652)}
  #chat{width:min(38vw,210px)}
  #chatBody{height:44px;padding:3px 6px}
  #chatIn{padding:0 4px 4px}
  #chatIn input{padding:3px 5px;font-size:12px}
  #chat h4{padding:2px 7px;font-size:11px}
  #actions{gap:6px}
  #actions button{padding:7px 4px;font-size:12px}
  #waitbar .dranTxt{font-size:15px}
  #bottom{display:flex;flex-direction:column}
  #handbox{flex:0 1 auto;min-height:0}
  #zoom button{width:32px;height:32px;font-size:17px}
  .box{padding:12px;max-height:94vh}
  .box h2{font-size:17px;margin-bottom:8px}
  .tcard{max-width:270px;margin:0 auto 6px}
}
/* Sehr flache Bildschirme: Chat einklappen und Auslage schmaler */
@media (orientation:landscape) and (max-height:430px){
  #chatBody,#chatIn{display:none}
  #chat{width:auto;flex:0 0 auto}
  #waitbar{padding:1px 0 0}
  #waitbar .dranTxt{font-size:14px}
  #actions button{padding:6px 3px;font-size:11.5px}
  #open .pcard{width:min(9vw,48px);height:calc(min(9vw,48px)*0.652)}
  .pcard.hoch{width:34px;height:51px}
  .pcard.hoch i{width:51px;height:34px}
}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-weight:600;font-size:12px;border:1px solid #0003}
input[type=text]{padding:11px;border-radius:8px;border:1.5px solid var(--frame);font-size:16px;width:100%}
.reveal{display:flex;gap:8px;justify-content:center;margin:12px 0}
.score-row{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #00000015;font-size:14px}
.lob-p{display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:15px}
.codebig{font-family:Georgia,serif;font-size:34px;letter-spacing:.35em;text-align:center;margin:8px 0 2px;color:var(--frame)}
.hidden{display:none !important}
</style>
</head>

  if(s.doppel_mit){const p=MAP.strecken.find(x=>x.nr===s.doppel_mit);if(p){grp.push(p);seen.add(p.nr)}}
  conns.push(grp)})}
const routeEls={};let boardBuilt=false;
function pathPts(s){const pts=[P(s.von)];(s.via||[]).forEach(v=>pts.push({x:v[0]*10,y:v[1]*6.7}));pts.push(P(s.nach));return pts}
function layout(s,off){
  const pts=pathPts(s),L=[];let tot=0;
  for(let i=1;i<pts.length;i++){const dd=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);L.push(dd);tot+=dd}
  const pad=Math.min(15,tot*0.1),inner=tot-2*pad,n=s.laenge;
  const gap=Math.min(5,inner*.06/n+1.5),segL=(inner-gap*(n-1))/n,out=[];
  for(let i=0;i<n;i++){
    const target=pad+segL/2+i*(segL+gap);
    let acc=0,seg=0;while(seg<L.length-1&&acc+L[seg]<target)acc+=L[seg++];
    const a=pts[seg],b2=pts[seg+1],ux=(b2.x-a.x)/L[seg],uy=(b2.y-a.y)/L[seg];
    out.push({x:a.x+ux*(target-acc)-uy*off,y:a.y+uy*(target-acc)+ux*off,ang:Math.atan2(uy,ux)*180/Math.PI,segL})
  }
  return out;
}
function buildBoard(){
  if(boardBuilt)return;boardBuilt=true;
  world.appendChild(el('image',{href:MAP.meta.bild||'karte.jpg',x:0,y:0,width:1000,height:670,preserveAspectRatio:'none'}));
  world.appendChild(el('g',{id:'glowL'}));
  const pairCount={},pairIdx={};
  conns.forEach(g=>{const k=[g[0].von,g[0].nach].sort().join('|');pairCount[k]=(pairCount[k]||0)+1});
  conns.forEach(g2=>{
    const s0=g2[0];
    const pk=[s0.von,s0.nach].sort().join('|'),which=(pairIdx[pk]=(pairIdx[pk]||0)+1);
    const base=(pairCount[pk]>1)?(which===1?-8:8):0;
    g2.forEach((s,gi)=>{
      const grp=el('g',{class:'route'});
      if(s.felder&&s.felder.length===s.laenge){
        // Exakte Felder vom Original-Spielplan
        s.felder.forEach(f=>{
          const cx=f.x*10,cy=f.y*6.7,L=f.l*10*1.12,Wd=f.w*6.7*1.25; // Klickzone etwas größer
          const r=el('rect',{x:cx-L/2,y:cy-Wd/2,width:L,height:Wd,rx:3,class:'seg',
            transform:'rotate('+f.deg+' '+cx+' '+cy+')'});
          r.dataset.cx=cx;r.dataset.cy=cy;r.dataset.l=f.l*10;r.dataset.w=f.w*6.7;r.dataset.deg=f.deg;
          grp.appendChild(r);
        });
      } else {
        const off=base+(g2.length===2?(gi===0?-7:7):0),segW=13;
        layout(s,off).forEach(c=>{
          const r=el('rect',{x:c.x-c.segL/2,y:c.y-segW/2,width:c.segL,height:segW,rx:3,class:'seg',
            transform:'rotate('+c.ang+' '+c.x+' '+c.y+')'});
          r.dataset.cx=c.x;r.dataset.cy=c.y;r.dataset.l=c.segL;r.dataset.w=segW;r.dataset.deg=c.ang;
          grp.appendChild(r);
        });
      }
      grp.addEventListener('click',()=>tryClaim(s));
      world.appendChild(grp);routeEls[s.nr]=grp;
    })
  });
}

// ---------- Zuglogik (nur wer dran ist, verändert den Zustand) ----------
const g=()=>ROOM.game;
const me=()=>ROOM.players[SEAT];
const cur=()=>ROOM.players[g().turn];
const myTurn=()=>g()&&!g().over&&g().turn===SEAT&&ROOM.status==='playing';

function zugText(l){
  if(!l||!l.length)return null;
  const p=l.map(x=>x==='?'?'eine verdeckte Karte':(x==='lok'?'einen Joker':'eine '+CNAME[x]+'-Karte'));
  return 'zieht '+(p.length>1?p.slice(0,-1).join(', ')+' und '+p[p.length-1]:p[0]);
}
function endTurn(){
  const G=g();G.drawn=0;
  G.zuege=(G.zuege||0)+1;
  const zt=zugText(G.pend);
  if(zt){cur().last=zt;G.notice=cur().name+' '+zt}
  delete G.pend;
  if(ROOM.test){G.turn=0;sync();return}
  if(G.lastRounds<0&&cur().wagons<=2){G.lastRounds=ROOM.players.length;me().last='läutet die letzte Runde ein';G.notice=cur().name+' hat nur noch '+cur().wagons+' Wagons – letzte Runde! '+cur().name+' ist als Letzter noch einmal dran.'}
  else if(G.lastRounds>0){G.lastRounds--;if(G.lastRounds===0){G.over=true;ROOM.status='over';finalScore();sync();return}}
  G.turn=(G.turn+1)%ROOM.players.length;G.frist=ROOM.limitH?Date.now()+ROOM.limitH*3600000:0;sync();
}

function takeOpen(i){if(!myTurn()||g().drawn>=2)return;
  const c=g().open[i];if(c==='lok'&&g().drawn>0){toast('Ein offener Joker zählt als ganzer Zug.');return}

function takeBlind(){if(!myTurn()||g().drawn>=2)return;const c=drawCard(g());if(c===null){toast('Keine Karten mehr im Stapel.');return}

  me().hand[c]=(me().hand[c]||0)+1;(g().pend=g().pend||[]).push('?');g().drawn+=1;g().drawn>=2?endTurn():sync()}

function tryClaim(s){
  if(!myTurn()){toast(ROOM.status==='playing'?'Du bist nicht dran – '+cur().name+' ist am Zug.':'');return}
  if(g().drawn>0){toast('Du hast schon Karten gezogen – erst den Zug beenden.');return}
  if(g().claims[s.nr]!==undefined){toast('Diese Strecke ist schon gebaut.');return}
  if(ROOM.test){doClaim(s,{col:s.farbe,use:0,lok:0});return}
  const p=me();
  if(p.wagons<s.laenge){toast('Nicht genug Wagons ('+p.wagons+' übrig).');return}
  if(s.doppel_mit!==undefined){
    const other=g().claims[s.doppel_mit];
    if(other!==undefined){
      const abD=R().doppelstrecken_frei_ab||3;
      if(ROOM.players.length<abD){toast('Bei weniger als '+abD+' Spielern ist nur ein Gleis einer Doppelstrecke nutzbar.');return}
      if(other===SEAT){toast('Beide Gleise einer Doppelstrecke dürfen nicht demselben Spieler gehören.');return}
    }
  }
  const opts=[];
  const colors=s.farbe==='grau'?['rot','orange','gelb','gruen','blau','pink','weiss','schwarz']:[s.farbe];
  for(const col of colors){
    const have=p.hand[col]||0,loks=p.hand.lok||0;
    for(let l=0;l<=Math.min(loks,s.laenge);l++){if(have>=s.laenge-l)opts.push({col,use:s.laenge-l,lok:l})}
  }
  if(!opts.length){toast('Nicht genug passende Karten ('+s.laenge+' '+CNAME[s.farbe]+').');return}
  payModal(s,opts);
}

    b.innerHTML=(o.use?o.use+'× <span class="chip" style="background:'+CARDCOL[o.col]+';'+(o.col==='gelb'||o.col==='weiss'?'color:#333':'')+'">'+CNAME[o.col]+'</span> ':'')+(o.lok?(o.use?'+ ':'')+o.lok+'× <span class="chip" style="background:'+CARDCOL.lok+'">Joker</span>':'');

function tunnelStep(s,o){
  const G=g(),rev=[];for(let i=0;i<3;i++){const c=drawCard(G);if(c!==null)rev.push(c)}
  const allLok=o.use===0;
  const extra=rev.filter(c=>allLok?c==='lok':(c===o.col||c==='lok')).length;
  G.discard.push(...rev);
  const p=me();
  let html='<h2>Tunnel: 3 Karten aufgedeckt</h2><div class="reveal">'+rev.map(c=>'<div class="pcard sm pc-'+c+'" title="'+CNAME[c]+'"></div>').join('')+'</div>';
  if(extra===0){html+='<p style="text-align:center;font-size:15px">Keine zusätzlichen Karten nötig!</p><button class="go" id="tOk">Bauen</button>';
    const m=modal(html);m.querySelector('#tOk').onclick=()=>{m.remove();doClaim(s,o)};return}
  const extraCol=(p.hand[o.col]||0)-o.use,extraLok=(p.hand.lok||0)-o.lok;
  const can=[];
  for(let l=0;l<=Math.min(extraLok,extra);l++){if((allLok?0:extraCol)>=extra-l||(allLok&&l===extra))can.push({use:allLok?0:extra-l,lok:l})}
  if(!can.length){html+='<p style="font-size:14px">Du musst <b>'+extra+'</b> zusätzliche Karten zahlen, hast aber nicht genug. Der Bau wird abgebrochen – deine Karten behältst du.</p><button class="go" id="tOk">Verstanden</button>';
    const m=modal(html);m.querySelector('#tOk').onclick=()=>{m.remove();sync()};return}
  html+='<p style="font-size:14px;margin-bottom:8px">Zusätzlich fällig: <b>'+extra+'</b> Karte(n) in '+(allLok?'Joker':CNAME[o.col]+'/Joker')+'.</p><div id="topts"></div><button class="go" id="tPay">Zahlen und bauen</button><button class="cancel" id="tNo">Abbrechen (Karten behalten)</button>';
  const m=modal(html);const wrap=m.querySelector('#topts');let sel=0;
  can.forEach((c2,i)=>{const b=document.createElement('button');b.className='opt'+(i===0?' sel':'');
    b.textContent=(c2.use?c2.use+'× '+CNAME[o.col]:'')+(c2.use&&c2.lok?' + ':'')+(c2.lok?c2.lok+'× Joker':'');
    b.onclick=()=>{sel=i;wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};wrap.appendChild(b)});
  m.querySelector('#tNo').onclick=()=>{m.remove();sync()};
  m.querySelector('#tPay').onclick=()=>{m.remove();const c2=can[sel];doClaim(s,{col:o.col,use:o.use+c2.use,lok:o.lok+c2.lok})};
}
function doClaim(s,o){
  const G=g(),p=me();
  if(o.use){p.hand[o.col]-=o.use;if(!p.hand[o.col])delete p.hand[o.col];for(let i=0;i<o.use;i++)G.discard.push(o.col)}
  if(o.lok){p.hand.lok-=o.lok;if(!p.hand.lok)delete p.hand.lok;for(let i=0;i<o.lok;i++)G.discard.push('lok')}
  p.wagons-=s.laenge;p.score+=PTSv(s.laenge);
  G.claims[s.nr]=SEAT;p.last='baut '+nodes[s.von].name+' – '+nodes[s.nach].name+' (+'+PTSv(s.laenge)+')';G.notice=p.name+' '+p.last;
  endTurn();
}

const ROTE_ORTE=new Set(['Gymnasium','Bahnhof','Sender','Pollen','Vogelsiedlung','Rathaus','Busbahnhof']);
const AUSSEN_ORTE=new Set(['Velbert','Neviges','Wuppertal','Sprockhövel','Hattingen','Essen']);
let TPOSL={};MAP.knoten.forEach(k=>{const n=k.name.replace(/ \((Nordost|Ost)\)/,'');(TPOSL[n]=TPOSL[n]||[]).push([k.x,k.y])});
function ticketCard(tk,cls,badge){
  const MX0=25,MY0=77,MW=933,MH=509,CX=MX0+MW/2,CY=MY0+MH/2;
  const pts=n=>TPOSL[n].map(q=>[MX0+q[0]/100*MW, MY0+q[1]/100*MH]);
  const A=pts(tk.von),B=pts(tk.nach);
  const r1=ROTE_ORTE.has(tk.von),r2=ROTE_ORTE.has(tk.nach);
  const au1=AUSSEN_ORTE.has(tk.von),au2=AUSSEN_ORTE.has(tk.nach);
  const lc=r1&&r2?'#cc0000':(r1||r2?'#e88a00':'#111');
  let svg='';
  A.forEach(a=>B.forEach(b=>{svg+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+lc+'" stroke-width="9"/>'}));
  const mark=(p,rot,aussen)=>{
    const f=rot?'#cc0000':'#111', s=rot?'#111':'#cc0000';
    if(!aussen)return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="15" fill="'+f+'" stroke="'+s+'" stroke-width="5"/>';
    const dx=p[0]-CX,dy=p[1]-CY,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;
    const tip=[p[0]+ux*34,p[1]+uy*34],b1=[p[0]-ux*4+px*17,p[1]-uy*4+py*17],b2=[p[0]-ux*4-px*17,p[1]-uy*4-py*17];
    return '<polygon points="'+tip+' '+b1+' '+b2+'" fill="'+f+'" stroke="'+s+'" stroke-width="4"/>';
  };
  A.forEach(p=>svg+=mark(p,r1,au1));
  B.forEach(p=>svg+=mark(p,r2,au2));
  const name=(n,rot)=>'<tspan fill="'+(rot?'#cc0000':'#111')+'">'+n+'</tspan>';
  return '<div class="tcard '+(cls||'')+'">'
    +'<svg viewBox="0 0 991 621" preserveAspectRatio="none">'
    +'<text x="495" y="56" text-anchor="middle" font-size="46" font-weight="900" font-family="Arial,sans-serif" text-decoration="underline">'
    +name(tk.von,r1)+'<tspan fill="#111"> - </tspan>'+name(tk.nach,r2)+'</text>'
    +svg
    +'<text x="920" y="576" text-anchor="middle" font-size="48" font-weight="900" font-family="Arial,sans-serif" fill="#cc0000">'+tk.punkte+'</text>'
    +'</svg>'+(badge?'<div class="tcheck">✓</div>':'')+'</div>';
}

    wrap.appendChild(c)});

  go.onclick=()=>{m.remove();done(sel)};

let RAND={};MAP.knoten.forEach(k=>{if(k.rand)RAND[k.id]=k.stadt||k.id});
function connected(pi,t){
  // Außenstädte sind Sackgassen: Strecken führen hinein, aber nicht hindurch
  const par={};const find=x=>par[x]===x?x:par[x]=find(par[x]);
  MAP.knoten.forEach(k=>{if(!RAND[k.id])par[k.id]=k.id});
  const uni=(a,b)=>{par[find(a)]=find(b)};
  MAP.strecken.forEach(s=>{if(g().claims[s.nr]!==pi)return;
    if(!RAND[s.von]&&!RAND[s.nach])uni(s.von,s.nach)});
  const touches={};
  MAP.strecken.forEach(s=>{if(g().claims[s.nr]!==pi)return;
    if(RAND[s.von]&&!RAND[s.nach])(touches[RAND[s.von]]=touches[RAND[s.von]]||new Set()).add(find(s.nach));
    if(RAND[s.nach]&&!RAND[s.von])(touches[RAND[s.nach]]=touches[RAND[s.nach]]||new Set()).add(find(s.von))});
  const A=nameToIds[t.von]||[],B=nameToIds[t.nach]||[];
  const cityOf=ids=>{for(const i of ids)if(RAND[i])return RAND[i];return null};
  const ca=cityOf(A),cb=cityOf(B);
  if(!ca&&!cb)return A.some(a=>B.some(b=>find(a)===find(b)));
  if(ca&&!cb)return !!touches[ca]&&touches[ca].has(find(B[0]));
  if(!ca&&cb)return !!touches[cb]&&touches[cb].has(find(A[0]));
  if(!touches[ca]||!touches[cb])return false;
  for(const r of touches[ca])if(touches[cb].has(r))return true;
  return false;
}
function laengsteFor(pi){
  const adj={};MAP.strecken.forEach(s=>{if(g().claims[s.nr]!==pi)return;
    const a=RAND[s.von]?s.von+'#'+s.nr:s.von,b=RAND[s.nach]?s.nach+'#'+s.nr:s.nach;
    (adj[a]=adj[a]||[]).push({to:b,len:s.laenge,nr:s.nr});(adj[b]=adj[b]||[]).push({to:a,len:s.laenge,nr:s.nr})});
  let best=0;const used=new Set();
  function dfs(v,acc){if(acc>best)best=acc;for(const e of (adj[v]||[])){if(used.has(e.nr))continue;
    used.add(e.nr);dfs(e.to,acc+e.len);used.delete(e.nr)}}
  for(const v in adj)dfs(v,0);return best;
}
function finalScore(){
  const bonus=R().laengste_strecke_bonus||0;
  const lang=bonus?ROOM.players.map((p,i)=>laengsteFor(i)):null;
  const maxL=lang?Math.max(...lang):0;
  ROOM.players.forEach((p,i)=>{
    let tP=0,tM=0;p.tickets.forEach(t=>{connected(i,t)?tP+=t.punkte:tM+=t.punkte});
    const lb=(lang&&lang[i]===maxL&&maxL>0)?bonus:0;
    p.res={strecken:p.score,plus:tP,minus:tM};
    if(lang){p.res.laengste=lang[i];p.res.bonus=lb}
    p.total=p.score+tP-tM+lb;
  });
}
function statsSchreiben(){
  if(ROOM.test||ROOM.statsDone||!ROOM.game||!ROOM.game.zuege)return;
  // Nur genau ein Gerät darf werten – per Transaktion abgesichert

    if(err||!ok)return;
    ROOM.statsDone=true;
    const sieger=[...ROOM.players].sort((a,b)=>(b.total||0)-(a.total||0))[0];

    ROOM.players.forEach(p=>{

let ADMIN_OK=false;
function ergebnisLoeschen(key,e,then){
  const m=modal('<h2>Eintrag löschen?</h2><p style="font-size:14px;margin-bottom:12px">Das Spiel vom '
    +new Date(e.ts||0).toLocaleDateString('de-DE')+' (Raum '+(e.code||'?')+') wird aus der Rangliste entfernt. '
    +'Die Gesamtwertung der beteiligten Spieler wird entsprechend korrigiert.</p>'
    +'<button class="go" id="ja">Endgültig löschen</button><button class="cancel" id="nein">Abbrechen</button>');
  m.querySelector('#nein').onclick=()=>m.remove();
  m.querySelector('#ja').onclick=()=>{
    m.remove();
    const auf=[db.ref('ergebnisse/'+key).remove()];
    (e.spieler||[]).forEach((n,i)=>{
      const key2=n.toLowerCase().replace(/[.#$\/\[\]]/g,'_');
      auf.push(db.ref('stats/'+key2).transaction(c=>{
        if(!c)return c;
        c.spiele=Math.max(0,(c.spiele||0)-1);
        c.punkte=(c.punkte||0)-((e.punkte&&e.punkte[i])||0);
        if(e.sieger&&e.sieger.toLowerCase()===n.toLowerCase())c.siege=Math.max(0,(c.siege||0)-1);
        return c.spiele?c:null;}));
    });
    Promise.all(auf).then(()=>{toast('Eintrag gelöscht.');then&&then()})
      .catch(err=>toast('Fehlgeschlagen: '+err.message));
  };
}

function meineSpiele(name){
  db.ref('rooms').get().then(snap=>{
    const all=snap.val()||{},treffer=[];
    for(const code in all){const v=fix(all[code]);
      if(!v||!v.players)continue;
      const i=v.players.findIndex(p=>p.name&&p.name.toLowerCase()===name.toLowerCase());
      if(i<0)continue;
      if(v.status==='over')continue;   // beendete Partien ausblenden
      let st=v.status==='lobby'?'Warteraum':(v.game&&v.game.turn===i?'DU BIST DRAN':'läuft');
      if(v.status==='playing'&&v.limitH&&v.game&&v.game.frist){const ms=v.game.frist-Date.now();
        st+=ms<=0?' · Zeit abgelaufen':' · noch '+Math.max(1,Math.floor(ms/3600000))+' Std.'}
      treffer.push({code,st,n:v.players.length,dran:st==='DU BIST DRAN'});
    }
    if(!treffer.length){toast('Keine laufenden Spiele für "'+name+'" gefunden.');return}
    treffer.sort((a,b)=>(b.dran?1:0)-(a.dran?1:0));
    let html='<h2>Deine laufenden Spiele</h2>';
    treffer.forEach(x=>{html+='<div style="display:flex;gap:6px;margin-bottom:8px">'
      +'<button class="opt" data-c="'+x.code+'" style="flex:1;margin:0"><b style="letter-spacing:.2em">'+x.code+'</b> · '+x.n+' Spieler · <span style="color:'+(x.dran?'#b3372c':'#8a7d63')+';font-weight:'+(x.dran?'700':'400')+'">'+x.st+'</span></button>'
      +'<button class="del" data-d="'+x.code+'" style="width:46px;border-radius:9px;border:1.5px solid #b3372c;background:#fff;color:#b3372c;font-size:17px">🗑</button></div>'});
    html+='<button class="cancel" id="zu">Abbrechen</button>';
    const m=modal(html);
    m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{m.remove();
      document.querySelectorAll('.modal').forEach(x=>x.remove());joinRoom(b.dataset.c,name,MYPIN)});
    m.querySelectorAll('.del').forEach(b=>b.onclick=()=>raumLoeschen(b.dataset.d,()=>{m.remove();meineSpiele(name)}));
    m.querySelector('#zu').onclick=()=>m.remove();
  }).catch(e=>toast('Verbindung fehlgeschlagen: '+e.message));
}

let scale=1,tx=0,ty=0;
function apply(){world.setAttribute('transform','translate('+tx+' '+ty+') scale('+scale+')')}
document.getElementById('zin').onclick=()=>{scale=Math.min(4,scale*1.35);apply()};
document.getElementById('zout').onclick=()=>{scale=Math.max(.6,scale/1.35);apply()};
const stage=document.getElementById('stage');let ptrs=new Map(),lastD=0;
stage.addEventListener('pointerdown',e=>ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}));
stage.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;
  if(ptrs.size===1){const p=ptrs.get(e.pointerId),r=stage.getBoundingClientRect(),f=1000/r.width;
    tx+=(e.clientX-p.x)*f;ty+=(e.clientY-p.y)*f;apply();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY})}
  else if(ptrs.size===2){ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const[p1,p2]=[...ptrs.values()],d2=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    if(lastD)scale=Math.min(4,Math.max(.6,scale*d2/lastD)),apply();lastD=d2}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>stage.addEventListener(ev,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)lastD=0}));
stage.addEventListener('wheel',e=>{e.preventDefault();scale=Math.min(4,Math.max(.6,scale*(e.deltaY<0?1.1:.9)));apply()},{passive:false});

  m.querySelector('#mkRoom').onclick=()=>{const n=nameOk();if(!n)return;const p=pinVal();m.remove();createRoom(n,p)};
  m.querySelector('#myG').onclick=()=>{const n=nameOk();if(!n)return;MYPIN=pinVal();meineSpiele(n)};
  m.querySelector('#jGo').onclick=()=>{const n=nameOk();if(!n)return;const c=m.querySelector('#jcode').value;
    if(c.trim().length!==5){toast('Der Raum-Code hat 5 Buchstaben.');return}const p=pinVal();m.remove();joinRoom(c,n,p)};
})();
