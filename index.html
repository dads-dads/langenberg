        +(liste.length?liste.map(([k,v])=>'<div class="score-row"><span>'+v+'</span><button class="nrm" data-k="'+k+'" style="border:0;background:none;color:#b3372c;font-size:16px">✕</button></div>').join('')
          :'<p style="text-align:center;color:#8a7d63;font-size:14px;padding:10px 0">Noch keine Namen freigegeben.</p>');
      box.querySelector('#nurE').onchange=e=>{db.ref('admin/nurErlaubte').set(e.target.checked);adm.nurErlaubte=e.target.checked;
        toast(e.target.checked?'Nur freigegebene Namen können spielen.':'Alle Namen sind wieder erlaubt.')};
      box.querySelector('#nAdd').onclick=()=>{const v=box.querySelector('#nName').value.trim();
        if(!v)return;db.ref('admin/erlaubt').push(v).then(()=>{m.remove();adminPanel()})};
      box.querySelectorAll('.nrm').forEach(b=>b.onclick=()=>db.ref('admin/erlaubt/'+b.dataset.k).remove().then(()=>{m.remove();adminPanel()}));
    }
    function reset(){
      box.innerHTML='<p style="font-size:14px;margin-bottom:12px">Löscht alle Statistiken, Ergebnisse und Ranglisten unwiderruflich. Laufende Spiele bleiben erhalten.</p>'
        +'<button class="opt" id="rst" style="color:#b3372c;font-weight:700">🗑 Rangliste jetzt zurücksetzen</button>';
      box.querySelector('#rst').onclick=()=>{
        if(!confirm('Alle Ranglisten und Spielergebnisse endgültig löschen?'))return;
        Promise.all([db.ref('stats').remove(),db.ref('ergebnisse').remove()])
          .then(()=>{toast('Rangliste zurückgesetzt.');box.innerHTML='<p style="text-align:center;padding:14px 0">Erledigt.</p>'})
          .catch(e=>toast('Fehlgeschlagen: '+e.message))};
    }
    function beendet(){
      Object.values(ergObj).forEach(e=>{if(!Array.isArray(e.spieler))e.spieler=e.spieler?Object.values(e.spieler).filter(x=>x!=null):[];
        if(!Array.isArray(e.punkte))e.punkte=e.punkte?Object.values(e.punkte):[]});
      const keys=Object.keys(ergObj).sort((x,y)=>(ergObj[y].ts||0)-(ergObj[x].ts||0));
      if(!keys.length){box.innerHTML='<p style="text-align:center;color:#8a7d63;padding:14px 0">Noch keine beendeten Spiele.</p>';return}
      const edName=id=>{const t=Object.values(EDITIONEN).find(e=>(e.meta.statId||e.meta.name)===id);return t?t.meta.name:(id||'Langenberg')};
      box.innerHTML='<button class="cancel" id="expCsv" style="margin:0 0 10px;font-size:13px">⬇ Alle als CSV exportieren</button>'
        +keys.map(k=>{const e=ergObj[k];
          const d=new Date(e.ts||0);const dat=d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
          const flags=(e.test?' · Test':'')+(e.custom?' · Eigene Regeln':'');
          const det=(e.spieler||[]).map((n,i)=>'<div class="score-row"><span>'+(n===e.sieger?'🏆 ':'')+n+'</span><span>'+((e.punkte&&e.punkte[i])||0)+'</span></div>').join('')
            +'<div style="font-size:12px;color:#8a7d63;margin-top:4px">Raum '+(e.code||'?')+' · '+(e.zuege||0)+' Züge</div>';
          return '<div style="display:flex;gap:6px;margin-bottom:8px;align-items:stretch">'
            +'<div class="opt bx" data-k="'+k+'" style="flex:1;margin:0"><b>'+dat+'</b> · '+edName(e.edition)+flags
            +'<div style="font-size:12px;color:#8a7d63;margin-top:3px">🏆 '+(e.sieger||'?')+' · '+((e.spieler||[]).join(', ')||'—')+'</div>'
            +'<div class="bdet" style="display:none;margin-top:6px">'+det+'</div></div>'
            +'<button class="bdel" data-k="'+k+'" style="width:46px;border-radius:9px;border:1.5px solid #b3372c;background:#fff;color:#b3372c;font-size:17px">🗑</button></div>'}).join('');
      box.querySelectorAll('.bx').forEach(el=>el.onclick=()=>{const d=el.querySelector('.bdet');d.style.display=d.style.display==='none'?'':'none'});
      box.querySelectorAll('.bdel').forEach(b=>b.onclick=ev=>{ev.stopPropagation();
        ergebnisLoeschen(b.dataset.k,ergObj[b.dataset.k],()=>{delete ergObj[b.dataset.k];beendet()})});
      box.querySelector('#expCsv').onclick=()=>{
        const rows=[['Datum','Edition','Raum','Züge','Sieger','Spieler','Punkte','Testmodus','Eigene Regeln']];
        keys.forEach(k=>{const e=ergObj[k];
          rows.push([new Date(e.ts||0).toLocaleString('de-DE'),edName(e.edition),e.code||'',e.zuege||0,e.sieger||'',
            (e.spieler||[]).join(' / '),(e.punkte||[]).join(' / '),e.test?'ja':'',e.custom?'ja':''])});
        const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
        const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
        a.download='zug-um-zug-spiele.csv';a.click()};
    }
    const alle=[b1,b2,b3,b4];
    b3.onclick=()=>{alle.forEach(b=>b.classList.remove('on'));b3.classList.add('on');reset()};
    b1.onclick=()=>{alle.forEach(b=>b.classList.remove('on'));b1.classList.add('on');spiele()};
    b2.onclick=()=>{alle.forEach(b=>b.classList.remove('on'));b2.classList.add('on');namen()};
    b4.onclick=()=>{alle.forEach(b=>b.classList.remove('on'));b4.classList.add('on');beendet()};
    spiele();
    m.querySelector('#cl').onclick=()=>m.remove();
  }).catch(e=>toast('Verbindung fehlgeschlagen: '+e.message));
}

function wechsleRaum(code,name,pin){
  try{if(roomRef)roomRef.off()}catch(e){}
  if(window._strafT){clearTimeout(window._strafT);window._strafT=null}
  sdReset();erfuellt=new Set();erfuelltInit=false;pickShown=false;draftKeepFertig=0;draftKey='';lastNotice='';
  document.querySelectorAll('.modal').forEach(x=>x.remove());
  joinRoom(code,name,pin);
}
function spieleWechsler(){
  const myName=(ROOM&&ROOM.players&&ROOM.players[SEAT])?ROOM.players[SEAT].name:'';
  if(!myName){toast('Kein Spielername bekannt.');return}
  db.ref('rooms').get().then(snap=>{
    const all=snap.val()||{},treffer=[];
    for(const code in all){if(code===CODE)continue;const v=fix(all[code]);
      if(!v||!v.players)continue;
      const i=v.players.findIndex(p=>p.name&&p.name.toLowerCase()===myName.toLowerCase());
      if(i<0)continue;
      if(v.status==='over'&&(v.players[i]||{}).fertig)continue;   // erst nach eigener Auswertung wirklich erledigt
      const ed=(v.edition&&EDITIONEN[v.edition]&&(EDITIONEN[v.edition].meta.kurz||EDITIONEN[v.edition].meta.name))||'Langenberg';
      const pl=v.players.map(p=>p.name).join(', ');
      const runde=(v.game&&v.players.length)?Math.floor((v.game.zuege||0)/v.players.length)+1:0;
      const dran=!!(v.game&&v.game.turn===i&&v.status==='playing');
      const amZug=(v.status==='playing'&&v.game&&v.players[v.game.turn])?v.players[v.game.turn].name:'';
      let st=v.status==='over'?'AUSWERTUNG OFFEN':(v.status==='lobby'?'Warteraum':(dran?'DU BIST DRAN':(amZug?amZug+' ist dran':'läuft')));
      if(v.status==='playing'&&(v.limitMin||v.limitH)&&v.game&&v.game.frist){const ms=v.game.frist-Date.now();
        st+=ms<=0?' · Zeit abgelaufen':' · noch '+(ms>=3600000?Math.floor(ms/3600000)+' Std.':Math.max(1,Math.floor(ms/60000))+' Min.')}
      if(v.status==='playing'&&v.game&&v.game.lastRounds>0)st+=' · <b style="color:#c1121f">LETZTE RUNDE</b>';
      treffer.push({code,ed,pl,runde,st,dran});
    }
    if(!treffer.length){toast('Keine weiteren laufenden Spiele für "'+myName+'" gefunden.');return}
    treffer.sort((a,b)=>(b.dran?1:0)-(a.dran?1:0));
    let html='<h2>Andere laufende Spiele</h2>';
    treffer.forEach(x=>{html+='<div class="opt" style="margin-bottom:9px;cursor:default">'
      +'<b>'+x.ed+'</b>'+(x.runde?' · Runde '+x.runde:'')+' · <b style="letter-spacing:.2em">'+x.code+'</b>'
      +' · <span style="color:'+(x.dran?'#b3372c':'#8a7d63')+';font-weight:'+(x.dran?'700':'400')+'">'+x.st+'</span>'
      +'<div style="font-size:12px;color:#8a7d63;margin:3px 0 6px">'+x.pl+'</div>'
      +'<div style="display:flex;gap:6px"><button class="go swGo" data-c="'+x.code+'" style="flex:1;margin:0;padding:8px">In diesen Raum wechseln</button>'
      +'<button class="cancel swTab" data-c="'+x.code+'" title="In neuem Tab öffnen" style="width:auto;margin:0;padding:8px 14px">↗</button></div></div>'});
    html+='<div style="display:flex;gap:8px;align-items:center;margin-top:4px"><span style="font-size:13px;color:#8a7d63">PIN:</span><input type="password" id="swPin" value="'+(MYPIN||'').replace(/"/g,'')+'" style="flex:1"></div>'
      +'<button class="cancel" id="swZu">Schließen</button>';
    const m=modal(html);
    const pin=()=>m.querySelector('#swPin').value.trim();
    m.querySelectorAll('.swGo').forEach(b=>b.onclick=()=>{const c=b.dataset.c,p=pin();m.remove();wechsleRaum(c,myName,p)});
    m.querySelectorAll('.swTab').forEach(b=>b.onclick=()=>{
      try{sessionStorage.setItem('autojoin',JSON.stringify({code:b.dataset.c,name:myName,pin:pin()}))}catch(e){}
      window.open(location.href.split('#')[0],'_blank');
      setTimeout(()=>{try{sessionStorage.removeItem('autojoin')}catch(e){}},2000)});
    m.querySelector('#swZu').onclick=()=>m.remove();
  }).catch(e=>toast('Verbindung fehlgeschlagen: '+e.message));
}
function meineSpiele(name){
  db.ref('rooms').get().then(snap=>{
    const all=snap.val()||{},treffer=[];
    for(const code in all){const v=fix(all[code]);
      if(!v||!v.players)continue;
      const i=v.players.findIndex(p=>p.name&&p.name.toLowerCase()===name.toLowerCase());
      if(i<0)continue;
      if(v.status==='over'&&(v.players[i]||{}).fertig)continue;   // erst nach eigener Auswertung wirklich erledigt
      const amZug=(v.status==='playing'&&v.game&&v.players[v.game.turn])?v.players[v.game.turn].name:'';
      let st=v.status==='over'?'AUSWERTUNG OFFEN':(v.status==='lobby'?'Warteraum':(v.game&&v.game.turn===i?'DU BIST DRAN':(amZug?amZug+' ist dran':'läuft')));
      if(v.status==='playing'&&(v.limitMin||v.limitH)&&v.game&&v.game.frist){const ms=v.game.frist-Date.now();
        st+=ms<=0?' · Zeit abgelaufen':' · noch '+(ms>=3600000?Math.floor(ms/3600000)+' Std.':Math.max(1,Math.floor(ms/60000))+' Min.')}
      const ed=(v.edition&&EDITIONEN[v.edition]&&(EDITIONEN[v.edition].meta.name||v.edition))||'Langenberg';
      const runde=(v.game&&v.players.length)?Math.floor((v.game.zuege||0)/v.players.length)+1:0;
      const istDran=st.startsWith('DU BIST DRAN')||st==='AUSWERTUNG OFFEN';
      if(v.status==='playing'&&v.game&&v.game.lastRounds>0)st+=' · <b style="color:#c1121f">LETZTE RUNDE</b>';
      treffer.push({code,st,pl:v.players.map(p=>p.name).join(', '),ed,runde,dran:istDran});
    }
    if(!treffer.length){toast('Keine laufenden Spiele für "'+name+'" gefunden.');return}
    treffer.sort((a,b)=>(b.dran?1:0)-(a.dran?1:0));
    let html='<h2>Deine laufenden Spiele</h2>';
    treffer.forEach(x=>{html+='<div style="display:flex;gap:6px;margin-bottom:8px">'
      +'<button class="opt" data-c="'+x.code+'" style="flex:1;margin:0"><b>'+x.ed+'</b>'+(x.runde?' · Runde '+x.runde:'')+' · <b style="letter-spacing:.2em">'+x.code+'</b> · <span style="color:'+(x.dran?'#b3372c':'#8a7d63')+';font-weight:'+(x.dran?'700':'400')+'">'+x.st+'</span><div style="font-size:12px;color:#8a7d63;margin-top:3px">'+x.pl+'</div></button>'
      +'<button class="del" data-d="'+x.code+'" style="width:46px;border-radius:9px;border:1.5px solid #b3372c;background:#fff;color:#b3372c;font-size:17px">🗑</button></div>'});
    html+='<button class="cancel" id="zu">Abbrechen</button>';
    const m=modal(html);
    m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{m.remove();
      document.querySelectorAll('.modal').forEach(x=>x.remove());joinRoom(b.dataset.c,name,MYPIN)});
    m.querySelectorAll('.del').forEach(b=>b.onclick=()=>raumLoeschen(b.dataset.d,()=>{m.remove();meineSpiele(name)}));
    m.querySelector('#zu').onclick=()=>m.remove();
  }).catch(e=>toast('Verbindung fehlgeschlagen: '+e.message));
}

// ---------- UI-Helfer ----------
function modal(html,keep){const d=document.createElement('div');d.className='modal';d.innerHTML='<div class="box">'+html+'</div>';
  document.getElementById('modals').appendChild(d);
  try{
    const imSpiel=!document.getElementById('bottom').classList.contains('hidden');
    if(imSpiel&&html.indexOf('id="swPin"')<0&&html.indexOf('id="pname"')<0&&html.indexOf('id="lobSw"')<0){
      const box=d.querySelector('.box');
      const b=document.createElement('button');b.className='cancel';
      b.style.cssText='margin-top:6px;font-size:13px;opacity:.85';
      b.textContent='🔀 Meine laufenden Spiele';
      b.onclick=()=>spieleWechsler();
      box.appendChild(b);
      const h=document.createElement('button');h.className='cancel';
      h.style.cssText='margin-top:6px;font-size:13px;opacity:.85';
      h.textContent='🏠 Zum Startbildschirm';
      h.onclick=()=>zumStart();
      box.appendChild(h);
    }
  }catch(e){}
  return d}
function toast(msg){if(!msg)return;const t=document.createElement('div');t.className='toastMsg';
  const off=60+document.querySelectorAll('.toastMsg').length*46;
  t.style.cssText='position:fixed;top:'+off+'px;left:50%;transform:translateX(-50%);background:#2b2419ee;color:#f0e6d2;padding:10px 18px;border-radius:999px;z-index:99;font-size:14px;max-width:88vw;text-align:center';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}

// Zoom & Pan
let scale=1,tx=0,ty=0;
function apply(){world.setAttribute('transform','translate('+tx+' '+ty+') scale('+scale+')')}
document.getElementById('zin').onclick=()=>{scale=Math.min(4,scale*1.35);apply()};
document.getElementById('zout').onclick=()=>{scale=Math.max(.6,scale/1.35);apply()};
const stage=document.getElementById('stage');let ptrs=new Map(),lastD=0;
stage.addEventListener('pointerdown',e=>ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}));
stage.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;
  if(ptrs.size===1){const p=ptrs.get(e.pointerId),r=stage.getBoundingClientRect(),f=1/Math.min(r.width/1000,r.height/BH);
    tx+=(e.clientX-p.x)*f;ty+=(e.clientY-p.y)*f;apply();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY})}
  else if(ptrs.size===2){ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const[p1,p2]=[...ptrs.values()],d2=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    if(lastD)scale=Math.min(4,Math.max(.6,scale*d2/lastD)),apply();lastD=d2}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>stage.addEventListener(ev,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)lastD=0}));
stage.addEventListener('wheel',e=>{e.preventDefault();scale=Math.min(4,Math.max(.6,scale*(e.deltaY<0?1.1:.9)));apply()},{passive:false});

// ---------- Startbildschirm ----------
function zumStart(){
  try{if(roomRef)roomRef.off()}catch(e){}
  if(window._strafT){clearTimeout(window._strafT);window._strafT=null}
  sdReset();
  roomRef=null;ROOM=null;CODE=null;SEAT=null;
  pickShown=false;draftKeepFertig=0;draftKey='';erfuellt=new Set();erfuelltInit=false;lastNotice='';
  document.querySelectorAll('.modal').forEach(x=>x.remove());
  ['top','stage','bottom'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  landing();
}
function landing(){
  try{const aj=sessionStorage.getItem('autojoin');if(aj){sessionStorage.removeItem('autojoin');const o=JSON.parse(aj);if(o&&o.code){joinRoom(o.code,o.name||'',o.pin||'');return}}}catch(e){}
  const m=modal('<h2 class="serif" style="text-align:center;letter-spacacing:.08em;letter-spacing:.08em">ZUG UM ZUG</h2>'+
    '<p style="text-align:center;font-size:13px;color:#8a7d63;margin:6px 0 16px">Online spielen · 2–5 Spieler · Version '+APP_VERSION+'</p>'+
    '<input type="text" id="pname" placeholder="Dein Name" maxlength="14" style="margin-bottom:8px">'+
    '<input type="password" id="ppin" placeholder="Dein PIN (mind. 4 Zeichen)" maxlength="12" style="margin-bottom:10px">'+
    (Object.keys(EDITIONEN).length>1?'<div style="font-size:13px;color:#8a7d63;margin-bottom:5px">Edition für ein neues Spiel:</div><div class="row" id="edRow" style="justify-content:center;margin:0 0 10px">'
      +Object.keys(EDITIONEN).map(k=>'<button class="opt'+(k===EDITION?' sel':'')+'" data-e="'+k+'" style="width:auto;padding:8px 14px;margin:0">'+(EDITIONEN[k].meta.name||k)+'</button>').join('')+'</div>':'')+
    '<button class="go" id="mkRoom">Neuen Raum erstellen</button>'+
    '<button class="go" id="rndRoom" style="margin-top:8px">🎲 Zufallsspiel (zufällige Karte)</button>'+
    '<div style="display:flex;gap:8px;margin-top:14px"><input type="text" id="jcode" placeholder="Raum-Code" maxlength="5" style="text-transform:uppercase;letter-spacing:.2em;flex:1"><button class="go" id="jGo" style="width:auto;margin-top:0;padding:0 18px">Beitreten</button></div>'+
    '<button class="cancel" id="myG">↩︎ Meine laufenden Spiele</button>'+
    '<button class="cancel" id="rgG">🏆 Ranglisten</button>'+
    '<button class="cancel" id="admG" style="font-size:13px;color:#8a7d63">⚙ Admin</button>'+
    '<p style="font-size:12px;color:#8a7d63;margin-top:10px;text-align:center">Zum Wiedereinstieg denselben Namen wie zuvor eingeben.</p>',true);
  const nameOk=()=>{const n=m.querySelector('#pname').value.trim();
    if(!n){toast('Bitte zuerst deinen Namen eingeben.');return null}
    if(m.querySelector('#ppin').value.trim().length<4){toast('Bitte einen PIN mit mindestens 4 Zeichen wählen.');return null}
    return n};
  const pinVal=()=>m.querySelector('#ppin').value.trim();
  m.querySelectorAll('#edRow .opt').forEach(b=>b.onclick=()=>{
    setEdition(b.dataset.e);
    m.querySelectorAll('#edRow .opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
  m.querySelector('#rgG').onclick=()=>zeigeRangliste();
  m.querySelector('#admG').onclick=()=>adminLogin();
  m.querySelector('#myG2')&&0;
  m.querySelector('#mkRoom').onclick=()=>{const n=nameOk();if(!n)return;const p=pinVal();m.remove();createRoom(n,p)};
  m.querySelector('#myG').onclick=()=>{const n=nameOk();if(!n)return;MYPIN=pinVal();meineSpiele(n)};
  m.querySelector('#jGo').onclick=()=>{const n=nameOk();if(!n)return;const c=m.querySelector('#jcode').value;
    if(c.trim().length!==5){toast('Der Raum-Code hat 5 Buchstaben.');return}const p=pinVal();m.remove();joinRoom(c,n,p)};
  m.querySelector('#rndRoom').onclick=()=>{const n=nameOk();if(!n)return;const p=pinVal();
    const keys=Object.keys(EDITIONEN),k=keys[Math.floor(Math.random()*keys.length)];
    setEdition(k);m.remove();
    toast('Zufallskarte: '+(EDITIONEN[k].meta.name||k));
    createRoom(n,p)};
}
landing();
