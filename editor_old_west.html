<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old West Feld-Editor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#5a4632;color:#2b2419;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#info{color:#f0e6d2;padding:8px 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#333}
svg{position:absolute;inset:0;width:100%;height:100%}
.fbox{fill:transparent;stroke:#ff2020;stroke-width:1.2;cursor:grab;pointer-events:all}
.fbox.sel{cursor:grabbing}
#steps{display:flex;gap:4px;align-items:center;margin-left:8px}
#steps button.on{background:#5a4632;color:#f0e6d2}
.fbox.sel{stroke:#00c8ff;stroke-width:2.5}
.fbox.ok{stroke:#25c460;stroke-width:1.2}
.knode{fill:rgba(0,170,255,.20);stroke:#00a0ff;stroke-width:2;cursor:grab;pointer-events:all}
.knode.sel{fill:rgba(255,212,0,.30);stroke:#ffd400;stroke-width:3.5}
#fort{color:#f0e6d2;font-size:13px;opacity:.85}
#panel{background:#faf7ee;border-top:3px solid #b08d3e;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#panel .row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
#panel button{padding:10px 12px;border-radius:8px;border:1.5px solid #5a4632;background:#fff;font-size:15px;font-weight:600;min-width:48px}
#panel button:active{background:#efe8d4}
#rname{text-align:center;font-size:14px;font-weight:600;margin-bottom:6px;min-height:18px}
textarea{width:100%;height:70px;font-size:11px;font-family:monospace;margin-top:6px;display:none}
#zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #5a4632;background:#faf7ee;font-size:20px}
</style>
</head>
<body>
<div id="info"><b>Feld-Editor Old West</b><span>Feld oder Stadt antippen → ziehen bzw. Knöpfe → am Ende „Export"</span><span id="fort"></span></div>
<div id="stage">
  <svg id="svg" viewBox="0 0 1000 1500"><g id="world"></g></svg>
  <div id="zoom"><button id="zin">+</button><button id="zout">−</button></div>
</div>
<div id="panel">
  <div id="rname">Kein Feld gewählt</div>
  <div class="row">
    <button data-a="l">←</button><button data-a="r">→</button><button data-a="u">↑</button><button data-a="d">↓</button>
    <button data-a="rl">⟲</button><button data-a="rr">⟳</button>
    <span id="steps"><span style="font-size:13px;align-self:center">Schritt:</span>
      <button data-step="1">1</button><button data-step="2" class="on">2</button><button data-step="5">5</button>
    </span>
  </div>
  <div class="row">
    <button data-a="len-">Kürzer</button><button data-a="len+">Länger</button>
    <button data-a="w-">Schmaler</button><button data-a="w+">Breiter</button>
    <button id="verteil">Felder neu verteilen</button><button id="exp" style="background:#5a4632;color:#f0e6d2">Export</button>
  </div>
  <textarea id="out" readonly></textarea>
</div>

const MAP = {"meta": {"name": "Old West","statId": "Zug um Zug Old West","kurz": "Old West","version": "0.91","spieler": "2-6","wagons_pro_spieler": 40,"bild": "old_west_karte.jpg","tkbild": "auftrag_old_west.jpg","board_h": 1179,"hinweis": "v0.91: Alle 41 Staedte um 3 Schritte nach rechts und 1 Schritt nach oben verschoben (Vorgabe David), tkx/tky neu berechnet, alle 139 Strecken geprueft. Regeltexte praezisiert (Punktevergabe, Heimatstadt-Marker, Alvin).","farben": ["rot","orange","gelb","gruen","blau","pink","weiss","schwarz","grau"],"aussenstaedte": "Keine Randstaedte, keine Auslandsziele.","faehrenregel": "Faehren sind graue Strecken mit Lok-Symbolen; pro Lok-Symbol muss eine Lok gezahlt werden. Einzige Faehre: San Francisco - Los Angeles (Kuestenstrecke, grau 7, 3 Loks).","heimatstadtregel": "Heimatstadt: Nach der Zielkartenwahl waehlt der in Spielreihenfolge LETZTE Spieler zuerst seine Heimatstadt, dann geht es gegen den Uhrzeigersinn weiter (der Startspieler waehlt zuletzt). Der Heimatstadt-Marker ist einer der 3 Stadtmarker - es koennen also nur noch 2 weitere Staedte dazugekauft werden (max. 3 kontrollierte Staedte inkl. Heimatstadt). Jede Stadt kann nur von einem Spieler kontrolliert werden. Netzzwang: Die erste Strecke muss an der eigenen Heimatstadt beginnen, jede weitere an einer Stadt, die bereits mit dem eigenen Streckennetz verbunden ist.","stadtmarkerregel": "Stadtmarker: Nach dem Bau einer Strecke darf der Spieler optional 1 Stadtmarker auf eine der beiden gerade verbundenen Staedte legen (sofern dort noch kein Marker liegt und er noch Marker uebrig hat). Kosten: 2 Wagenkarten derselben Farbe (Lokomotiven zaehlen als Joker, auch 2 Loks moeglich). Marker werden nie versetzt. Max. 1 Marker pro Stadt.","punkteregel": "Punktevergabe Old West: Der Bauer einer Strecke erhaelt die Streckenpunkte wie gewohnt, AUSSER mindestens eine der beiden Endstaedte wird von einem ANDEREN Spieler kontrolliert. Dann erhaelt jeder Spieler, der eine Endstadt kontrolliert, die vollen Streckenpunkte (der Bauer nur, wenn er selbst eine der Endstaedte kontrolliert - sonst geht er leer aus). Kontrolliert ein Spieler beide Endstaedte, erhaelt er die doppelten Punkte. Sind beide Endstaedte unkontrolliert, erhaelt der Bauer die Punkte normal. Gewertet wird mit dem Markerstand VOR dem Setzen eines neuen Markers.","alvinregel": "Alvin (Variante): Alvin das Alien startet in Roswell. In Roswell darf waehrend der GESAMTEN Partie keine Heimatstadt gewaehlt und kein Stadtmarker gesetzt werden. Wer eine Strecke baut, die zu Alvins aktuellem Aufenthaltsort fuehrt, faengt ihn: sofort +10 Punkte, danach versetzt der Faenger Alvin in eine seiner kontrollierten Staedte. Dort kann ihn nur ein ANDERER Spieler erneut fangen (nicht der Spieler, der ihn dorthin gesetzt hat). Bei Spielende erhaelt der Besitzer der Stadt, in der Alvin steht, +10 Punkte.","bonusregel": "Globetrotter-Bonus: 15 Punkte fuer die meisten erfuellten Zielkarten (bei Gleichstand erhalten alle Beteiligten 15 Punkte). Kein Bonus fuer die laengste Strecke.","regeln": {"startauftraege": {"ziehen": 5,"mindestens_behalten": 3},"auftraege_nachziehen": {"ziehen": 4,"mindestens_behalten": 1},"starthandkarten": 4,"doppelstrecken_frei_ab": 3,"punkte_pro_laenge": {"1": 1,"2": 2,"3": 4,"4": 7,"5": 10,"6": 15,"7": 18},"laengste_strecke_bonus": 0,"meiste_auftraege_bonus": 15,"heimatstadt": true,"stadtmarker_pro_spieler": 3,"stadtmarker_kosten": "2 gleichfarbige Wagenkarten (Loks erlaubt)","zugzeit": "Zugzeit pro Spiel frei einstellbar (Stunden + Minuten); nach Ablauf werden automatisch 2 Karten vom verdeckten Stapel gezogen.","kennwort": "Jeder Spieler waehlt einen PIN; Wiedereinstieg nur mit Name + PIN."},"tk_vb": {"w": 700,"h": 1120},"tk_hoch": true,"tk_einzelziel": true,"tk": {"mx0": 30,"my0": 160,"mw": 640,"mh": 755},"tk_titel": {"y1": 60,"y2": 88,"font": 26,"farbe": "#5a3d18"},"tk_punkte": {"x": 628,"y": 1098,"font": 44,"farbe": "#7a1a1a"}},"knoten": [{"id": "seattle","name": "Seattle","x": 18.     if(sel.typ!=='k'){
      if(a==='rl')f.deg-=STEP; if(a==='rr')f.deg+=STEP;
      if(a==='len+')f.l+=3*DX; if(a==='len-')f.l-=3*DX;
      if(a==='w+')f.w+=2*DY; if(a==='w-')f.w-=2*DY;
      f.deg=+f.deg.toFixed(1);f.l=+f.l.toFixed(2);f.w=+f.w.toFixed(2);
    }
    f.x=+f.x.toFixed(2);f.y=+f.y.toFixed(2);
    sel.geaendert=true;draw(sel);
    if(sel.typ==='k')select(sel);
  };
});
document.getElementById('fort').textContent=MAP.strecken.filter(s=>s.geprueft).length+' von '+MAP.strecken.length+' Strecken fertig';
// ---- Felder einer Strecke neu auf die Gerade legen ----
const posOf={};MAP.knoten.forEach(k=>posOf[k.id]=k);
function verteile(s){
  const a=posOf[s.von], b=posOf[s.nach];
  const ax=a.x/100*KW, ay=a.y/100*KH, bx=b.x/100*KW, by=b.y/100*KH;
  const d=Math.hypot(bx-ax,by-ay); if(!d)return;
  const deg=Math.atan2(by-ay,bx-ax)*180/Math.PI;
  const nx=-(by-ay)/d, ny=(bx-ax)/d;
  let v=0; if(s.doppel_mit)v=(s.nr<s.doppel_mit?-VERSATZ:VERSATZ);
  const rand=Math.min(58,d*0.18), t0=rand/d, t1=1-rand/d;
  s.felder.forEach((f,i)=>{
    const t=t0+(t1-t0)*(i+0.5)/s.laenge;
    f.x=+((ax+(bx-ax)*t+nx*v)/KW*100).toFixed(2);
    f.y=+((ay+(by-ay)*t+ny*v)/KH*100).toFixed(2);
    f.deg=+deg.toFixed(1);
  });
}
document.getElementById('verteil').onclick=()=>{
  if(!sel){alert('Erst eine Stadt oder ein Feld wählen.');return}
  let betroffen;
  if(sel.typ==='k')betroffen=MAP.strecken.filter(s=>s.von===sel.k.id||s.nach===sel.k.id);
  else betroffen=[sel.s];
  const offen=betroffen.filter(s=>!s.geprueft);
  const fertig=betroffen.length-offen.length;
  if(!offen.length){alert('Alle betroffenen Strecken sind bereits als geprüft markiert – nichts geändert.');return}
  const txt='Felder von '+offen.length+' Strecke(n) neu auf die Gerade legen?'
    +(fertig?'\n('+fertig+' bereits geprüfte Strecke(n) bleiben unangetastet.)':'');
  if(!confirm(txt))return;
  offen.forEach(verteile);
  items.forEach(it=>{if(offen.includes(it.s)){it.geaendert=true;draw(it)}});
};
document.getElementById('exp').onclick=()=>{
  const felder=[],knoten=[];
  items.forEach(it=>{if(it.geaendert)felder.push({strecke:names[it.s.von]+'-'+names[it.s.nach],farbe:it.s.farbe,nr:it.s.nr,feld:it.idx+1,
    x:it.f.x,y:it.f.y,deg:it.f.deg,l:it.f.l,w:it.f.w})});
  knotenItems.forEach(it=>{if(it.geaendert)knoten.push({id:it.k.id,name:it.k.name,x:it.k.x,y:it.k.y})});
  const ta=document.getElementById('out');ta.style.display='block';
  ta.value=(felder.length||knoten.length)?JSON.stringify({knoten,felder}):'Keine Änderungen.';
  ta.select();try{document.execCommand('copy')}catch(e){}
};
// Zoom & Pan
let scale=1,tx=0,ty=0;
function apply(){world.setAttribute('transform','translate('+tx+' '+ty+') scale('+scale+')')}
document.getElementById('zin').onclick=()=>{scale=Math.min(8,scale*1.4);apply()};
document.getElementById('zout').onclick=()=>{scale=Math.max(.6,scale/1.4);apply()};
const stage=document.getElementById('stage');let ptrs=new Map(),lastD=0;
stage.addEventListener('pointerdown',e=>ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}));
stage.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;
  if(ptrs.size===1){const p=ptrs.get(e.pointerId),r=stage.getBoundingClientRect(),f=1000/r.width;
    tx+=(e.clientX-p.x)*f;ty+=(e.clientY-p.y)*f;apply();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY})}
  else if(ptrs.size===2){ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const[p1,p2]=[...ptrs.values()],d2=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    if(lastD)scale=Math.min(8,Math.max(.6,scale*d2/lastD)),apply();lastD=d2}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>stage.addEventListener(ev,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)lastD=0}));
stage.addEventListener('wheel',e=>{e.preventDefault();scale=Math.min(8,Math.max(.6,scale*(e.deltaY<0?1.1:.9)));apply()},{passive:false});
</script>
